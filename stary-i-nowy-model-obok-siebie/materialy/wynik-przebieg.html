 \"npm --prefix campsite-console test\",\n  \"przygotowanie\": \"seeder (moduł campsite-seeder, ComparisonInput, tylko stary model, przy każdym starcie): lista lokalna z kartami domowymi na regionach Dalmatia i Istria (M4); partnerzy Kvarner Club i Alpine Club z wymianą plików V1 w ACCEPTANCE_SEED_EXCHANGE_DIR/\u003cpartner> (eksport listy kart do obu — M2, import kart od Alpine Club — M3), katalogi partnerów czyszczone przy starcie; karty sieci z seedu znów czekają na eksport (stan synchronizacji ADD); plik kart Alpine Club w cards-in/cards-seed.csv (dwie karty sieci, karta innego wydawcy, własna karta partnera) — wejście jednorazowe odtwarzane przy starcie. Wymaga CAMPSITE_DEMO_RESEED=false (reseed demo kasuje wyjątki wymiany seedu — seeder zatrzymuje wtedy start) i SPRING_QUARTZ_AUTO_STARTUP=false (job wymiany zjadłby plik). Konsola: użytkownik admin / demo-admin (zakres HR SITES i HR ISSUERS widzi seed).\",\n  \"skille\": \"41ef2f2\"\n}\n"},{"plik":"zrodlo.md","krok":"swappable-dsl.1","rozmiar":86921,"tresc":"## Pogłębienie: party\n\n> Pogłębienie (archetype-storyteller, tryb pogłębienie), 2026-10-24, osobne uruchomienie po skanie. Prompt uczestnika:\n> `/archetype-storyteller Pogłębienie: party. Skan: analiza/archetypy.md. Miejsca: ValidationService.isCardAcceptedAt, GroupServiceHelper.extractAllAcceptingGroupIds, LocalCardListService.buildLocalCardList, IssuerExchangeService.exportCards, IssuerCardImportService.isNetworkCard` + bolączki z adresami w kodzie (niżej).\n> Mapper: osobny agent (narzędzie Agent), tryb „wskazane miejsca”; 2 rundy (pytania → odpowiedzi → KOMPLETNE).\n\n**Wynik w jednym zdaniu:** wystąpienie Party zmapowane kompletnie; umowy akceptacji, podległość wydawców i przypisania obsługi stają się relacjami między stronami, z których wynika, gdzie karta ładuje — bez udziału regionów.\n\n| wystąpienie | archetyp | poziom złożoności | status mapowania | liczba założeń |\n|---|---|---|---|---|\n| Wydawcy kart, partnerzy i obsługa kempingu jako strony: kto przez kogo i gdzie może ładować | Party | 3 | KOMPLETNE | 8 |\n\n### Opowieść i łączenie\n\nBez zmian względem sekcji „Opowieść” skanu: jedno wystąpienie, bez integracji i bez odniesień semantycznych. Pole `IDENTYFIKATORY I RZUTY` mappera (kemping przy słupku, UID karty z wydawcą, rynek kempingu, kod partnera wymiany) nie ma drugiego końca wśród wystąpień PASUJE, więc żadnego odniesienia nie dodaje.\n\n### Mapowanie\n\n### Party Archetype Model: sieć kempingów, wydawcy kart, partnerzy i obsługa\n\n#### Complexity Level\nPoziom 3. Partner jest jednocześnie wydawcą kart i miejscem ładowania („Działa to też w drugą stronę: goście sieci ładują u partnera”, business-context.md §2 Wydawcy kart). Są wydawcy z organizacją nadrzędną i z podgrupami („Sieć ma też wydawców międzynarodowych i wydawców z podgrupami”, §2). Relacje decydują o logice: od relacji wydawca → organizacja nadrzędna zależy, czy karta dostanie prąd (problem.md, Pytanie 3). Do tego dochodzą prawa ładowania ludzi obsługi (§2 Pracownicy).\n**W zakresie:** typy stron i PartyId, identyfikator karty jako RegisteredIdentifier, role globalne i role w relacjach, relacje z regułami i ważnością, uprawnienia wyprowadzane z relacji (karta uprawnień), polityki (przypisania karty, wymiany z partnerem).\n**Poza zakresem:** adresy i zgody (wejście ich nie pokazuje), RoleRequirements, capabilities w sensie „co strona umie” (prawa ładowania to uprawnienia z relacji, nie kompetencje).\n\n#### Concept Mapping\n\n| Pojęcie domenowe | Element archetypu Party | Uwagi |\n|---|---|---|\n| Sieć (operator) | Company | sama też jest wydawcą (karty sieci) |\n| Wydawca kart (partner) | Company + rola globalna WYDAWCA_KART | rola, nie typ; ten sam podmiot może być też OPERATOREM_MIEJSC |\n| Partner jako miejsce, gdzie ładują goście sieci | ta sama Company, rola OPERATOR_MIEJSC_ŁADOWANIA + relacja UMOWA_AKCEPTACJI (Sieć → kemping partnera) | wielorolowość (element 2) |\n| Organizacja nadrzędna wydawcy | Company + relacja PODLEGA (wydawca → organizacja nadrzędna) | realna relacja między firmami (potwierdzone: zostaje wariant roboczy) |\n| Podgrupa wydawcy | OrganizationUnit + relacja JEDNOSTKA_WYDAWCY | kartę wolno zmieniać wydawcy i jego jednostkom (Pytanie 9) |\n| Kemping | OrganizationUnit (sieci albo właściciela afiliowanego) z rolą MIEJSCE_ŁADOWANIA | kemping działa: przyjmuje karty, przejmuje karty, ma obsługę |\n| Właściciel afiliowany (kempingu niezależnego) | Person albo Company + relacja WŁASNOŚĆ_KEMPINGU | wejście nie przesądza, czy to osoba, czy firma; model dopuszcza obie |\n| Umowa akceptacji („karty wydawcy działają na wskazanych kempingach”) | PartyRelationship UMOWA_AKCEPTACJI: WYDAWCA → MIEJSCE_ŁADOWANIA, z ważnością | jedna relacja na każdy kemping wymieniony wprost; region tylko pomaga go wybrać przy zawieraniu (potwierdzone) |\n| Umowa „odziedziczona po organizacji nadrzędnej” | uprawnienie wyprowadzone po ścieżce PODLEGA → UMOWA_AKCEPTACJI, **sumowane** z umowami własnymi | potwierdzone: własna umowa nie zabiera kempingów z umowy organizacji nadrzędnej |\n| „Tryb dostępu”: otwarty na karty sieci / tylko własne karty obsługi | istnieje albo nie istnieje relacja UMOWA_AKCEPTACJI (Sieć jako wydawca → kemping afiliowany) | przełączenie trybu = zawarcie albo zakończenie relacji, bez przenoszenia kempingu w drzewie |\n| Zgoda kempingu na przejmowanie kart powitalnych | atrybut roli MIEJSCE_ŁADOWANIA kempingu afiliowanego (polityka przejęcia) | |\n| Przejęcie karty powitalnej | przeniesienie identyfikatora karty z puli sieci do właściciela kempingu, z relacją PRZYPISANIE_OBSŁUGI do tego kempingu | sama pula to pojęcie niezmapowane |\n| Karta (UID RFID) | RegisteredIdentifier KARTA_RFID z ważnością i wydawcą (PartyId) | karta nie jest stroną |\n| „Karta należy do wydawcy; zmiany od innego są odrzucane” | reguła przypisania identyfikatora: zmieniać go może tylko wydawca, który go nadał (albo jego jednostka lub podmiot zależny) | element 3, własność karty |\n| Karta sieci a karta wydawcy | ten sam identyfikator, różni się wydawcą (Sieć vs partner) | bez „poddrzewa NETWORK CARD” |\n| Gość z kartą wydawcy | brak strony: sieć zna tylko identyfikator karty i jej wydawcę | gość, który nigdy się nie rejestruje, nie tworzy strony |\n| Gość sieci (karta sieci) | Person, gdy sieć go meldowała; inaczej sam identyfikator | założenie |\n| Pracownik obsługi, dozorca, sezonowy | Person + relacja PRZYPISANIE_OBSŁUGI → kemping | element 5 |\n| Ekipa remontowa | OrganizationUnit EKIPA + PRZYPISANIE_OBSŁUGI → kempingi; członkowie przez CZŁONEK_EKIPY | potwierdzone: przypisanie ma osoba albo ekipa, więc w roli OBSŁUGA osoba i organizacja są wymienne (element 4 ma teraz pokrycie) |\n| Prawo ładowania obsługi („bez ograniczeń”) | uprawnienie ŁADOWANIE_OBSŁUGI wyprowadzone z PRZYPISANIE_OBSŁUGI, ważne tyle, ile relacja | omijanie budżetu mocy i zajętego gniazda to decyzja procesu, nie Party |\n| „Tylko słupki 3–7” | zawężenie uprawnienia do części miejsca (zakres miejsca jako atrybut przypisania) | archetyp nie zna słupków |\n| Wymiana kart z partnerem (eksport / import) | wynika z UMOWA_AKCEPTACJI w obu kierunkach: eksport = Sieć ma umowę z miejscami partnera; import = partner ma ważną umowę z miejscami sieci + rola WYDAWCA_KART | dzisiejszy filtr „najbliższy w górę drzewa wydawców” zastępują relacje i wyjątki nadawane wprost |\n| Operator sieci, administrator rynku (zakres w konsoli) | Person + relacja ODPOWIADA_ZA (osoba → kemping/rynek) | tylko jako źródło „w moim zakresie”; uwierzytelnianie poza Party |\n\n#### Unmapped Concepts\n- Region i rynek jako grupowanie do raportów i rozliczeń. Nie są stronami ani relacjami, z których wynikają uprawnienia: przeniesienie kempingu do innego regionu nie zmienia tego, kto na nim ładuje (potwierdzone, cel B1).\n- Drzewo grup i reguła „najbliższe ustawienie wyżej”: mechanizm dzisiejszego rozwiązania, zastąpiony relacjami i polityką.\n- Słupek, gniazdo, stanowisko, sekcja i budżet mocy: rzeczy i zasoby, nie strony.\n- Lokalna lista kart, jej pojemność i kolejność (karty obsługi przed kartami gości): reguła dystrybucji na sprzęt.\n- Pula kart powitalnych danego kraju (zapas niewydanych kart).\n- Ważność i blokada karty, płatność QR: część decyzji o prądzie poza Party.\n- Rozliczenia z wydawcami, raport rozliczeniowy wydawcy, kemping macierzysty gościa do rozliczeń.\n- Treść i warunki umowy akceptacji poza tym, gdzie działają karty (stawki, obowiązki).\n\n#### Party Types\n\n| Typ strony | Reprezentuje | Własne dane | Uwagi |\n|---|---|---|---|\n| Company | sieć, wydawcy kart/partnerzy, organizacje nadrzędne wydawców, właściciel afiliowany będący firmą | nazwa, kraj | podtypy formy prawnej niepotrzebne |\n| OrganizationUnit | kemping, podgrupa wydawcy, ekipa remontowa | nazwa (także lokalna, CAMP-229) | |\n| Person | pracownik obsługi, dozorca, członek ekipy, operator konsoli, właściciel afiliowany będący osobą, meldowany gość sieci | imię, nazwisko | |\n\n**PartyId:** losowy UUID nadawany w aplikacji, jedna przestrzeń identyfikatorów dla wszystkich typów. Ani nazwa grupy („AFFILIATE …”, „NETWORK CARD”), ani miejsce w drzewie nie identyfikują strony.\n\n#### Registered Identifiers\n\n| Identyfikator | Wartość / walidacja | Ważność | Komu można przypisać |\n|---|---|---|---|\n| KARTA_RFID | UID karty, unikalny w całym systemie | od–do (wygaśnięcie, blokada) | posiadaczowi: Person (obsługa, meldowany gość) albo samemu wydawcy, gdy posiadacz jest nieznany sieci; zawsze z polem „wydawca” (PartyId z rolą WYDAWCA_KART) |\n| KOD_PARTNERA_WYMIANY | kod partnera w plikach wymiany | bez terminu | Company z rolą WYDAWCA_KART |\n\n**Polityka przypisania:** złożona z małych polityk, egzekwowana w `add(identifier, policy)`:\n(a) jeden UID = jeden wydawca; zmieniać albo wyłączać może tylko ten wydawca albo jego jednostka (JEDNOSTKA_WYDAWCY) lub podmiot zależny (PODLEGA w dół);\n(b) partner nigdy nie przejmuje karty, której wydawcą jest Sieć;\n(c) przejęcie karty powitalnej zmienia posiadacza na właściciela kempingu tylko wtedy, gdy kemping ma politykę przejęcia „tak” i nie ma relacji UMOWA_AKCEPTACJI z Siecią.\nPolityki pochodzą ze stałej konfiguracji.\n\n#### Roles\n\n**Strategia:** 3, PartyRoleType. Role przybywają w czasie działania i zależą od rynku (wydawcy międzynarodowi, partnerzy w obu kierunkach), a kemping afiliowany zmienia charakter bez wdrożenia.\n\n| Rola | Forma | Kto może | Kto ją pełni |\n|---|---|---|---|\n| WYDAWCA_KART | globalna, także strona `from` w UMOWA_AKCEPTACJI | Company | partnerzy, Sieć |\n| OPERATOR_MIEJSC_ŁADOWANIA | globalna | Company, Person | Sieć, partner, właściciel afiliowany |\n| MIEJSCE_ŁADOWANIA | strona `to` w UMOWA_AKCEPTACJI i PRZYPISANIE_OBSŁUGI | OrganizationUnit (kemping) | kempingi sieci, partnera, afiliowane |\n| ORGANIZACJA_NADRZĘDNA / PODMIOT_ZALEŻNY | w relacji PODLEGA | Company / Company | grupa wydawców / wydawca |\n| WŁAŚCICIEL / KEMPING_WŁASNY | w relacji WŁASNOŚĆ_KEMPINGU | Person, Company / OrganizationUnit | właściciel afiliowany, Sieć |\n| OBSŁUGA | w relacji PRZYPISANIE_OBSŁUGI (from) | Person albo OrganizationUnit (ekipa) | dozorca, sezonowy, ekipa |\n| ODPOWIEDZIALNY | w relacji ODPOWIADA_ZA | Person | operator sieci, administrator rynku |\n\n#### Party Core vs Orbiting Data\n\n**Rdzeń atomowy:** PartyId, identyfikatory, role, version.\n\n| Dane | Decyzja | Uzasadnienie |\n|---|---|---|\n| Karty (KARTA_RFID) | osobna jednostka spójności kluczowana PartyId posiadacza | tysiące kart u wydawcy, zmiany nocne z importu; reguła unikalności UID i wydawcy dotyczy karty, nie całej strony |\n| Polityka przejmowania kart powitalnych kempingu | obok rdzenia, przy roli MIEJSCE_ŁADOWANIA | zmienia się niezależnie, ustawia ją operator |\n| Uprawnienia do konsoli | poza Party | uwierzytelnianie |\n\n#### Relationships\n\n**Granica spójności:** PartyRelationship jako autonomiczna jednostka. Reguły dotyczą obu stron, relacji jest dużo, a reorganizacja nie może blokować stron.\n\n| Relacja | From | To | Ważność | Reguły (ilość / jakość / czas) | Naruszenia |\n|---|---|---|---|---|---|\n| UMOWA_AKCEPTACJI | WYDAWCA_KART (partner albo Sieć) | MIEJSCE_ŁADOWANIA (kemping, wymieniony wprost) | od–do (domyślnie otwarta) | brak / from ma rolę WYDAWCA_KART, to jest kempingiem; kemping „tylko własne karty” nie ma umowy z Siecią / brak | zapobiegane |\n| PODLEGA | PODMIOT_ZALEŻNY (wydawca) | ORGANIZACJA_NADRZĘDNA (Company) | od–do | jedna organizacja nadrzędna naraz / obie strony to organizacje / brak; bez cykli | zapobiegane |\n| JEDNOSTKA_WYDAWCY | podgrupa (OrganizationUnit) | WYDAWCA_KART | otwarta | jedna nadrzędna / brak / brak | zapobiegane |\n| WŁASNOŚĆ_KEMPINGU | WŁAŚCICIEL (Person/Company) | kemping | od–do | jeden właściciel naraz / brak / brak | zapobiegane |\n| PRZYPISANIE_OBSŁUGI | OBSŁUGA (Person albo ekipa) | MIEJSCE_ŁADOWANIA (kemping) | od–do (ekipa: miesiąc, CRD-201) | brak / zakres miejsca jako atrybut (słupki 3–7) / brak | zapobiegane |\n| CZŁONEK_EKIPY | Person | EKIPA (OrganizationUnit) | od–do | brak | zapobiegane |\n| ODPOWIADA_ZA | ODPOWIEDZIALNY (Person) | kemping albo rynek | od–do | brak | zapobiegane |\n\nSkutki krzyżowe:\n- Zakończenie PODLEGA odbiera uprawnienia, które szły tą ścieżką. Umowy własne zostają.\n- Zakończenie WŁASNOŚĆ_KEMPINGU nie unieważnia kart już przejętych.\n- Zakończenie CZŁONEK_EKIPY odbiera osobie uprawnienia ekipy.\n- **Przeniesienie kempingu do innego regionu nie dotyka żadnej relacji.**\n\n#### Permissions in the Context of Other Parties\n\n| Uprawnienie | Kto → wobec kogo | Źródło | Ważność | Używa go decyzja (+ inne dane) |\n|---|---|---|---|---|\n| KARTY_DZIAŁAJĄ_TU | wydawca → kemping | **suma**: UMOWA_AKCEPTACJI wydawcy wprost ∪ UMOWA_AKCEPTACJI każdej organizacji wyżej po ścieżce PODLEGA | z relacji (przy ścieżce: część wspólna ważności PODLEGA i umowy) | „czy dać prąd” przy słupku (+ ważność karty, gniazdo, płatność QR); budowa lokalnej listy kart (+ pojemność) |\n| ŁADOWANIE_OBSŁUGI | osoba → kemping (wprost albo przez CZŁONEK_EKIPY → przypisanie ekipy) | PRZYPISANIE_OBSŁUGI z zakresem miejsca | z relacji | „czy dać prąd od razu” (+ pominięcie budżetu mocy: reguła procesu) |\n| WYMIANA_KART | Sieć ↔ partner | eksport: UMOWA_AKCEPTACJI(Sieć → miejsce partnera); import: UMOWA_AKCEPTACJI(partner → miejsce sieci); wyjątki jako nadanie wprost | z relacji / własna dla wyjątku | nocna wymiana plików (+ statusy synchronizacji) |\n| ZMIANA_KARTY | wydawca → identyfikator karty | wydawca karty albo jego jednostki i podmioty zależne | z relacji | import kart od partnera |\n| PRZEJĘCIE_KARTY_POWITALNEJ | kemping afiliowany → karta z puli | polityka przejęcia przy roli + brak UMOWA_AKCEPTACJI z Siecią | własna (ustawienie) | odrzucenie karty na słupku (+ kraj puli: poza Party) |\n\nNadanie wprost (bez relacji) tylko dla wyjątków w wymianie z partnerem. Każde takie nadanie sygnalizuje brakującą relację.\n**Karta uprawnień** strony: wszystkie pozycje ze źródłem (umowa własna albo umowa organizacji X po ścieżce PODLEGA, przypisanie osoby albo ekipy) i z ważnością. Kemping objęty i umową własną, i nadrzędną ma dwie pozycje źródła. Zdjęcie jednej umowy nie odbiera go, dopóki trwa druga.\n\n#### Capabilities\nPoza zakresem. Prawo ładowania obsługi jest uprawnieniem z przypisania, nie kompetencją.\n\n#### Questions the Model Answers\n\n| Pytanie | Odpowiada |\n|---|---|\n| Czy wydawca tej karty ma umowę obejmującą kemping tego słupka? (Pyt. 1) | KARTY_DZIAŁAJĄ_TU (wydawca z identyfikatora karty, kemping słupka) |\n| Karty których wydawców przyjmuje ten kemping? (Pyt. 2) | odwrotne przejście UMOWA_AKCEPTACJI + wszyscy podmioty zależne (PODLEGA w dół) od stron tych umów |\n| Na których kempingach działają karty wydawcy i czy to umowa własna, czy przez organizację nadrzędną? (Pyt. 3) | karta uprawnień wydawcy: suma pozycji, przy każdej źródło (jedno albo oba) |\n| Czy to karta osoby z obsługi z prawem na tym kempingu? (Pyt. 4) | identyfikator → osoba → ŁADOWANIE_OBSŁUGI (wprost albo przez ekipę) |\n| Czy kemping jest otwarty na karty sieci? (Pyt. 6) | istnienie UMOWA_AKCEPTACJI(Sieć → kemping) |\n| Czy wolno wymieniać karty z partnerem? (Pyt. 8) | WYMIANA_KART |\n| Karta sieci czy partnera, i tego, który ją przysyła? (Pyt. 9) | wydawca przy identyfikatorze + ZMIANA_KARTY |\n| Kto z obsługi zyska/straci prawo ładowania po przeniesieniu kempingu? | nikt: przeniesienie w regionach nie zmienia relacji |\n| Jak zorganizowana jest moja część sieci? (Pyt. 10) | częściowo: ODPOWIADA_ZA + WŁASNOŚĆ_KEMPINGU + PODLEGA; regiony i rynki niezmapowane |\n\n#### Implementation Notes\n- Partner pełniący rolę wydawcy i operatora miejsc to jedna Company z jednym PartyId i dwiema rolami. Ruch w obie strony to dwie asymetryczne relacje UMOWA_AKCEPTACJI. Gdy jednej brakuje, karta uprawnień to pokazuje.\n- Dziedziczenie umów: suma po ścieżce PODLEGA, bez zastępowania (odpowiedź użytkownika). Zmiana względem dzisiejszego kodu, w którym własna niepusta lista umów zasłania listy wyżej (GroupApiService.java:277, GroupServiceHelper.java:52). Skutek: wydawca dopisujący własny kemping nie traci kempingów organizacji nadrzędnej. Flaga „odziedziczona” przestaje być jedną wartością na wydawcę; staje się źródłem przy każdej pozycji.\n- Umowa wskazuje kempingi wprost. „Umowa na region” rozwija się przy zawieraniu na listę kempingów i dalej nie śledzi składu regionu (odpowiedź użytkownika).\n- Przypisanie obsługi może mieć osoba albo ekipa. Członkowie ekipy dostają uprawnienie przez CZŁONEK_EKIPY, a zmiana zestawu kempingów ekipy co miesiąc to zmiana jednego przypisania (odpowiedź użytkownika).\n- PODLEGA to realna relacja między firmami, z ważnością (potwierdzony wariant roboczy).\n- Zdarzenia: zawarcie i zakończenie relacji, zmiana posiadacza karty. Konsumenci (lokalne listy kart, wymiana z partnerami) reagują na nie zamiast na „przeniesienie grupy”.\n\nImplementacja referencyjna: .claude/skills/archetype-implementer/references/party-impl.md; moduł https://github.com/Archetypy-Oprogramowania/archetypes/tree/main/party\n\n#### Decyzje\n\n- Wydawca to strona (Company) z rolą, nie gałąź drzewa — (W) „Mają z siecią umowy akceptacji: ich karty działają na wskazanych kempingach sieci” (business-context.md §2 Wydawcy kart)\n- Partner = jedna strona w dwóch rolach (wydawca i operator miejsc) — (W) „Działa to też w drugą stronę: goście sieci ładują u partnera” (business-context.md §2)\n- Umowa akceptacji to relacja wydawca → kemping — (W) „umowa akceptacji | zgoda, że karty wydawcy działają na danych kempingach” (business-context.md §5)\n- Umowy własne i nadrzędne się sumują — (W) odpowiedź użytkownika na pytanie 1: „Zadar, Rovinj i Pula — umowy się sumują”\n- Umowa obejmuje kempingi wprost; przeniesienie w regionach nie zmienia, kto ładuje — (W) odpowiedź użytkownika na pytanie 2; cel B1 „bez zmiany tego, kto na nim ładuje”\n- Przypisanie obsługi ma osoba albo ekipa — (W) odpowiedź użytkownika na pytanie 3; „jednej karty, która działa tam, gdzie są w danym miesiącu przypisane” (business-context.md §2 Pracownicy)\n- PODLEGA to realna relacja między firmami — (W) odpowiedź użytkownika na pytanie 4 (zostaje wariant roboczy)\n- Karta należy do wydawcy; zmiany od innego wydawcy są odrzucane — (W) „Jeśli innego, zmiana jest odrzucona i karta zostaje u dotychczasowego wydawcy.” (problem.md, Pytanie 9)\n- Karta sieci nigdy nie przechodzi do partnera — (W) „Jeśli tak, partner nigdy jej nie przejmie” (problem.md, Pytanie 9)\n- Dozorca ładuje tylko na swoim kempingu, nie w całym regionie — (W) „tylko na jego kempingu, a nie u sąsiada z tego samego regionu” (business-context.md §2 Pracownicy)\n- Tryb dostępu kempingu niezależnego = istnienie umowy akceptacji z Siecią — (Z) wariant roboczy: tak; wejście: „Kim jest właściciel afiliowany i co zmienia tryb dostępu: (nieznane)” (business-context.md §2). Tryb nie zmienia, kto ładuje poza kartami sieci, więc wpływ jest ograniczony.\n- Wymiana kart z partnerem wynika z umów w obu kierunkach, wyjątki nadawane wprost — (Z) wariant roboczy; dziś decyduje filtr „najbliższy w górę drzewa wydawców” (problem.md, Pytanie 8)\n- Ważność uprawnienia po ścieżce PODLEGA = część wspólna ważności PODLEGA i umowy organizacji nadrzędnej — (Z) wariant roboczy, wynika z reguły „uprawnienie trwa tyle, ile relacja”\n\n#### Założenia\n\n- PartyId = losowy UUID; nazwy grup („AFFILIATE …”, „NETWORK CARD”) przestają być identyfikatorem.\n- Gość z kartą wydawcy nie jest stroną w sieci; sieć zna tylko identyfikator karty i jej wydawcę.\n- Karty to osobna jednostka spójności kluczowana PartyId posiadacza.\n- Zawężenie prawa obsługi do części kempingu (słupki 3–7) jest atrybutem przypisania; słupki zostają poza Party.\n- Zakończenie własności kempingu nie unieważnia kart już przejętych.\n- Właściciel afiliowany może być osobą albo firmą.\n- ODPOWIADA_ZA (zakres operatora konsoli) tylko jako źródło „w moim zakresie”, bez modelu uprawnień konsoli.\n- Tryb dostępu i wymiana z partnerem: warianty robocze jak w DECYZJACH (Z).\n\n#### Identyfikatory i rzuty\n\n- kemping, na którym stoi słupek (PartyId kempingu przy słupku) — „czy wydawca tej karty ma z siecią umowę obejmującą kemping, na którym stoi słupek?” (problem.md, Pytanie 1)\n- UID karty z PartyId wydawcy — „czy to nie karta sieci i czy należy do tego partnera” (problem.md, Pytanie 9)\n- rynek (kraj) kempingu, potrzebny do puli kart powitalnych — „czy to karta powitalna z puli kraju tego kempingu” (problem.md, Pytanie 5)\n- partner wymiany (kod partnera w plikach) — „Pliki kart i rekordów idą w obie strony” (business-context.md §4 pkt 9)\n\n### Co i jak\n\n| CO | JAK STARE | JAK W ARCHETYPIE |\n|---|---|---|\n| Gość przykłada kartę do gniazda na słupku: czy wydawca jego karty ma z siecią umowę obejmującą kemping, na którym stoi słupek? Jeśli nie, prąd nie zostaje włączony. (Q1, ValidationService.isCardAcceptedAt) | `ValidationService.java:381`: przelotka do `groupService.isCardAcceptedAt(pedestal.getId(), card)`. Karta bez gościa → false; dalej `extractAllAcceptingSiteGroupIds(guest.group)` (najbliższa w linii rodziców niepusta lista umów, wyższe zasłonięte, całe poddrzewa) i `pedestalDao.isInGroupList`. Zwraca `boolean`: słupek stoi w grupie objętej umową wydawcy. | Pytamy, czy wydawca karty albo któraś organizacja nad nim ma ważną umowę z tym konkretnym kempingiem. Wystarczy jedna z nich; miejsce kempingu w regionach nie gra roli. \u003cdetails>\u003csummary>szczegóły\u003c/summary>Identyfikator KARTA_RFID → wydawca (PartyId); słupek → PartyId kempingu (rzut). Uprawnienie KARTY_DZIAŁAJĄ_TU = suma UMOWA_AKCEPTACJI wydawcy i umów organizacji po ścieżce PODLEGA. Ważność z relacji. Odpowiedź: tak/nie plus źródło (która umowa). Inaczej niż dziś: własna umowa wydawcy nie zasłania umów nadrzędnych. Pozostałe warunki prądu (ważność karty, gniazdo) zostają w procesie.\u003c/details> |\n| Gość przykłada kartę do gniazda na słupku; odpowiedź pośrednia: na których kempingach działają karty wydawcy. (Q1, GroupServiceHelper.extractAllAcceptingGroupIds) | `GroupServiceHelper.java:52`: `getAcceptanceAgreements` (najbliższa w linii rodziców niepusta lista umów danego typu, wyższe zastępowane), dla każdej umowy `collectSubtreeIds`, lista bez powtórzeń; brak umów → pusta. Zwraca `List\u003cLong>`: kempingi i regiony z całym poddrzewem. | Karta uprawnień wydawcy: kempingi z jego własnych umów plus kempingi z umów organizacji nad nim. Przy każdym kempingu widać źródło i ważność. Nic nie rozwija się po poddrzewach regionów. \u003cdetails>\u003csummary>szczegóły\u003c/summary>Przejście po UMOWA_AKCEPTACJI wydawcy ∪ UMOWA_AKCEPTACJI każdej organizacji w górę po PODLEGA; pozycja = (kemping, źródła, ważność). Umowa „na region” została rozwinięta przy zawarciu na kempingi wprost. Odpowiada też na Pytanie 3 (ekran umów): zamiast jednej flagi `inherited` źródło przy każdej pozycji.\u003c/details> |\n| Słupek dostaje listę kart, które ma wpuszczać sam, bez pytania sieci: karty których wydawców przyjmuje kemping tego słupka? (Q2, LocalCardListService.buildLocalCardList) | `LocalCardListService.java:138`: gdy `lla.isIncludeCards()`, `groupService.findIssuerGroupIdsAcceptedAt(pedestal.getGroup())` (rekurencyjny SQL: dla każdego wydawcy najbliższy właściciel listy umów; umowa obejmuje grupę słupka albo przodka) → `findValidCardsForLocalCardList`. Zwraca `List\u003cLong>`: wydawcy, których umowa (własna lub przejęta) obejmuje kemping słupka. | Te same umowy czytane od strony kempingu: wydawcy, którzy mają z nim ważną umowę, plus wszyscy wydawcy zależni od tych, którzy ją mają. Pojemność i kolejność listy to już nie sprawa Party. \u003cdetails>\u003csummary>szczegóły\u003c/summary>Odwrotne przejście UMOWA_AKCEPTACJI (to = kemping) → strony umów → PODLEGA w dół (suma, bez zasłaniania). Wynik: zbiór PartyId wydawców. Zawarcie albo zakończenie relacji emituje zdarzenie, na które reaguje odświeżenie list. Przeniesienie kempingu w regionach żadnego zdarzenia nie wywołuje.\u003c/details> |\n| Słupek dostaje listę kart, które ma wpuszczać sam: które karty personelu (kempingu i organizacji nad nim) mają na niej być? (Q4, LocalCardListService.buildLocalCardList) | `LocalCardListService.java:138`: gdy `lla.isIncludeHouseCards()`, `houseCardService.getHouseCardsForPedestal(kod)` = aktywne karty grupy słupka i wszystkich przodków (`fetchParentLineIds`); karty personelu pierwsze, nadmiar ucinany. Zwraca `List\u003cHouseCard>`: aktywne karty personelu kempingu słupka i organizacji nad nim. | Na listę trafiają karty osób z ważnym przypisaniem do tego kempingu: przypisanych osobiście albo należących do przypisanej ekipy, z ewentualnym zawężeniem do części kempingu. Karta działa, bo jej posiadacz jest przypisany, a nie dlatego, że wisi w regionie nad kempingiem. \u003cdetails>\u003csummary>szczegóły\u003c/summary>PRZYPISANIE_OBSŁUGI (to = kemping, ważne dziś) → posiadacze: Person wprost albo EKIPA → CZŁONEK_EKIPY → Person; dalej ich identyfikatory KARTA_RFID. Uprawnienie ŁADOWANIE_OBSŁUGI z zakresem miejsca (słupki 3–7). Dozorca przypisany do swojego kempingu nie trafia na listę sąsiada z regionu.\u003c/details> |\n| Słupek dostaje od nowa całą listę kart przyjmowanych bez pytania centrali: jakie karty mają na niej być i które wypadają, gdy brakuje miejsca? (Q12, LocalCardListService.buildLocalCardList) | `LocalCardListService.java:138`: najbliższy atrybut LocalList nad grupą słupka decyduje, czy lista jest i co zawiera. Budowa: karty domowe + ważne karty akceptowanych wydawców; ponad pojemność karty gości wypadają, karty domowe są sortowane i ucinane. Zwraca `LocalCardList`: karty obsługi, potem karty gości. | Archetyp na to nie odpowiada: czy słupek trzyma listę, ile mieści i co wypada pierwsze, to reguły sprzętu i dystrybucji. Party daje tylko dwa wejścia: wydawców przyjmowanych na kempingu i karty osób przypisanych. \u003cdetails>\u003csummary>szczegóły\u003c/summary>Z Party: odwrotne UMOWA_AKCEPTACJI z PODLEGA (wydawcy) i PRZYPISANIE_OBSŁUGI (karty obsługi). Atrybut listy, pojemność i kolejność → POJĘCIA NIEZMAPOWANE (lokalna lista kart).\u003c/details> |\n| Przy wymianie z partnerami sieć wysyła każdemu partnerowi zmiany na liście swoich kart: czy kartę tego gościa wolno przekazać właśnie temu partnerowi? (Q15, IssuerExchangeService.exportCards) | `IssuerExchangeService.java:198`: karty sieci do eksportu (`findCardsForPartnerExport`). Dla każdego partnera i karty `whitelistFilterService.isSynchronizableForExport(grupa gościa karty, partner)`: najbliższy filtr eksportowy w linii rodziców celujący w partnera; brak = tak. Karta pominięta tylko dla tego partnera; „wyeksportowana”, gdy wszyscy dostali listę. Odpowiedź `boolean`: kartę wolno wysłać. | Kartę wysyłamy partnerowi, bo sieć ma umowę, że jej karty działają na kempingach tego partnera. Wyjątek to jawne nadanie z powodem, a nie filtr na gałęzi drzewa. Gdy umowy w tę stronę brak, karta uprawnień to pokazuje. \u003cdetails>\u003csummary>szczegóły\u003c/summary>WYMIANA_KART (eksport) wyprowadzone z UMOWA_AKCEPTACJI(Sieć jako WYDAWCA_KART → kempingi partnera w roli MIEJSCE_ŁADOWANIA); ważność z relacji. Wyjątek dla grupy kart to nadanie albo odebranie wprost, z własną ważnością; sygnalizuje brakującą relację. Partner ma dwie role (wydawca i operator miejsc) i jeden PartyId.\u003c/details> |\n| Partner przysyła kartę, którą już znamy: czy to karta sieci? Jeśli tak, nigdy nie przechodzi do wydawcy — zmiana jest odrzucona. (Q16, IssuerCardImportService.isNetworkCard) | `IssuerCardImportService.java:187`: bez grupy gościa → false; inaczej `findNetworkCardGroupIds()` (poddrzewo grupy o nazwie 'NETWORK CARD') zawiera grupę gościa karty. Zwraca `boolean`: posiadacz leży w części sieci kart sieciowych. | Każda karta ma zapisanego wydawcę; karta sieci to po prostu karta, której wydawcą jest Sieć. Reguła przypisania identyfikatora nie pozwala innemu wydawcy jej zmienić. \u003cdetails>\u003csummary>szczegóły\u003c/summary>KARTA_RFID z polem wydawca = PartyId Sieci. Polityka przypisania (b): partner nie przejmuje karty Sieci; (a): zmiany tylko od wydawcy karty, jego jednostek i podmiotów zależnych. Przeniesienie posiadacza w drzewie nie zmienia odpowiedzi.\u003c/details> |\n\nUwaga: `LocalCardListService.buildLocalCardList` występuje w bolączkach pod trzema pytaniami (Q2, Q4, Q12), więc 5 wskazanych miejsc dało 7 wierszy.\n\n### Trzy ficzery z archetypu\n\n1. Umowy akceptacji z datą obowiązywania. Wydawca i sieć zawierają umowę od wskazanego dnia albo na sezon, a karty same zaczynają i przestają działać, bez ręcznego zdejmowania umowy przez operatora.\n   skąd: „Mają z siecią umowy akceptacji: ich karty działają na wskazanych kempingach sieci” (business-context.md §2, Wydawcy kart)\n   w archetypie: ważność (od–do) relacji UMOWA_AKCEPTACJI; uprawnienie KARTY_DZIAŁAJĄ_TU dziedziczy ją wprost, także po ścieżce PODLEGA.\n2. „Kto mógł ładować tu w tamtym dniu”. Przy reklamacji z poprzedniego sezonu wsparcie widzi, czy karta gościa miała wtedy prawo ładować na tym kempingu i na podstawie której umowy albo którego przypisania.\n   skąd: „Gość z reklamacją z poprzedniego sezonu: do sporu trzeba otworzyć dawne rekordy zużycia” (business-context.md §2, Gość kempingu)\n   w archetypie: historia relacji z ważnością; kartę uprawnień liczy się na wskazaną datę zamiast na dziś.\n3. Odejście pracownika zamyka wszystkie jego prawa ładowania. Koniec przypisania albo członkostwa w ekipie od razu wyłącza kartę na wszystkich kempingach. Nie trzeba szukać jego kart po kempingach i regionach.\n   skąd: „Dozorca mieszka na kempingu. Jego karta ma działać zawsze, przy każdym słupku, ponad budżet mocy, ale tylko na jego kempingu” (business-context.md §2, Pracownicy)\n   w archetypie: ŁADOWANIE_OBSŁUGI wynika z PRZYPISANIE_OBSŁUGI / CZŁONEK_EKIPY, więc koniec relacji jest końcem uprawnienia; zdarzenie zakończenia odświeża listy kart na słupkach.\n\n### Pojęcia niezmapowane\n\n| pojęcie | które wystąpienie je odrzuciło |\n|---|---|\n| region i rynek (grupowanie do raportów i rozliczeń) | Party |\n| drzewo grup i reguła „najbliższe ustawienie wyżej” | Party |\n| słupek, gniazdo, stanowisko, sekcja, budżet mocy | Party |\n| lokalna lista kart, jej pojemność i kolejność | Party |\n| pula kart powitalnych kraju | Party |\n| ważność i blokada karty, płatność QR | Party |\n| rozliczenia i raport rozliczeniowy wydawcy | Party |\n| treść i warunki umowy akceptacji poza tym, gdzie działają karty | Party |\n\n### Sprzeciwy wobec werdyktu\n\nBrak.\n\n### Otwarte\n\nPytania mappera (FAZA 5b) i odpowiedzi uczestnika (uczestnik nieobecny; odpowiedzi udzielone za niego na podstawie `analiza/business-context.md`):\n\n1. Adria Cards ma własną umowę na Zadar, organizacja nadrzędna Adria Group — na Rovinj i Pulę. Gdzie działają karty Adria Cards? → **Zadar, Rovinj i Pula — umowy się sumują** (wariant roboczy był: tylko Zadar, jak dziś). Podstawa: wydawca dopisujący kemping chce, żeby goście od razu tam ładowali [ISS-203], a nie tracili innych kempingów. **Zmienia zachowanie względem legacy.**\n2. Umowa „na Dalmację” (Zadar, Split), Zadar przeniesiony do Istrii — czy karty dalej działają w Zadarze? → **tak, umowa wymienia kempingi wprost** (= wariant roboczy). Podstawa: cel B1 „bez zmiany tego, kto na nim ładuje”. **Zmienia zachowanie względem legacy.**\n3. Ekipa remontowa w różnych miesiącach na różnych kempingach — komu prawo ładowania? → **obie formy: osoba albo ekipa** (= wariant roboczy). Podstawa: CRD-201, dozorca CAMP-211.\n4. „ADAC Süd” pod „ADAC” — realna relacja czy porządek w konsoli? → **Zostaw wariant roboczy** (realna relacja PODLEGA); business-context nie rozstrzyga.\n\nZałożenia (Z) zmieniające zachowanie, bez potwierdzenia: tryb dostępu kempingu niezależnego = istnienie umowy akceptacji z Siecią (business-context: „Kim jest właściciel afiliowany i co zmienia tryb dostępu: (nieznane)”); wymiana kart z partnerem wynika z umów w obu kierunkach, wyjątki nadawane wprost (dziś: filtr najbliższy w górę drzewa wydawców); ważność uprawnienia po ścieżce PODLEGA = część wspólna ważności relacji i umowy.\n\n### Bolączki z adresami w kodzie (wejście pogłębienia)\n\n### BOLĄCZKI Z ADRESAMI W KODZIE\n\n#### B1. Przeniesienie kempingu w drzewie\n- co boli: Przeniesienie, scalenie albo zamknięcie kempingu czy regionu w konsoli (technicznie jedno pole rodzica) po cichu zmienia, czyje karty dostają prąd i kto widzi rekordy: gość dostaje odmowę bez powodu, przygarnięta karta przestaje działać, admin rynku traci połowę kempingów i stoi fakturowanie; poprawki są ręczne, bez wyjaśnienia przyczyny.\n- kiedy: przeniesienie kempingu do innego regionu (przeciągnięcie w konsoli), także scalenie dwóch kempingów albo dezaktywacja starego regionu\n- cel obserwowalny: kemping raportowany w regionie, w którym biznes chce go widzieć, bez zmiany tego, kto na nim ładuje i kto widzi jego rekordy\n- zgłoszenia: OPS-202 (#347): po jesiennej reorganizacji admin.it nie widzi przeniesionych kempingów, fakturowanie stoi (otwarte, pilne); CAMP-203 (#3): po przeniesieniu Zadaru pod Dalmację back office nie widzi jego rekordów; „będziemy dalej reorganizować”; CAMP-207 (#76): dezaktywacja starego regionu ukryła rekordy potrzebne do otwartej reklamacji; RPT-212 (#318): dwie osoby z tą samą rolą rynku widzą inne sumy, zależnie od miejsca w drzewie (otwarte); CAMP-212 (#334): karta gościa odrzucana bez powodu kilka razy w tygodniu po przesunięciach; wsparcie nie umie wyjaśnić (otwarte); CAMP-233 (#193): przygarnięta karta powitalna przestaje działać po przeniesieniu kempingu; pomaga ponowne przygarnięcie; OPS-205 (#336): po przeniesieniu raz tak, raz nie wiadomo, kto z obsługi może ładować; operacje chcą reguły albo ostrzeżenia; CAMP-211 (#337): dozorca z uprawnieniem na regionie ładuje też u sąsiada z tego samego regionu; CAMP-219 (#206): po scaleniu dwóch kempingów goście starego B dalej mają odmowę na słupkach A (otwarte); CRD-202 (#198): filtr kart znika po zapisie grupy, częściej na niedawno przeniesionych (wontfix); CAMP-232 (#231): domyślna taryfa regionu raz trafia do nowego kempingu, raz nie, zależnie od głębokości; wiki Konsultacje-2026-03-10 ¶3–4: Zadar: „technicznie to jest jedno pole w bazie […] a potem dzwonią”; widok przywrócony ręcznie; wiki Konsultacje-2026-03-10 ¶13, ¶14, ¶18, ¶22–24: dozorca u sąsiada, przygarnięta karta, scalenie, odmowy „częściej w tygodniach, jak biznes dużo przesuwa”, admin.it; wiki Konsultacje-2026-03-10 ¶26: PO: „żebyśmy mogli poprzesuwać kempingi […] i żeby nic się przy tym nie sypało”\n\n#### B3. Zasięg kart w kilku miejscach\n- co boli: Ustalenie, gdzie działa karta, wymaga dotknięcia kilku miejsc: umowa z wydawcą to listy węzłów po obu stronach i filtry na kilku poziomach, karta obsługi działa na całe poddrzewo. Przy nowym kempingu wydawcy zawsze któryś krok się gubi i karty działają w jedną stronę; nie da się dać karty na pięć słupków ani na zmieniający się co miesiąc zestaw kempingów; odmowa nie mówi, który filtr zadziałał.\n- kiedy: wydawca podpisuje nowy kemping, dwa kempingi chcą wspólnie ładować, obsłudze trzeba dać kartę na część kempingu albo na kilka kempingów\n- zgłoszenia: ISS-205 (#367): dodanie kempingu wydawcy to kilka ręcznych kroków, jeden się gubi i karty działają w jedną stronę (w toku); ISS-203 (#79): karty partnera mają działać od razu na kempingach z umową (wontfix); CAMP-215 (#399): Zadar i sąsiad: goście mają ładować u siebie nawzajem; nikt nie wie, jak to połączyć; CAMP-218 (#72): trzy kempingi Garda: ładowanie wspólne, rozliczenia i raporty osobno; CAMP-210 (#110): pracownik sezonowy tylko na słupkach 3–7, a da się tylko cały kemping; CRD-201 (#345): karta dla ekipy na zestaw kempingów zmieniany co miesiąc (otwarte); ISS-207 (#364): odmowa przez filtr nie mówi, którego poziomu to filtr (otwarte); wiki Konsultacje-2026-03-10 ¶13, ¶15, ¶17–19: sezonowi, ekipy remontowe, filtry, sąsiad na festiwal, Garda, „rytuał na pięć kroków i zawsze któryś się zgubi”; Glossary (acceptance agreement): umowa: karty wydawcy działają na danych kempingach\n\nBolączki B1 i B3 dotykają tej samej paczki pytań. Pod nimi pytania, dla których zrobiliśmy skrzyżowanie; przy każdym wołającym: miejsce w kodzie (`plik:linia`), CO (co jest robione, w języku problemu), JAK (jak kod robi to dziś) i odpowiedź jednym zdaniem (typ i co znaczy).\n\n##### Paczka pytań: Czy ta karta dostanie prąd na tym kempingu\n\n- zgłoszeń: 6 · dlaczego boli: gość i obsługa dostają odmowę (albo prąd u sąsiada) po zmianie, która miała dotyczyć tylko raportowania; wsparcie nie umie powiedzieć czemu\n- co się zmienia: w gnieździe płynie prąd albo nie · kto zauważa: gość przy słupku, personel po odmowie\n\n###### Q1: Czy wydawca karty gościa ma z siecią umowę, że jego karty działają na kempingu, na którym stoi ten słupek?\n\n- **GroupApiService.toAgreementDTO** (`campsite-core/src/main/java/io/pillopl/group/GroupApiService.java:277`) · top-in-island · ścieżka: GroupApiService.toAgreementDTO → GroupServiceHelper.getAcceptanceAgreements · pyta: partly\n  - CO: Operator sieci w konsoli ogląda albo zmienia umowy wydawcy kart: na których kempin indNearest · pyta: yes\n  - CO: Czy w tej części sieci (kemping, region, rynek) słupki mają pamiętać listę kart przyjmowanych bez pytania centrali i czy trzymać na niej karty obsługi, karty gości, czy oba rodzaje? Rozstrzyga najbliższe ustawienie nad kempingiem; bez niego słupki listy nie trzymają.\n  - JAK: Prywatny `findNearest(groupId)`: `groupService.fetchParentLineIds(groupId, true)` (grupa i jej przodkowie), `localListAttributeDao.findByGroupIds(linia)`, `GroupAttributeHelper.findNearest` – pierwszy atrybut idąc od grupy w górę. Woła go `isLocalListGroup(Long)` (`nearest != null && localListAllowed`) oraz `getLocalListAttribute(Group)` (zwraca atrybut tylko gdy `localListAllowed`, inaczej null). Dalej: `GroupApiService.getGroupAttributes` (pole `localList` na ekranie), `isLocalListPedestal` (wybór słupków dla zmiany karty obsługi), `LocalCardListService.sendFull` / `buildLocalCardList` i `HouseCardService.findPedestalsForHouseCard` (flagi `includeCards`, `includeHouseCards`).\n  - odpowiedź: `LocalListAttribute | null` — najbliższe ustawienie listy kart nad kempingiem słupka\n\n###### Q15: Czy karty tego wydawcy wolno wymieniać z tym partnerem — wysyłać mu je i przyjmować od niego?\n\n- **IssuerExchangeService.exportCards** (`campsite-core/src/main/java/io/pillopl/issuer/IssuerExchangeService.java:198`) · cited · ścieżka: IssuerExchangeService.exportCards · pyta: yes\n  - CO: Przy wymianie z partnerami sieć wysyła każdemu partnerowi zmiany na liście swoich kart: czy kartę tego gościa (z tej części sieci) wolno przekazać właśnie temu partnerowi? Jeśli nie, partner jej nie dostaje i gość nie naładuje na kempingach partnera.\n  - JAK: `IssuerExchangeService.exportCards` bierze karty sieci czekające na eksport (`campingCardDao.findCardsForPartnerExport(networkCardGroup)`), dla każdego partnera z eksportem i każdej karty woła `WhitelistFilterService.isSynchronizableForExport(grupa gościa karty, partner)`: najbliższy na linii rodziców filtr eksportowy, który celuje w tego partnera albo we wszystkich (`isTargeting`), decyduje; brak filtra = tak. true → `toCardLine` na liście partnera, false → karta pominięta tylko dla tego partnera. Lista (niepusta) idzie przez `sendCards`; status kierunku CARD_EXPORT zapisany. Karty oznaczane jako wyeksportowane tylko, gdy wszyscy partnerzy dostali listę (także te pominięte przez filtr).\n  - odpowiedź: `boolean` — tak: kartę wolno wysłać temu partnerowi — nie ma ustalenia, które tego zabrania (albo najbliższe pozwala)\n\n- **IssuerCardImportService.checkWhitelistSynchronizable** (`campsite-core/src/main/java/io/pillopl/issuer/IssuerCardImportService.java:149`) · top-in-island · ścieżka: IssuerCardImportService.checkWhitelistSynchronizable · pyta: yes\n  - CO: Partner przysyła zmiany na liście swoich kart: czy od tego partnera-wydawcy w ogóle wolno przyjmować karty? Jeśli nie, żadna jego karta nie zostaje przyjęta i jego goście nie naładują na kempingach sieci.\n  - JAK: `IssuerCardImportService.importCard` jako pierwszy krok woła prywatne `checkWhitelistSynchronizable(partner)`: dla grupy wydawcy partnera (`partner.getIssuerGroup()`) pyta `WhitelistFilterService.isSynchronizableForImport(groupId, partner)` (najbliższy filtr importowy na linii rodziców celujący w partnera albo we wszystkich; brak = tak). false → `IssuerExchangeException(\"Issuer '…' is marked as not synchronizable\")`. Sprawdzenie idzie dla każdej linii osobno, więc odrzucona jest każda linia z tym samym komunikatem; `importCards` liczy je jako odrzucenia. Partner bez grupy wydawcy — sprawdzenia nie ma.\n  - odpowiedź: `void, throws IssuerExchangeException` — nic nie zwraca\n\n- **WhitelistFilterService.findNearest** (`campsite-core/src/main/java/io/pillopl/group/attribute/WhitelistFilterService.java:110`) · top-in-island · ścieżka: WhitelistFilterService.findNearest · pyta: partly\n  - CO: Dla danej części sieci (wydawcy): które ustalenie o wymianie kart z partnerami obowiązuje — najbliższe, idąc w górę od tej części, dla dan ` łapie każdy `RuntimeException`, liczy `accepted`/`rejections`, zwrot `importCard` ignoruje.\n  - odpowiedź: `CampingCard` — nic nie zwraca\n\n- **IssuerCardImportService.checkIssuer** (`campsite-core/src/main/java/io/pillopl/issuer/IssuerCardImportService.java:160`) · top-in-island · ścieżka: IssuerCardImportService.checkIssuer · pyta: yes\n  - CO: Partner przysyła dodanie, zmianę albo usunięcie karty, którą znamy jako kartę wydawcy: czy wydał ją właśnie ten partner? Jeśli nie, zmiana jest odrzucona — karta zostaje przy wydawcy, od którego przyszła wcześniej.\n  - JAK: `importCard` woła `checkIssuer(partner, card, uid)` w gałęziach ADD/MODIFY/DELETE, gdy `isIssuerCard(card)`. `checkIssuer`: `groupService.findManageable(partner.getIssuerGroup())` (poddrzewo grupy wydawcy partnera) i `contains(card.getGuest().getGroup().getId())`; brak → `IssuerExchangeException(\"CARD_UID='…' was imported from another issuer already\")`. Uwaga: przesunięcie grupy gościa w drzewie zmienia odpowiedź.\n  - odpowiedź: `void, throws IssuerExchangeException` — nic nie zwraca\n\n- **IssuerCardImportService.isNetworkCard** (`campsite-core/src/main/java/io/pillopl/issuer/IssuerCardImportService.java:187`) · top-in-island · ścieżka: IssuerCardImportService.isNetworkCard · pyta: yes\n  - CO: Partner przysyła kartę, którą już znamy: czy to karta sieci? Jeśli tak, nigdy nie przechodzi do wydawcy — zmiana jest odrzucona.\n  - JAK: Jedyny wołający: `importCard:81` — `card != null && isNetworkCard(card)` → `IssuerExchangeException(\"CARD_UID='…' exists as a network card already\")`. `isNetworkCard`: bez grupy gościa → false; inaczej `findNetworkCardGroupIds()` (poddrzewo grupy 'NETWORK CARD') zawiera grupę gościa karty.\n  - odpowiedź: `boolean` — tak: posiadacz karty leży w części sieci kart sieciowych — to karta sieci\n\n- **IssuerCardImportService.isIssuerCard** (`campsite-core/src/main/java/io/pillopl/issuer/IssuerCardImportService.java:198`) · top-in-island · ścieżka: IssuerCardImportService.isIssuerCard · pyta: yes\n  - CO: Partner przysyła zmianę karty, którą już znamy: czy to karta jakiegoś wydawcy (a nie sieci)? Jeśli tak, wolno ją aktualizować po sprawdzeniu, że to karta tego partnera; jeśli nie, dodanie zakłada nową kartę u partnera, a zmiana lub usunięcie jest odrzucone.\n  - JAK: Wołane w `importCard` w trzech gałęziach (95, 110, 125) jako `card != null && isIssuerCard(card)`. `isIssuerCard`: bez grupy gościa → false; `findNetworkCardGroupIds()` null (brak 'NETWORK CARD') → true; inaczej grupa gościa poza poddrzewem kart sieci. ADD + true → `checkIssuer` i aktualizacja; ADD + false → `campingCardService.importCard` na gościu partnera; MODIFY/DELETE + false → 'card not found'.\n  - odpowiedź: `boolean` — tak: karta jest kartą któregoś wydawcy\n\n- **IssuerCardImportService.hasGuestGroup** (`campsite-core/src/main/java/io/pillopl/issuer/IssuerCardImportService.java:206`) · top-in-island · ścieżka: IssuerCardImportService.hasGuestGroup · pyta: partly\n  - CO: Czy znana karta ma posiadacza przypisanego do jakiejś części sieci albo wydawcy? Bez tego nie da się powiedzieć, czy to karta sieci, czy wydawcy — karta nie jest traktowana ani jako jedna, ani jako druga.\n  - JAK: Prywatne statyczne `hasGuestGroup(card)`: `card != null && card.getGuest() != null && card.getGuest().getGroup() != null`. Wołane tylko z `isNetworkCard` i `isIssuerCard` jako strażnik; false → obie zwracają false.\n  - odpowiedź: `boolean` — tak: karta ma posiadacza w strukturze sieci\n\n- **IssuerCardImportService.findNetworkCardGroupIds** (`campsite-core/src/main/java/io/pillopl/issuer/IssuerCardImportService.java:213`) · top-in-island · ścieżka: IssuerCardImportService.findNetworkCardGroupIds · pyta: partly\n  - CO: Które części sieci należą do kart sieci (wydanych przez samą sieć)? Od tego zależy, czy przysłaną kartę uznać za kartę sieci, czy wydawcy.\n  - JAK: Prywatne `findNetworkCardGroupIds()`: `groupService.fetchNetworkCardIssuerGroup()` (grupa ISSUER o nazwie 'NETWORK CARD'), jeśli jest → `groupService.findManageable(grupa)` (całe poddrzewo), inaczej null. Wołane przy każdym `isNetworkCard`/`isIssuerCard` — czyli kilka razy na linię.\n  - odpowiedź: `List\u003cLong> | null` — lista: części sieci (grupy wydawcy) należące do kart sieci — sama grupa kart sieci i wszystko pod nią\n\n###### Q20: Jak jest zorganizowana sieć, za którą odpowiadam: które kempingi należą do których regionów i rynków (a wydawcy i zespoły — do kogo)?\n\n- **GroupTreeFactory.createTree** (`campsite-core/src/main/java/io/pillopl/group/GroupTreeFactory.java:25`) · cited · ścieżka: GroupTreeFactory.createTree · pyta: yes\n  - CO: Osoba z obsługi otwiera w konsoli drzewo swojej części sieci (kempingi, regiony i rynki albo wydawcy i zespoły): jak ta część jest zorganizowana, co pod czym leży?\n  - JAK: Jedyny wołający: `GroupApiService.getGroupTree` (l.129) z grupą zakresu użytkownika dla danego typu. `createTree(root)`: null → null; inaczej `createNode(root, root.getType(), visited, 0)` — drzewo tylko z grup tego samego typu co korzeń, do 20 poziomów.\n  - odpowiedź: `GroupTreeNodeDTO | null` — korzeń: część sieci, za którą odpowiada osoba, z całą strukturą pod nią\n\n- **GroupTreeFactory.createNode** (`campsite-core/src/main/java/io/pillopl/group/GroupTreeFactory.java:32`) · cited · ścieżka: GroupTreeFactory.createNode · pyta: yes\n  - CO: Osoba z obsługi otwiera w konsoli drzewo swojej części sieci (kempingi, regiony i rynki albo wydawcy i zespoły): jak ta część jest zorganizowana, co pod czym leży?\n  - JAK: Rekurencyjne `createNode(group, type, visited, depth)`: dodaje id do `visited`; jeśli `depth \u003c MAX_DEPTH (20)`, dla każdego dziecka tego samego typu i nieodwiedzonego woła się rekurencyjnie; zwraca `GroupTreeNodeDTO(id, name, displayName, type, children)`. Wołane z `createTree` i z siebie.\n  - odpowiedź: `GroupTreeNodeDTO` — jedna część sieci (kemping, region, rynek albo wydawca, zespół) z tym, co pod nią\n\n- **GroupWebService.getGroupTree** (`campsite-endpoints/src/main/java/io/pillopl/webservice/console/group/GroupWebService.java:32`) · cited · wejście HTTP · ścieżka: GroupWebService.getGroupTree · pyta: yes\n  - CO: Osoba z obsługi otwiera w konsoli drzewo swojej części sieci (kempingi, regiony i rynki albo wydawcy i zespoły): jak ta część jest zorganizowana, co pod czym leży?\n  - JAK: HTTP POST `/getGroupTree` → `getBean().getGroupTree(caller(), request.groupType())` = `GroupApiService.getGroupTree`: `parseEnum(GroupType)` (puste → InvalidInputException), `principal.getGroup(type)` — brak zakresu → `ObjectNotFoundException(\"User … has no … scope\")`; inaczej `GroupTreeFactory.createTree(scope)`. Wynik owinięty w `GetGroupTreeResponse`.\n  - odpowiedź: `GetGroupTreeResponse` — część sieci, za którą odpowiada osoba, ze strukturą pod nią\n\n### Implementacja referencyjna\n\n.claude/skills/archetype-implementer/references/party-impl.md; moduł repozytorium referencyjnego: https://github.com/Archetypy-Oprogramowania/archetypes/tree/main/party\n"}],"raw":"# Specyfikacja: akceptacja-kart — party obok starego modelu\n\nŹródło prawdy dla workflow `parallel-models`. Każdy krok dopisuje swoją sekcję; commit kroku zawiera zmianę kodu\ni tej specyfikacji razem. Źródło leży bez zmian w `zrodlo.md`, wybrane miejsca w `miejsca.md`, stan przebiegu w `stan.json`,\nwyniki bramek w `bramki.jsonl`. Widok: `specyfikacja.html`.\nKrok 1 zakłada plik z całego szablonu: wypełnia swoje sekcje, placeholderów innych kroków nie usuwa.\n\n\u003c!-- krok: swappable-dsl.1 -->\n## Stary model\n**Typowane drzewa grup** (`Group` z typem SITE / ISSUER / STAFF i polem rodzica; ustawienia jako atrybuty grup,\nobowiązuje najbliższe nad węzłem). Wydawca kart to grupa ISSUER; jego umowy akceptacji to lista grup SITE\nprzypięta do grupy wydawcy (`GROUP_ASSOCIATEDGROUP`); obowiązuje najbliższa w linii rodziców **niepusta** lista\n(listy wyżej są zastępowane, nie łączone), a każda pozycja rozwija się na całe poddrzewo kempingów i regionów.\nKarta gościa wskazuje wydawcę przez grupę swojego gościa; karta sieci to gość w poddrzewie grupy o nazwie\n„NETWORK CARD”; karty personelu wiszą na grupie SITE i działają na niej i wszystkich niżej; wymianę kart z partnerem\nrozstrzyga najbliższy filtr (whitelist) w linii rodziców wydawcy. Zmiana miejsca węzła w drzewie (przeniesienie\nkempingu) zmienia wszystkie te odpowiedzi.\nPakiety: `io.pillopl.group` (`Group`, `GroupService`, `GroupServiceHelper`, `GroupApiService`, `AffiliateGroupService`),\n`io.pillopl.group.attribute` (`LocalListAttributeService`, `WhitelistFilterService`, `WelcomeCardAdoptionService`),\n`io.pillopl.card` (`ValidationService`, `LocalCardListService`, `HouseCardService`), `io.pillopl.issuer`\n(`IssuerExchangeService`, `IssuerCardImportService`) — moduł `campsite-core`.\n\n\u003c!-- krok: swappable-dsl.1 -->\n## Nowe rozwiązanie\n**Archetyp Party** (poziom złożoności 3). Elementy: strony (Company — sieć, wydawcy/partnerzy, organizacje\nnadrzędne; OrganizationUnit — kemping, podgrupa wydawcy, ekipa; Person — obsługa) z `PartyId`; identyfikator\n`KARTA_RFID` (UID karty, z wydawcą jako `PartyId`), karta nie jest stroną; role (WYDAWCA_KART, MIEJSCE_ŁADOWANIA,\nOBSŁUGA, …); relacje z ważnością: UMOWA_AKCEPTACJI (wydawca → kemping wprost), PODLEGA (wydawca → organizacja\nnadrzędna), JEDNOSTKA_WYDAWCY, PRZYPISANIE_OBSŁUGI (osoba albo ekipa → kemping), CZŁONEK_EKIPY; uprawnienia\nwyprowadzane z relacji: KARTY_DZIAŁAJĄ_TU, ŁADOWANIE_OBSŁUGI, WYMIANA_KART, ZMIANA_KARTY; polityka przypisania\nidentyfikatora (zmienia tylko wydawca karty; partner nie przejmuje karty sieci).\nPytania, na które odpowiada (z `zrodlo.md`, „Questions the Model Answers”): czy karty wydawcy działają na kempingu\nsłupka (Pyt. 1); karty których wydawców przyjmuje kemping (Pyt. 2); na których kempingach działają karty wydawcy\ni z jakiego źródła (Pyt. 3); czy karta należy do obsługi z prawem na tym kempingu (Pyt. 4); czy kemping otwarty na\nkarty sieci (Pyt. 6); czy wolno wymieniać karty z partnerem (Pyt. 8); karta sieci czy partnera (Pyt. 9).\nImplementacja referencyjna: `.claude/skills/archetype-implementer/references/party-impl.md`; moduł\nhttps://github.com/Archetypy-Oprogramowania/archetypes/tree/main/party (wzór klas, bez budowania repo).\n\n\u003c!-- krok: swappable-dsl.1 -->\n## Słowniki\n- **CO** (pytania w języku problemu): karta (card), UID karty (`CardRfid`), gość (guest), wydawca kart / partner\n  (issuer, partner), organizacja nadrzędna wydawcy (parent organisation), podgrupa wydawcy (issuer unit), sieć\n  (network), karta sieci (network card), kemping (campsite), słupek (pedestal, `PedestalCode`), umowa akceptacji\n  (acceptance agreement), karty działają / przyjmuje (accepted, accepts), karta personelu / obsługi (house card, staff\n  card), osoba z obsługi, ekipa, przypisanie obsługi (staff assignment), wymiana kart z partnerem (card exchange,\n  export), własna / przejęta umowa (own / inherited).\n- **Mapowanie** (pojęcie starego modelu → element nowego rozwiązania): sieć → Company (też wydawca); wydawca kart →\n  Company + rola WYDAWCA_KART; organizacja nadrzędna → Company + relacja PODLEGA; podgrupa wydawcy → OrganizationUnit +\n  JEDNOSTKA_WYDAWCY; kemping → OrganizationUnit z rolą MIEJSCE_ŁADOWANIA; umowa akceptacji → PartyRelationship\n  UMOWA_AKCEPTACJI (wydawca → kemping wprost, z ważnością); umowa przejęta od organizacji nadrzędnej → uprawnienie\n  KARTY_DZIAŁAJĄ_TU po ścieżce PODLEGA; karta (UID) → RegisteredIdentifier KARTA_RFID z wydawcą; karta sieci → KARTA_RFID\n  z wydawcą = Sieć; karta personelu → KARTA_RFID osoby (Person) z PRZYPISANIE_OBSŁUGI do kempingu (wprost albo przez\n  ekipę: CZŁONEK_EKIPY); wymiana kart z partnerem → WYMIANA_KART z UMOWA_AKCEPTACJI(Sieć → kempingi partnera);\n  słupek → rzut na `PartyId` kempingu (słupek nie jest stroną).\n  Kodowe formy mapowania (dozwolone): `Party`, `PartyId`, `Company`, `OrganizationUnit`, `Person`, `PartyRole`,\n  `PartyRelationship`, `RegisteredIdentifier`, `issuer`, `Issuer`, `parentOrganisation`, `subsidiary`, `campsite`,\n  `Campsite`, `acceptanceAgreement`, `staffAssignment`, `crew`, `networkCard`, `NETWORK` (Sieć jako wydawca).\n  Dozwolone złożenia z CO: „parent organisation” / `parentOrganisation` (organizacja nadrzędna — nie rodzic w drzewie),\n  „issuer unit”, „inherited agreement” (umowa przejęta od organizacji nadrzędnej).\n- **Zakazany** (słowa JAK starego modelu, których nie używa port, DSL, scenariusze ani nowe rozwiązanie): grupa\n  (`group`, `Group`, `GROUP`, `groupId`, `GroupId`, `guestGroup`, `issuerGroup`, `siteGroup`, `GroupType`), drzewo\n  (`tree`, `Tree`, `TREE`), rodzic / przodek (`parent`, `Parent`, `parentGroup`, `parentLine`, `ancestor`), poddrzewo\n  (`subtree`, `Subtree`, `collectSubtree`), najbliższy w górę (`nearest`, `Nearest`), typy drzew `SITE`, `ISSUER`,\n  `STAFF` (UPPER_CASE jako typ grupy), nazwa grupy kart sieci `NETWORK CARD`, prefiks nazwy (`prefix`, `PREFIX_AFFILIATE`,\n  `AFFILIATE`), atrybut grupy (`attribute`, `Attribute`), filtr wymiany (`whitelist`, `Whitelist`, `WhitelistFilter`,\n  `filter` w znaczeniu filtra wymiany), lista związanych grup (`associatedGroup`, `ASSOCIATEDGROUP`), `manageable`\n  (zakres jako poddrzewo).\n  Uwaga: `region` / rynek (market) to słowa domeny, nie mechanizmu — nie są zakazane, ale nowe rozwiązanie ich nie\n  wyraża (patrz „Poza nowym rozwiązaniem”), więc port i scenariusze ich nie potrzebują.\n\n\u003c!-- krok: swappable-dsl.1 -->\n## Kandydaci\nWiersze „Co i jak” ze źródła złączone z `analiza/drzewo-grup/crossing.json` (`asks`) i z bolączkami (kształt odpowiedzi\nz linii „odpowiedź:” przy wołającym w `zrodlo.md`; `crossing.json` nie ma pola `answer`). `plik:linia` = linia ze źródła\n(zwykle deklaracja metody); linię pytania ustala krok 2.\n\n| CO | Wołający (plik:linia) | JAK stare | JAK w nowym rozwiązaniu | Odpowiedź | Skąd (bolączka / źródło) |\n|---|---|---|---|---|---|\n| Gość przykłada kartę do gniazda na słupku: czy wydawca jego karty ma umowę obejmującą kemping, na którym stoi słupek? | `ValidationService.isCardAcceptedAt` (`campsite-core/src/main/java/io/pillopl/card/ValidationService.java:381`), woła ją `validateFor` (:261) | przelotka do `GroupService.isCardAcceptedAt(pedestalId, card)`: karta bez gościa → nie; lista kempingów z najbliższej niepustej listy umów wydawcy (poddrzewa); słupek nieskasowany w jednej z nich | KARTA_RFID → wydawca; słupek → kemping; KARTY_DZIAŁAJĄ_TU = umowy wydawcy ∪ umowy organizacji po PODLEGA | `boolean` — tak: słupek stoi na kempingu objętym umową wydawcy karty | B1, B3; Q1; Co i jak w. 1; crossing `asks: yes` |\n| Na których kempingach działają karty wydawcy (odpowiedź pośrednia przy przyłożeniu karty i na ekranie umów) | `GroupServiceHelper.extractAllAcceptingGroupIds` (`campsite-core/src/main/java/io/pillopl/group/GroupServiceHelper.java:52`) — metoda statyczna; wołają ją `GroupService.isCardAcceptedAt` i `GroupApiService.toAgreementDTO` (:277) | najbliższa w linii niepusta lista umów (wyższe zastępowane), każda pozycja → całe poddrzewo, lista bez powtórzeń | karta uprawnień wydawcy: kempingi z umów własnych ∪ umów organizacji wyżej; źródło przy pozycji | `List\u003cLong>` — id kempingów i regionów z całym poddrzewem (id z bazy legacy) | B1, B3; Q1; Co i jak w. 2; crossing `asks: partly` |\n| Słupek dostaje listę kart, które ma wpuszczać sam: karty których wydawców przyjmuje kemping tego słupka? | `LocalCardListService.buildLocalCardList` (`campsite-core/src/main/java/io/pillopl/card/LocalCardListService.java:138`) | gdy lista przyjmuje karty gości: `groupService.findIssuerGroupIdsAcceptedAt(grupa słupka)` (rekurencyjny SQL, najbliższy właściciel listy umów każdego wydawcy, umowa obejmuje grupę słupka albo przodka) → ważne karty tych wydawców | odwrotne UMOWA_AKCEPTACJI (to = kemping) → strony umów → PODLEGA w dół | `List\u003cLong>` — wydawcy (id grup z bazy legacy), których umowa własna albo przejęta obejmuje kemping słupka | B1, B3; Q2; Co i jak w. 3; crossing `asks: yes` |\n| Słupek dostaje listę kart, które ma wpuszczać sam: które karty personelu mają na niej być? | `LocalCardListService.buildLocalCardList` (`campsite-core/src/main/java/io/pillopl/card/LocalCardListService.java:138`) | gdy lista przyjmuje karty personelu: `houseCardService.getHouseCardsForPedestal(kod)` = aktywne karty grupy słupka i wszystkich przodków | PRZYPISANIE_OBSŁUGI (to = kemping, ważne dziś) → osoby wprost albo przez ekipę → ich KARTA_RFID | `List\u003cHouseCard>` — aktywne karty personelu kempingu słupka i organizacji nad nim | B1, B3; Q4; Co i jak w. 4; crossing `asks: yes` |\n| Przy wymianie z partnerami: czy kartę tego gościa wolno przekazać właśnie temu partnerowi? | `IssuerExchangeService.exportCards` (`campsite-core/src/main/java/io/pillopl/issuer/IssuerExchangeService.java:198`) | dla każdego partnera i karty `WhitelistFilterService.isSynchronizableForExport(grupa gościa, partner)`: najbliższy filtr eksportowy w linii rodziców celujący w partnera; brak = tak | WYMIANA_KART z UMOWA_AKCEPTACJI(Sieć → kempingi partnera); wyjątek jako nadanie wprost | `boolean` — tak: kartę wolno wysłać temu partnerowi | B3; Q15; Co i jak w. 6; crossing `asks: yes` |\n| Partner przysyła kartę, którą już znamy: czy to karta sieci? Jeśli tak, zmiana jest odrzucona. | `IssuerCardImportService.isNetworkCard` (`campsite-core/src/main/java/io/pillopl/issuer/IssuerCardImportService.java:187`), woła ją `importCard` (:81) | karta bez grupy gościa → nie; inaczej poddrzewo grupy o nazwie „NETWORK CARD” zawiera grupę gościa | KARTA_RFID z wydawcą = Sieć; polityka przypisania (b) | `boolean` — tak: to karta sieci | B1; Q16; Co i jak w. 7; crossing `asks: yes` |\n\nOdpadły: „Co i jak” w. 5 (Q12, `LocalCardListService.buildLocalCardList` — cała lista, pojemność i kolejność):\n„archetyp na to nie odpowiada”. Wiersze crossingu z `asks: no` (`GroupService.extractAllAcceptingSiteGroupIds`,\n`isAcceptedAt`, `isCardAcceptedAt(kod)`, `PedestalService.findPedestalsForGuest`) nie są w „Co i jak”, a i tak\n„nikt nie woła”.\n\n\u003c!-- krok: swappable-dsl.1 -->\n## Zmiany zachowania według źródła\n**W odpowiedziach** (na pytania kandydatów; i tak budujemy dzisiejsze zachowanie, człowiek potwierdza w kroku 4):\n- **Z1. Umowy się sumują.** Źródło: karty działają na kempingach z umów własnych wydawcy **i** umów organizacji\n  nadrzędnej („Zadar, Rovinj i Pula — umowy się sumują”, Otwarte 1). Dziś: własna niepusta lista umów zasłania umowy\n  wyżej (`GroupServiceHelper.java:52`, `GroupApiService.java:277`). Dotyczy: przyłożenie karty, kempingi wydawcy,\n  wydawcy przyjmowani na kempingu.\n- **Z2. Umowa wymienia kempingi wprost.** Źródło: umowa „na region” rozwija się przy zawarciu na listę kempingów\n  i nie śledzi składu regionu (Otwarte 2). Dziś: umowa z regionem obejmuje całe bieżące poddrzewo (przeniesiony\n  kemping wypada albo dochodzi). Bez przenoszenia odpowiedź ta sama; dotyczy tych samych pytań co Z1.\n- **Z3. Karta personelu tylko z przypisania do kempingu.** Źródło: karta osoby z obsługi działa tam, gdzie osoba\n  (albo jej ekipa) jest przypisana; dozorca nie ładuje u sąsiada z regionu. Dziś: aktywne karty personelu grupy\n  słupka **i wszystkich przodków** (karta wydana na region działa na każdym kempingu regionu, CAMP-211). Dotyczy:\n  karty personelu na liście słupka.\n- **Z4. Wymiana z partnerem z umów.** Źródło (Z — wariant roboczy, bez potwierdzenia): kartę sieci wysyłamy\n  partnerowi, gdy sieć ma umowę z kempingami partnera; wyjątki nadawane wprost. Dziś: najbliższy filtr eksportowy\n  w linii rodziców grupy gościa; brak filtra = tak (bez umowy też wysyłamy). Dotyczy: eksport kart.\n- **Z5. Ważność relacji.** Źródło: umowy i przypisania mają ważność od–do; po ścieżce PODLEGA część wspólna\n  (Z — wariant roboczy). Dziś umowy ani karty personelu z grupy nie mają dat (karta personelu ma tylko „aktywna”).\n  Bez dat w świecie odpowiedź ta sama.\n- **Z6. Źródło przy odpowiedzi.** Źródło: odpowiedź „tak/nie plus która umowa”, przy każdym kempingu źródło (własna /\n  przez organizację). Dziś: samo tak/nie i jedna flaga „przejęta” na wydawcę. Port zostaje przy dzisiejszym kształcie.\n\n**W skutkach komend** (tylko do wiadomości — workflow komend nie robi):\n- przeniesienie kempingu do innego regionu nie zmienia żadnej relacji (dziś zmienia odpowiedzi na wszystkie pytania wyżej);\n- tryb dostępu kempingu niezależnego = istnienie UMOWA_AKCEPTACJI(Sieć → kemping) zamiast przepięcia rodzica\n  (Z — wariant roboczy);\n- przejęcie karty powitalnej zmienia posiadacza identyfikatora zamiast zapisu karty personelu na grupie;\n- zmiana karty przy imporcie: wolno wydawcy karty, jego jednostkom i podmiotom zależnym (dziś: poddrzewo grupy\n  wydawcy partnera; przeniesienie grupy gościa zmienia odpowiedź);\n- zakończenie PODLEGA odbiera uprawnienia z tej ścieżki, umowy własne zostają.\n\n\u003c!-- krok: swappable-dsl.4 -->\n### Potwierdzenia (krok 4)\nPrzebieg bez człowieka (decyzja automatyczna). Nowe rozwiązanie we wszystkich przypadkach odpowiada po staremu.\n\n| Zmiana | Miejsca | Potwierdzenie |\n|---|---|---|\n| Z1 umowy się sumują | M1 | nierozstrzygnięte — zostaje dzisiejsze (reguła „własne umowy zastępują przejęte”, scenariusz `own_agreements_of_issuer_unit_replace_the_inherited_ones`) |\n| Z2 umowa wymienia kempingi wprost | M1 | nierozstrzygnięte — zostaje dzisiejsze (świat rozpisuje umowę „na region” na kempingi regionu, także dodane później); bez przenoszenia kempingów odpowiedź ta sama |\n| Z3 karta obsługi tylko z przypisania do kempingu | M4 | nierozstrzygnięte — zostaje dzisiejsze (świat rozpisuje kartę wydaną na region na przypisania do każdego kempingu regionu; scenariusz `staff_card_issued_for_the_region_…`) |\n| Z4 wymiana z partnerem z umów | M2 | nierozstrzygnięte — zostaje dzisiejsze (bez nadania wprost: tak; umowy sieci z kempingami partnera nie są czytane) |\n| Z5 ważność relacji | M1, M4 | nierozstrzygnięte — zostaje dzisiejsze; relacje w świecie zawsze ważne, ważność ma tylko identyfikator karty obsługi (nieaktywna = ważność zakończona) |\n| Z6 źródło przy odpowiedzi | M1–M4 | nie dotyczy wybranych miejsc — port zostaje przy tak/nie i zbiorze UID |\n\n\u003c!-- krok: swappable-dsl.1 -->\n## Poza nowym rozwiązaniem\n- region i rynek (grupowanie do raportów i rozliczeń) — w tym umowa „na region” jako forma zawarcia;\n- drzewo grup i reguła „najbliższe ustawienie wyżej”;\n- słupek, gniazdo, stanowisko, sekcja, budżet mocy (słupek tylko jako rzut na kemping);\n- lokalna lista kart, jej pojemność i kolejność (czy słupek trzyma listę, co wypada);\n- pula kart powitalnych kraju;\n- ważność i blokada karty, płatność QR (reszta decyzji o prądzie);\n- rozliczenia i raport rozliczeniowy wydawcy;\n- treść i warunki umowy akceptacji poza tym, gdzie działają karty;\n- statusy synchronizacji wymiany i format plików wymiany.\n\n\u003c!-- krok: swappable-dsl.2 -->\n## Miejsca\nKontrakt miejsc: [`miejsca.md`](miejsca.md). Od kroku 3 workflow pracuje tylko na nim.\nWybrane 4 miejsca u 4 różnych wołających: M1 przyłożenie karty (`ValidationService.validateFor`), M2 eksport karty do\npartnera (`IssuerExchangeService.exportCards`), M3 karta sieci przy imporcie (`IssuerCardImportService.importCard`),\nM4 karty personelu na liście słupka (`LocalCardListService.buildLocalCardList`). Odrzuceni: kandydaci w. 2 i 3\n(odpowiedź w id z bazy legacy) — powody w `miejsca.md`.\n\n\u003c!-- krok: swappable-dsl.3 -->\n## Port i świat\nPakiet `io.pillopl.acceptance` w `campsite-core` (moduł wszystkich czterech wołających), przedrostek `Acceptance`.\n\n**Port** `CardAcceptance` (jeden na obszar, metoda na pytanie):\n\n| Miejsce | Metoda | Odpowiedź |\n|---|---|---|\n| M1 | `boolean cardWorksAt(CardRfid card, PedestalCode pedestal)` | tak: karty wydawcy karty działają na kempingu słupka |\n| M2 | `boolean cardMayGoToPartner(CardRfid card, PartnerName partner)` | tak: kartę wolno wysłać temu partnerowi |\n| M3 | `boolean isNetworkCard(CardRfid card)` | tak: to karta sieci; karta nieznana → nie (wołający pyta tylko o znaną) |\n| M4 | `StaffCards staffCardsAt(PedestalCode pedestal)` | rekord `StaffCards(Set\u003cCardRfid> cards)` — UID-y kart personelu na liście słupka |\n\n`PartnerName` — nowy typ wartości w pakiecie portu (projekt nie ma typu na nazwę partnera; adapter legacy tłumaczy ją\nprzez `IssuerPartnerDao.findByName`). `CardRfid`, `PedestalCode` — typy projektu.\n\n**Odpowiedź-lista (M4).** Kolejność bez znaczenia (porównujemy jako zbiory; wołający sam sortuje „ostatnio używane\npierwsze” przy ucinaniu). Elementy, których port nie nazywa: legacy zwraca **wszystkie aktywne karty domowe**, także\nkarty wypożyczane gościom (typ RENTAL) — port mówi „karty personelu”, świat zakłada tylko karty personelu; różnica\npoza scenariuszami. UID karty domowej w legacy to dowolny tekst, a `CardRfid` przyjmuje tylko cyfry — karta domowa\nz UID-em niecyfrowym wywróci adapter (do sprawdzenia w kroku 5 na danych seedu i w bazie). Dwie aktywne karty o tym\nsamym UID dają jeden element (zbiór), a wołający dociąga encje po UID — zapis w kroku 5.\n\n**Adapter legacy** `LegacyCardAcceptance` (`@Component`, odczyt w transakcji tylko do odczytu):\n- M1: słupek po kodzie (`PedestalDao.findByCode`), karta po UID (`CampingCardDao.findByCardRfid`) →\n  `GroupService.isCardAcceptedAt(id słupka, karta)` — to samo wywołanie co `ValidationService.isCardAcceptedAt`.\n- M2: karta po UID, partner po nazwie → `WhitelistFilterService.isSynchronizableForExport(…, partner)`. Wołający ma\n  encję karty z `findCardsForPartnerExport`; adapter bierze najnowszą żywą kartę o tym UID — przy UID wydanym dwa\n  razy może trafić inną kartę (zapis w kroku 5).\n- M3: `card != null && isNetworkCard(card)` — linie `IssuerCardImportService.isNetworkCard` powtórzone w adapterze\n  (te same wywołania `GroupService`), bo adapter nie może zależeć od wołającego, w który zostanie wpięty (cykl\n  zależności w kroku 5). Bez szwu w legacy.\n- M4: `HouseCardService.getHouseCardsForPedestal(kod)` → UID-y.\n\n**Świat** `AcceptanceWorld` (pakiet `io.pillopl.acceptance.world`, zwykła klasa, transakcję daje test albo seeder):\n`region`, `campsiteIn(region, kemping)`, `pedestalAt(kemping, kod)`, `issuer`, `issuerUnit(wydawca, jednostka)`,\n`agreementWithCampsite`, `agreementWithRegion`, `guestCard(uid, wydawca)`, `cardWithoutGuest(uid)`,\n`partner` (partner jest też wydawcą swoich kart), `cardsNotSentTo(wydawca, partner)`, `cardsNotSentToAnyPartner`,\n`cardsSentTo(wydawca, partner)`, `staffCard(uid, kemping)`, `staffCardOfRegion(uid, region)`,\n`inactiveStaffCard(uid, kemping)`. Stała `NETWORK` = sieć jako wydawca (istnieje w każdym świecie).\n\n**`LegacyAcceptanceWorld`** zasila stary model: zachowaniem produkcyjnym tam, gdzie serwis nie wymaga zalogowanego\nużytkownika konsoli — `GroupManager.createChildGroup` / `addAcceptanceAgreement` (region, kemping, wydawca,\njednostka, umowy) i `WhitelistFilterService.saveFilter` (wyjątki i nadania wymiany, typ EXPORT); repozytoriami tam,\ngdzie serwis produkcyjny wymaga użytkownika konsoli albo go nie ma — gość i karta (`GuestDao`, `CampingCardDao`),\npartner (`IssuerPartnerDao`, z `validate()`; `IssuerApiService.saveIssuerPartner` wymaga uprawnienia CONFIG_EDIT),\nkarta personelu (`HouseCardDao`; `HouseCardService.saveHouseCard` wymaga właściciela kempingu), słupek z gniazdem\n(`PedestalDao`, `PedestalTypeDao`, `LocationDao`, jak fixture testów). Wszystko pod korzeniami rynku HR z seedu\nmigracji (`HR SITES`, `HR ISSUERS`, `NETWORK CARD`). Sieć = istniejąca grupa kart sieci.\n\nRegion jest w świecie, choć nowe rozwiązanie go nie wyraża („Poza nowym rozwiązaniem”): dzisiejsze odpowiedzi M1\n(umowa na region) i M4 (karta personelu wydana na region) od niego zależą, więc scenariusze go potrzebują; nowy\nświat musi go odwzorować (np. umowa na region rozwinięta przy zawarciu na kempingi — Z2).\n\n\u003c!-- krok: swappable-dsl.3 -->\n## Scenariusze\n`AcceptanceScenarios` (interfejs z domyślnymi testami), sterownik `AcceptanceLegacyDriver`, test\n`AcceptanceLegacyScenariosTest` (integracyjny, `IntegrationTest` + Testcontainers, transakcja na scenariusz otwierana\ni wycofywana ręcznie). Wybrzeże (`coast`): region Dalmatia z kempingami Zadar i Split, region Istria z kempingiem\nRovinj, po słupku na kempingu. Na legacy: 20/20 zielone.\n\n| Miejsce | Scenariusz | Given | When / then |\n|---|---|---|---|\n| M1 | card_works_at_campsite_its_issuer_has_an_agreement_with | wydawca z umową z Zadarem, karta gościa wydawcy | przy słupku w Zadarze → tak |\n| M1 | card_does_not_work_at_campsite_without_agreement | j.w. | Split, Rovinj → nie |\n| M1 | agreement_for_a_region_covers_every_campsite_in_it | umowa na region Dalmatia | Zadar, Split → tak; Rovinj → nie |\n| M1 | card_of_issuer_unit_works_where_its_issuer_has_an_agreement | jednostka wydawcy, umowa wydawcy z Zadarem, karta jednostki | Zadar → tak |\n| M1 | own_agreements_of_issuer_unit_replace_the_inherited_ones | jak wyżej + umowa jednostki z Rovinj | Rovinj → tak; Zadar → nie (dzisiejsze; źródło: Z1) |\n| M1 | card_of_issuer_without_agreements_works_nowhere | wydawca bez umów | Zadar → nie |\n| M1 | card_handed_to_no_guest_works_nowhere | karta bez gościa | Zadar → nie |\n| M2 | network_card_goes_to_partner_without_exception | partner Adria, karta sieci | do Adrii → tak |\n| M2 | exception_for_a_partner_keeps_network_cards_from_that_partner_only | jednostka sieci z wyjątkiem „nie do Adrii”, karta jednostki | Adria → nie; Alpine → tak |\n| M2 | exception_for_every_partner_keeps_network_cards_from_all | wyjątek „do żadnego partnera” | Adria, Alpine → nie |\n| M2 | exception_of_the_issuer_covers_the_cards_of_its_units | wyjątek na jednostce, karta jej podjednostki | Adria → nie |\n| M2 | permission_granted_to_a_unit_replaces_the_exception_of_its_issuer | jednostka: „do żadnego”; podjednostka: „do Adrii wolno” | karta podjednostki: Adria → tak, Alpine → nie; karta jednostki: Adria → nie |\n| M3 | card_of_the_network_is_a_network_card | karta sieci | → tak |\n| M3 | card_of_a_network_unit_is_a_network_card | karta jednostki sieci | → tak |\n| M3 | card_of_a_partner_is_not_a_network_card | karta partnera | → nie |\n| M3 | card_handed_to_no_guest_is_not_a_network_card | karta bez gościa | → nie |\n| M4 | active_staff_cards_of_the_campsite_are_on_the_list | dwie karty personelu Zadaru | lista słupka w Zadarze = obie |\n| M4 | inactive_staff_card_is_not_on_the_list | aktywna i nieaktywna karta Zadaru | = tylko aktywna |\n| M4 | staff_card_of_another_campsite_is_not_on_the_list | karta personelu Splitu | Zadar = pusta |\n| M4 | staff_card_issued_for_the_region_is_on_the_list_of_every_campsite_in_it | karta personelu regionu Dalmatia | Zadar, Split = ta karta; Rovinj = pusta (dzisiejsze; źródło: Z3) |\n\nGrep słownika zakazanego (`grep -rnw`, formy kodowe z „Słowniki”) po porcie, `PartnerName`, `StaffCards`,\n`AcceptanceWorld`, DSL i scenariuszach: zero trafień.\n\n\u003c!-- krok: swappable-dsl.4 -->\n## Nowe rozwiązanie w kodzie\nModuł `campsite-party` (pakiet `io.pillopl.party`, bez zależności od reszty projektu — także od typów wartości),\n`CLAUDE.md` modułu. Wzór klas: `examples/party-minimal/` + rekordy `Validity` i `RegisteredIdentifier` z referencji\n(`party-impl.md`); bez `Result`, zdarzeń, wersji, polityk ról/relacji, adresów i capabilities.\n\n| Klasa | Element specyfikacji | Uwagi |\n|---|---|---|\n| `PartyId`, `Party` (`PartyKind`: COMPANY / ORGANIZATION_UNIT / PERSON) | strony: Company, OrganizationUnit, Person | jedna klasa z rodzajem zamiast hierarchii sealed (minimalny zestaw) |\n| `Role` | role: NETWORK_OPERATOR (sieć), CARD_ISSUER (WYDAWCA_KART), CHARGING_PLACE (MIEJSCE_ŁADOWANIA), CAMPSITE_SERVICE (OBSŁUGA) | NETWORK_OPERATOR — element techniczny: po nim model rozpoznaje Sieć (M3) |\n| `PartyRelationship` + `RelationshipName`, `Validity` | UMOWA_AKCEPTACJI (ACCEPTANCE_AGREEMENT), JEDNOSTKA_WYDAWCY (ISSUER_UNIT_OF), PODLEGA (SUBSIDIARY_OF), PRZYPISANIE_OBSŁUGI (STAFF_ASSIGNMENT) | SUBSIDIARY_OF w modelu, świat go nie używa (scenariusze nie mają organizacji nadrzędnej poza jednostką) |\n| `RegisteredIdentifier` (CARD_RFID) | KARTA_RFID z wydawcą (karta gościa — na wydawcy) / osoby (karta obsługi — na osobie) | ważność identyfikatora = „aktywna” karta obsługi |\n| `DirectGrant` (CARD_EXCHANGE) | wyjątki wymiany „nadawane wprost” | także nadanie „do każdego partnera” (`towards` puste) — element dodany do starego zachowania |\n| `CardRights` | uprawnienia KARTY_DZIAŁAJĄ_TU, WYMIANA_KART, ŁADOWANIE_OBSŁUGI; „karta sieci” | reguły starego zachowania niżej |\n| `Parties`, `PartyConfiguration.inMemory()` | rejestr w pamięci, composition root | elementy techniczne wymuszone przez port |\n\nPo stronie portu (campsite-core): `PartyProjection` (rzut słupka na kemping i nazwy partnera na stronę — wspólny dla\nświata i adaptera), `PartyCardAcceptance` (adapter, nie bean — wpięcie w kroku 5), `world/PartyAcceptanceWorld`;\ntesty: `AcceptancePartyDriver`, `AcceptancePartyScenariosTest` (bez Springa, model i rzut nowe na scenariusz).\nScenariusze na nowym modelu: 20/20 zielone za pierwszym podejściem; izolacja (grep importów `io.pillopl` spoza\n`io.pillopl.party` w module) — pusto; grep słownika zakazanego — trafienia tylko `filter` jako metoda strumienia Javy\n(`Stream.filter`, nie filtr wymiany) i złożenie dozwolone „parent organisation” w komentarzu.\n\n**Reguły starego zachowania (nazwane w języku modelu):**\n- „własne umowy zastępują przejęte” — umowy pierwszej strony z jakąkolwiek umową, idąc od wydawcy przez ISSUER_UNIT_OF /\n  SUBSIDIARY_OF w górę (Z1); scenariusz `own_agreements_of_issuer_unit_replace_the_inherited_ones`;\n- „własne nadanie wymiany zastępuje przejęte”, bez nadania — wolno (Z4); scenariusze M2;\n- umowa i karta obsługi „na region” rozpisane przez świat na kempingi regionu, także dodane do regionu później (Z2, Z3) —\n  region zostaje poza modelem; dopisywanie kempingu dodanego później: **niesprawdzona scenariuszem**;\n- „nieaktywna karta obsługi” = identyfikator z zakończoną ważnością.\n\n**Nie użyto:** CZŁONEK_EKIPY / ekipa (świat nie ma komendy ekipy), polityka przypisania identyfikatora (zmiana karty —\nkomenda), ważność relacji poza identyfikatorem (Z5), źródło przy odpowiedzi (Z6), umowy Sieci z kempingami partnera\njako źródło WYMIANA_KART (Z4).\n\n\u003c!-- krok: swappable-dsl.4 -->\n### Różnice poza scenariuszami\n- **M1/M4 przeniesienie kempingu**: stary model liczy umowy „na region” i karty obsługi regionu po bieżącym składzie\n  regionu; nowy — po relacjach zapisanych przy zawarciu (świat dopisuje tylko kempingi dodane do regionu).\n- **M1 słupek skasowany / na regionie**: stary model nie przyjmuje karty przy słupku skasowanym, a słupek może wisieć na\n  regionie; świat nowego modelu ma słupki tylko na kempingach i bez kasowania.\n- **M2 jedno nadanie na wydawcę**: w starym modelu wydawca ma jeden filtr wymiany — drugi zapis go nadpisuje (także\n  partnera); nowy model trzyma wszystkie nadania i bierze pierwsze pasujące. Świat nadaje najwyżej jedno na wydawcę.\n- **M2 karta albo partner nieznani**: stary adapter rzuca NPE przy nieznanej karcie, a dla nieznanego partnera stosuje\n  tylko nadanie „do każdego partnera”; nowy odpowiada „nie” (brak). Wołający pyta tylko o znane karty i partnerów.\n- **M4 karty wypożyczane (RENTAL)**: stary model zwraca wszystkie aktywne karty domowe, nowy tylko karty obsługi.\n- **M4 dwie aktywne karty o tym samym UID**: w obu jeden element zbioru (zapis z kroku 3 bez zmian).\n- **Czas**: nowy model liczy ważność zegarem modelu (`Clock` w `PartyConfiguration`); stary „aktywna” bez dat.\n\n\u003c!-- krok: swappable-dsl.4 -->\n## Nieudane miejsca\n| Miejsce | Czego brakuje (w specyfikacji / w implementacji) | Podejścia |\n|---|---|---|\n| brak | | |\n\n\u003c!-- krok: swappable-dsl.5 -->\n## Wpięcie, przełącznik, seeder\nAbstrakcja i przełącznik jedną bramką: adapter legacy jest beanem (`@Component`), ale port ma dwie implementacje, więc\nwybór modelu (`@Primary`) powstał razem z wpięciem. Każdy wołający dostał drugi konstruktor z portem (`@Autowired`,\nwybiera go kontener); stary konstruktor zostaje, przekazuje `null` i pyta stary kod bezpośrednio (istniejące testy\nz `new …` bez zmian).\n\n| Miejsce | Wołający — linia pytania | Przez port | Stara droga (wartość z bazy, której typ portu nie przyjmie) |\n|---|---|---|---|\n| M1 | `ValidationService.isCardAcceptedAt` (wołana z `validateFor`, `card/ValidationService.java:329`) | `cardWorksAt(CardRfid karty, PedestalCode słupka)` | UID karty niecyfrowy albo kod słupka, którego `PedestalCode` nie przyjmie |\n| M2 | `IssuerExchangeService.exportCards` → `isSynchronizableForExport(card, partner)` | `cardMayGoToPartner(CardRfid, PartnerName)` | UID niecyfrowy; nazwa partnera pusta albo ze spacjami na brzegach (`PartnerName` przycina — adapter szukałby innej nazwy) |\n| M3 | `IssuerCardImportService.importCard` → `isNetworkCard(card, cardRfid)` | `isNetworkCard(CardRfid)` (UID dziesiętny po `toDecimalUid`) | UID, którego `CardRfid` nie przyjmie |\n| M4 | `LocalCardListService.buildLocalCardList` → `getHouseCardsForPedestal(pedestal)` | `staffCardsAt(PedestalCode)`, potem encje `HouseCard` dociągane po UID | kod słupka nie do przyjęcia albo karta domowa z UID-em niecyfrowym (adapter legacy rzuca `InvalidValueException` — wołający łapie i pyta starą drogą, z ostrzeżeniem w logu) |\n\n**Przełącznik startowy** `AcceptanceConfiguration` (`io.pillopl.acceptance`, campsite-core): `acceptance.model=legacy|party`\n(środowisko `ACCEPTANCE_MODEL`), domyślnie `legacy`; inna wartość zatrzymuje start. Beany: `PartyConfiguration.inMemory()`,\n`PartyProjection`, `PartyCardAcceptance` (zawsze — seeder zasila oba modele) i `@Primary CardAcceptance` = wybrany model.\nLog przy starcie: `Acceptance model: LEGACY|PARTY (acceptance.model=…) answers the card acceptance questions`.\nPrzełącznik obejmuje tylko cztery miejsca — reszta systemu pyta stary kod; na nowym modelu miejsca odpowiadają tylko\no dane z seedu (dane demo: „
