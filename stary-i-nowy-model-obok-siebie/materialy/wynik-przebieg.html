. Operacja „get…” — filtr audytu konsoli traktuje ją jak odczyt. Klient API (`schema.d.ts`) nie\nregenerowany: typ odpowiedzi w pliku ekranu. Bez frontu: curl z sesją konsoli (login `/api/console/auth/login`,\nnagłówek `X-XSRF-TOKEN` z ciasteczka `XSRF-TOKEN`) na ten sam endpoint.\n\n**Testy:** `AcceptanceLeverSection.test.tsx` (wajcha i checkbox zapisują klucze przez `setSystemProperty`, powrót =\npusta wartość, liczniki zwinięte, różnice po rozwinięciu) — `testy_front`; `AcceptanceLeverWebServiceIntegrationTest`\n(nieruszona wajcha = model startowy bez porównania, zmiana w system properties widoczna od razu, recepcja 403, bez\nlogowania 401) — dopisany do `testy_krok`.\n\n**Zrzuty:** `ekran/wajcha/` (`wajcha-story.json`, aplikacja na seedzie, wajcha startowo nieruszona): nieruszona →\nporównanie włączone + rozwinięte wyniki (0 / 0 — po starcie nikt nie pytał) → wajcha na party → powrót na model\nstartowy i porównanie wyłączone (`AcceptanceCompare` zostaje zapisane jako `false`). Liczniki niezerowe pokazuje\ndopiero przełączenie w kroku router.5.\n\n\u003c!-- krok: parallel-model-router.4 -->\n## Testy routera i zgodności\nBez mocków: Party w pamięci (`PartyConfiguration.inMemory()` na test), stary model jak w sterowniku legacy\n(`IntegrationTest` + Testcontainers). Wajcha w testach routera i zgodności — `InMemoryAcceptanceLever` (implementacja\ntestowa `CardAcceptanceRouter.Lever`); jedyny fake portu — `FailingModel` (awaria modelu). Kod produkcyjny bez zmian.\n\n| Test | Gdzie | Co sprawdza |\n|---|---|---|\n| `CardAcceptanceRouterTest` (8) | campsite-core | Party zna słupek i kartę, których baza starego modelu nie zna, więc modele odpowiadają różnie i odpowiedź mówi, kto odpowiedział. Dla czterech pozycji wajchy (legacy / party × z porównaniem / bez): kto odpowiedział, czy zaszło porównanie (liczniki `summary()`), co trafiło do pliku (`answering`, `question`, `legacy`, `new`); zgodne odpowiedzi tylko liczone; awaria modelu, który nie odpowiada, tylko w pliku (`error`), awaria modelu, który odpowiada, dochodzi do wołającego bez zmiany typu; wyjątek starego modelu pytanego jako drugi (NPE przy nieznanej karcie w M2) w `REQUIRES_NEW` + `readOnly` nie oznacza transakcji wołającego do wycofania |\n| `AcceptanceLeverTest` (6) | campsite-core | wajcha w prawdziwym `SYSTEM_PROPERTY` (`SystemPropertyService`), model startowy legacy: bez ustawień — legacy bez porównania; zmiana działa od następnego pytania; powrót na `legacy`; pusta wartość = model startowy; nieznane wartości = model startowy bez porównania; wyłączenie porównania. Transakcja na test wycofywana, cache ustawień przeładowany przed i po |\n| `AcceptanceModelsAgreementTest` (20) | campsite-core | sterownik `AcceptanceRouterDriver` pod te same `AcceptanceScenarios` (świat `BothModelsWorld` — każda komenda do światów obu modeli, świat per scenariusz); scenariusze idą przez router z wajchą na legacy i porównaniem. Po każdym scenariuszu (`@AfterEach`) wszystkie kombinacje wartości portu z jego świata (karty × słupki i każda karta dla M1/M3, karty gości × partnerzy dla M2, słupki dla M4) z wajchą na legacy, po przełączeniu na party i po powrocie: odpowiedzi równe, liczba porównań = liczba pytań, zero różnic, plik różnic pusty |\n| `AcceptanceSeedModelsAgreementTest` (1) | campsite-server (widzi seeder; profile `demo,acceptance-seed`) | router aplikacji i wajcha w `SYSTEM_PROPERTY` na seedzie: M1 5 kart gości × 3 słupki, M2 4 karty sieci × 2 partnerzy, M3 10 kart, M4 3 słupki (36 pytań na pozycję) — legacy → party → legacy, z porównaniem: odpowiedzi równe, porównań tyle co pytań (108), żadnej nowej różnicy. Katalog różnic `target/acceptance-reconciliation-seed-agreement` |\n\nTest nie sprawdza, jakie są odpowiedzi — to robią scenariusze; tylko że modele mówią to samo. Router w teście\nzgodności pyta drugi model bez osobnej transakcji (`TransactionOperations.withoutTransaction()`): świat starego modelu\nżyje w niezatwierdzonej transakcji scenariusza (sekcja „Router”, skutek 3); transakcję `REQUIRES_NEW` sprawdza\n`CardAcceptanceRouterTest` i test na seedzie (seed zatwierdzony).\n\n**Dziedzina pytań w teście zgodności.** M2 tylko dla kart gości: wołający eksportuje karty gości, a karta bez gościa\nw starym adapterze daje NPE, w Party „nie” (znana różnica poza scenariuszami, „M2 karta albo partner nieznani”). Karty\npersonelu nie są pytane w M1–M3 (to inna dziedzina — karty domowe, nie karty gości).\n\n**Wynik:** 35/35 nowych testów zielone za pierwszym podejściem, zero różnic. Testy dopisane do `testy_krok`.\n\n\u003c!-- krok: parallel-model-router.5 -->\n## Przełączenie na żywo\n**Przebieg** (jeden start aplikacji, nowa paczka, ta sama baza `run2-pg` z seedem, `ACCEPTANCE_MODEL=legacy`, joby\nwyłączone; wajcha ustawiona jawnie na `legacy` bez porównania — w bazie zostały wartości z kroku router.3). Nagrania\nw `ekran/przelaczenie/` (zrzuty i `answers.jsonl` w gicie, `video.webm` lokalnie), zestawienie `story.html`:\n\n| Faza | Wajcha | Co | Wynik |\n|---|---|---|---|\n| `przed` | `legacy`, bez porównania (ustawiona endpointem na starcie nagrania) | okienka z kroku 6: M1 15 przypadków, M4 3 słupki, wymiana (M3 import Alpine Club, M2 eksport do Kvarner/Alpine); API M1/M4 (`api-przed.jsonl`); pliki wymiany (`wymiana-przed.jsonl`) | = nagraniu legacy z kroku 6 (19/19, 18/18, 5/5) |\n| `wajcha-na-party` | ekran wajchy: „Compare both models” → „Party model” | zrzut przed i po przełączeniu | `AcceptanceAnswer = 'party'`, `AcceptanceCompare = 'true'` |\n| `po` | `party`, z porównaniem | te same okienka i przypadki, to samo API i pliki wymiany | przed vs po: ekran 19/19, API 18/18, wymiana 5/5 takie same |\n| `wyniki-i-powrot` | ekran wajchy: rozwinięte wyniki → „Legacy model”, porównanie wyłączone | liczniki i ostatnie różnice; powrót | API po powrocie (`api-po-powrocie.jsonl`) = przed (18/18) |\n\n**Log routera** (`ekran/przelaczenie/log-wajchy.txt`): start `LEGACY (acceptance.model=legacy)`, przy pierwszym pytaniu\n`LEGACY without comparison`, po przełączeniu `PARTY with comparison (was: LEGACY without comparison)`, po powrocie\n`LEGACY without comparison (was: PARTY with comparison)` — wajcha się przesunęła, bez restartu.\n\n**Rekonsyliacja** (`wajcha-po.jsonl`, ekran): 42 zgodne / 28 różnych. Wszystkie pytania o przypadki seedu zgodne —\nM1 24 (12 na ekranie, 12 w API; karta bez gościa nie dochodzi do pytania), M4 6, M3 4 (linie importu ze znaną kartą),\nM2 8 (4 karty sieci seedu × 2 partnerów). **Plik różnic dla seedu pusty** (`roznice-seed.jsonl`); cały plik\n(`roznice.jsonl`, kopia `target/acceptance-reconciliation/differences-2026-10-24.jsonl`) ma 28 różnic, wszystkie o\ndanych demo spoza seedu:\n- `staffCardsAt` ISTRIABAY-P01 × 18 — ekran Karty przy każdym wejściu ładuje listę kart pierwszego słupka z listy\n  (słupek demo), zanim nagranie wybierze słupek seedu; Party nie zna słupków demo (pusta lista);\n- `cardMayGoToPartner` 5 kart sieci demo × Kvarner/Alpine — eksport listy kart obejmuje karty demo (pułapka z kroku 5);\n  na Party „nie”, więc **z wajchą na party te karty demo nie wyszły do partnerów** — prawdziwa zmiana zachowania\n  poza seedem, na żywym systemie.\n\n**Wejście wymiany jest jednorazowe** (przebieg zjada plik importu i oznacza karty jako wysłane), a przełączenie jest\nbez restartu, więc seeder go nie odtwarza: `wejscie-wymiany.mjs` (snapshot pliku kart po starcie, przed każdym\nprzebiegiem `restore`: katalogi partnerów puste, plik z powrotem, karty sieci seedu `PARTNER_SYNC_STATE=ADD` przez\n`psql` w kontenerze) — krok `exec` w `story.json` przed „Run exchange now”.\n\n**Jak przełączyć:** konsola → Administration → Acceptance lever → „Compare both models” (zalecane przy pierwszym\nprzełączeniu) → „Party model”; działa od następnego pytania na tym węźle. Bez ekranu:\n`POST /api/console/administration/setSystemProperty` `{\"key\":\"AcceptanceAnswer\",\"value\":\"party\"}` i\n`{\"key\":\"AcceptanceCompare\",\"value\":\"true\"}` (sesja konsoli, `X-XSRF-TOKEN`, prawo `CONFIG_EDIT`, audyt\n`CONFIG_CHANGE`). **Jak wrócić:** „Legacy model” (albo „Back to start-up model” — pusta wartość = `acceptance.model`),\nporównanie odznaczone; endpointem `AcceptanceAnswer=legacy`, `AcceptanceCompare=false`. Stan wajchy jest w bazie\ni przeżywa restart. **Plik różnic:** `acceptance.reconciliation.dir` (`ACCEPTANCE_RECONCILIATION_DIR`, lokalnie\n`target/acceptance-reconciliation`), `differences-YYYY-MM-DD.jsonl`; liczniki w pamięci węzła od startu.\n\n**Czego przełączenie nie obejmuje:** reszty systemu (pyta stary kod wprost — także inne odczyty kart, umów i list);\nwołających spoza `miejsca.md` (np. `GroupApiService.toAgreementDTO`, wydawcy przyjmowani na liście słupka); danych\nspoza seedu (Party zna tylko seed: dla danych demo „nie” / pusta lista — patrz różnice wyżej, na żywym systemie to\nzmiana zachowania); komend (umowy, karty, filtry wymiany idą do starego modelu, Party się po nich starzeje);\nwartości, których typ portu nie przyjmie (wołający idzie starą drogą); innych węzłów (cache per węzeł — „Reload\nconfiguration”); jobów (wyłączone w przebiegu).\n\n## Odstępstwa (zmienione pliki legacy)\n| Krok | Plik | Co | Powód (test / wpięcie / wajcha / ekran / build) |\n|---|---|---|---|\n| swappable-dsl.3 | — | brak zmian legacy (bez szwu: logika `isNetworkCard` powtórzona w adapterze) | — |\n| swappable-dsl.4 | `pom.xml` | moduł `campsite-party` w `\u003cmodules>` i w `dependencyManagement` | build |\n| swappable-dsl.4 | `campsite-core/pom.xml` | zależność od `campsite-party` (adapter i świat nowego modelu w pakiecie portu) | build |\n| swappable-dsl.5 | `campsite-core/src/main/java/io/pillopl/card/ValidationService.java` | drugi konstruktor z portem; `isCardAcceptedAt` pyta port (M1) | wpięcie |\n| swappable-dsl.5 | `campsite-core/src/main/java/io/pillopl/issuer/IssuerExchangeService.java` | drugi konstruktor z portem (stary deleguje z `null`); pytanie w pętli eksportu przez `isSynchronizableForExport` (M2) | wpięcie |\n| swappable-dsl.5 | `campsite-core/src/main/java/io/pillopl/issuer/IssuerCardImportService.java` | drugi konstruktor z portem (stary deleguje z `null`); `isNetworkCard(card, cardRfid)` przez port (M3) | wpięcie |\n| swappable-dsl.5 | `campsite-core/src/main/java/io/pillopl/card/LocalCardListService.java` | drugi konstruktor z portem i `HouseCardDao` (stary deleguje z `null`); karty domowe słupka przez port (M4) | wpięcie |\n| swappable-dsl.5 | `pom.xml` | moduł `campsite-seeder` w `\u003cmodules>` i w `dependencyManagement` | build |\n| swappable-dsl.5 | `campsite-server/pom.xml` | zależność od `campsite-seeder` | build |\n| parallel-model-router.2 | `campsite-core/src/main/java/io/pillopl/config/SystemPropertyKey.java` | klucze `AcceptanceAnswer`, `AcceptanceCompare` (bez migracji i bez nazwanych getterów) | wajcha |\n| parallel-model-router.3 | `campsite-console/src/pages/AdministrationPage.tsx` | podsekcja „Acceptance lever” w `SECTIONS` i jej render (import nowego `AcceptanceLeverSection`) | ekran |\n| parallel-model-router.4, .5 | — | brak zmian legacy (testy; nagrania, skrypt wejścia wymiany w `ekran/`) | — |\n","zrodlo":"## Pogłębienie: party\n\n> Pogłębienie (archetype-storyteller, tryb pogłębienie), 2026-10-24, osobne uruchomienie po skanie. Prompt uczestnika:\n> `/archetype-storyteller Pogłębienie: party. Skan: analiza/archetypy.md. Miejsca: ValidationService.isCardAcceptedAt, GroupServiceHelper.extractAllAcceptingGroupIds, LocalCardListService.buildLocalCardList, IssuerExchangeService.exportCards, IssuerCardImportService.isNetworkCard` + bolączki z adresami w kodzie (niżej).\n> Mapper: osobny agent (narzędzie Agent), tryb „wskazane miejsca”; 2 rundy (pytania → odpowiedzi → KOMPLETNE).\n\n**Wynik w jednym zdaniu:** wystąpienie Party zmapowane kompletnie; umowy akceptacji, podległość wydawców i przypisania obsługi stają się relacjami między stronami, z których wynika, gdzie karta ładuje — bez udziału regionów.\n\n| wystąpienie | archetyp | poziom złożoności | status mapowania | liczba założeń |\n|---|---|---|---|---|\n| Wydawcy kart, partnerzy i obsługa kempingu jako strony: kto przez kogo i gdzie może ładować | Party | 3 | KOMPLETNE | 8 |\n\n### Opowieść i łączenie\n\nBez zmian względem sekcji „Opowieść” skanu: jedno wystąpienie, bez integracji i bez odniesień semantycznych. Pole `IDENTYFIKATORY I RZUTY` mappera (kemping przy słupku, UID karty z wydawcą, rynek kempingu, kod partnera wymiany) nie ma drugiego końca wśród wystąpień PASUJE, więc żadnego odniesienia nie dodaje.\n\n### Mapowanie\n\n### Party Archetype Model: sieć kempingów, wydawcy kart, partnerzy i obsługa\n\n#### Complexity Level\nPoziom 3. Partner jest jednocześnie wydawcą kart i miejscem ładowania („Działa to też w drugą stronę: goście sieci ładują u partnera”, business-context.md §2 Wydawcy kart). Są wydawcy z organizacją nadrzędną i z podgrupami („Sieć ma też wydawców międzynarodowych i wydawców z podgrupami”, §2). Relacje decydują o logice: od relacji wydawca → organizacja nadrzędna zależy, czy karta dostanie prąd (problem.md, Pytanie 3). Do tego dochodzą prawa ładowania ludzi obsługi (§2 Pracownicy).\n**W zakresie:** typy stron i PartyId, identyfikator karty jako RegisteredIdentifier, role globalne i role w relacjach, relacje z regułami i ważnością, uprawnienia wyprowadzane z relacji (karta uprawnień), polityki (przypisania karty, wymiany z partnerem).\n**Poza zakresem:** adresy i zgody (wejście ich nie pokazuje), RoleRequirements, capabilities w sensie „co strona umie” (prawa ładowania to uprawnienia z relacji, nie kompetencje).\n\n#### Concept Mapping\n\n| Pojęcie domenowe | Element archetypu Party | Uwagi |\n|---|---|---|\n| Sieć (operator) | Company | sama też jest wydawcą (karty sieci) |\n| Wydawca kart (partner) | Company + rola globalna WYDAWCA_KART | rola, nie typ; ten sam podmiot może być też OPERATOREM_MIEJSC |\n| Partner jako miejsce, gdzie ładują goście sieci | ta sama Company, rola OPERATOR_MIEJSC_ŁADOWANIA + relacja UMOWA_AKCEPTACJI (Sieć → kemping partnera) | wielorolowość (element 2) |\n| Organizacja nadrzędna wydawcy | Company + relacja PODLEGA (wydawca → organizacja nadrzędna) | realna relacja między firmami (potwierdzone: zostaje wariant roboczy) |\n| Podgrupa wydawcy | OrganizationUnit + relacja JEDNOSTKA_WYDAWCY | kartę wolno zmieniać wydawcy i jego jednostkom (Pytanie 9) |\n| Kemping | OrganizationUnit (sieci albo właściciela afiliowanego) z rolą MIEJSCE_ŁADOWANIA | kemping działa: przyjmuje karty, przejmuje karty, ma obsługę |\n| Właściciel afiliowany (kempingu niezależnego) | Person albo Company + relacja WŁASNOŚĆ_KEMPINGU | wejście nie przesądza, czy to osoba, czy firma; model dopuszcza obie |\n| Umowa akceptacji („karty wydawcy działają na wskazanych kempingach”) | PartyRelationship UMOWA_AKCEPTACJI: WYDAWCA → MIEJSCE_ŁADOWANIA, z ważnością | jedna relacja na każdy kemping wymieniony wprost; region tylko pomaga go wybrać przy zawieraniu (potwierdzone) |\n| Umowa „odziedziczona po organizacji nadrzędnej” | uprawnienie wyprowadzone po ścieżce PODLEGA → UMOWA_AKCEPTACJI, **sumowane** z umowami własnymi | potwierdzone: własna umowa nie zabiera kempingów z umowy organizacji nadrzędnej |\n| „Tryb dostępu”: otwarty na karty sieci / tylko własne karty obsługi | istnieje albo nie istnieje relacja UMOWA_AKCEPTACJI (Sieć jako wydawca → kemping afiliowany) | przełączenie trybu = zawarcie albo zakończenie relacji, bez przenoszenia kempingu w drzewie |\n| Zgoda kempingu na przejmowanie kart powitalnych | atrybut roli MIEJSCE_ŁADOWANIA kempingu afiliowanego (polityka przejęcia) | |\n| Przejęcie karty powitalnej | przeniesienie identyfikatora karty z puli sieci do właściciela kempingu, z relacją PRZYPISANIE_OBSŁUGI do tego kempingu | sama pula to pojęcie niezmapowane |\n| Karta (UID RFID) | RegisteredIdentifier KARTA_RFID z ważnością i wydawcą (PartyId) | karta nie jest stroną |\n| „Karta należy do wydawcy; zmiany od innego są odrzucane” | reguła przypisania identyfikatora: zmieniać go może tylko wydawca, który go nadał (albo jego jednostka lub podmiot zależny) | element 3, własność karty |\n| Karta sieci a karta wydawcy | ten sam identyfikator, różni się wydawcą (Sieć vs partner) | bez „poddrzewa NETWORK CARD” |\n| Gość z kartą wydawcy | brak strony: sieć zna tylko identyfikator karty i jej wydawcę | gość, który nigdy się nie rejestruje, nie tworzy strony |\n| Gość sieci (karta sieci) | Person, gdy sieć go meldowała; inaczej sam identyfikator | założenie |\n| Pracownik obsługi, dozorca, sezonowy | Person + relacja PRZYPISANIE_OBSŁUGI → kemping | element 5 |\n| Ekipa remontowa | OrganizationUnit EKIPA + PRZYPISANIE_OBSŁUGI → kempingi; członkowie przez CZŁONEK_EKIPY | potwierdzone: przypisanie ma osoba albo ekipa, więc w roli OBSŁUGA osoba i organizacja są wymienne (element 4 ma teraz pokrycie) |\n| Prawo ładowania obsługi („bez ograniczeń”) | uprawnienie ŁADOWANIE_OBSŁUGI wyprowadzone z PRZYPISANIE_OBSŁUGI, ważne tyle, ile relacja | omijanie budżetu mocy i zajętego gniazda to decyzja procesu, nie Party |\n| „Tylko słupki 3–7” | zawężenie uprawnienia do części miejsca (zakres miejsca jako atrybut przypisania) | archetyp nie zna słupków |\n| Wymiana kart z partnerem (eksport / import) | wynika z UMOWA_AKCEPTACJI w obu kierunkach: eksport = Sieć ma umowę z miejscami partnera; import = partner ma ważną umowę z miejscami sieci + rola WYDAWCA_KART | dzisiejszy filtr „najbliższy w górę drzewa wydawców” zastępują relacje i wyjątki nadawane wprost |\n| Operator sieci, administrator rynku (zakres w konsoli) | Person + relacja ODPOWIADA_ZA (osoba → kemping/rynek) | tylko jako źródło „w moim zakresie”; uwierzytelnianie poza Party |\n\n#### Unmapped Concepts\n- Region i rynek jako grupowanie do raportów i rozliczeń. Nie są stronami ani relacjami, z których wynikają uprawnienia: przeniesienie kempingu do innego regionu nie zmienia tego, kto na nim ładuje (potwierdzone, cel B1).\n- Drzewo grup i reguła „najbliższe ustawienie wyżej”: mechanizm dzisiejszego rozwiązania, zastąpiony relacjami i polityką.\n- Słupek, gniazdo, stanowisko, sekcja i budżet mocy: rzeczy i zasoby, nie strony.\n- Lokalna lista kart, jej pojemność i kolejność (karty obsługi przed kartami gości): reguła dystrybucji na sprzęt.\n- Pula kart powitalnych danego kraju (zapas niewydanych kart).\n- Ważność i blokada karty, płatność QR: część decyzji o prądzie poza Party.\n- Rozliczenia z wydawcami, raport rozliczeniowy wydawcy, kemping macierzysty gościa do rozliczeń.\n- Treść i warunki umowy akceptacji poza tym, gdzie działają karty (stawki, obowiązki).\n\n#### Party Types\n\n| Typ strony | Reprezentuje | Własne dane | Uwagi |\n|---|---|---|---|\n| Company | sieć, wydawcy kart/partnerzy, organizacje nadrzędne wydawców, właściciel afiliowany będący firmą | nazwa, kraj | podtypy formy prawnej niepotrzebne |\n| OrganizationUnit | kemping, podgrupa wydawcy, ekipa remontowa | nazwa (także lokalna, CAMP-229) | |\n| Person | pracownik obsługi, dozorca, członek ekipy, operator konsoli, właściciel afiliowany będący osobą, meldowany gość sieci | imię, nazwisko | |\n\n**PartyId:** losowy UUID nadawany w aplikacji, jedna przestrzeń identyfikatorów dla wszystkich typów. Ani nazwa grupy („AFFILIATE …”, „NETWORK CARD”), ani miejsce w drzewie nie identyfikują strony.\n\n#### Registered Identifiers\n\n| Identyfikator | Wartość / walidacja | Ważność | Komu można przypisać |\n|---|---|---|---|\n| KARTA_RFID | UID karty, unikalny w całym systemie | od–do (wygaśnięcie, blokada) | posiadaczowi: Person (obsługa, meldowany gość) albo samemu wydawcy, gdy posiadacz jest nieznany sieci; zawsze z polem „wydawca” (PartyId z rolą WYDAWCA_KART) |\n| KOD_PARTNERA_WYMIANY | kod partnera w plikach wymiany | bez terminu | Company z rolą WYDAWCA_KART |\n\n**Polityka przypisania:** złożona z małych polityk, egzekwowana w `add(identifier, policy)`:\n(a) jeden UID = jeden wydawca; zmieniać albo wyłączać może tylko ten wydawca albo jego jednostka (JEDNOSTKA_WYDAWCY) lub podmiot zależny (PODLEGA w dół);\n(b) partner nigdy nie przejmuje karty, której wydawcą jest Sieć;\n(c) przejęcie karty powitalnej zmienia posiadacza na właściciela kempingu tylko wtedy, gdy kemping ma politykę przejęcia „tak” i nie ma relacji UMOWA_AKCEPTACJI z Siecią.\nPolityki pochodzą ze stałej konfiguracji.\n\n#### Roles\n\n**Strategia:** 3, PartyRoleType. Role przybywają w czasie działania i zależą od rynku (wydawcy międzynarodowi, partnerzy w obu kierunkach), a kemping afiliowany zmienia charakter bez wdrożenia.\n\n| Rola | Forma | Kto może | Kto ją pełni |\n|---|---|---|---|\n| WYDAWCA_KART | globalna, także strona `from` w UMOWA_AKCEPTACJI | Company | partnerzy, Sieć |\n| OPERATOR_MIEJSC_ŁADOWANIA | globalna | Company, Person | Sieć, partner, właściciel afiliowany |\n| MIEJSCE_ŁADOWANIA | strona `to` w UMOWA_AKCEPTACJI i PRZYPISANIE_OBSŁUGI | OrganizationUnit (kemping) | kempingi sieci, partnera, afiliowane |\n| ORGANIZACJA_NADRZĘDNA / PODMIOT_ZALEŻNY | w relacji PODLEGA | Company / Company | grupa wydawców / wydawca |\n| WŁAŚCICIEL / KEMPING_WŁASNY | w relacji WŁASNOŚĆ_KEMPINGU | Person, Company / OrganizationUnit | właściciel afiliowany, Sieć |\n| OBSŁUGA | w relacji PRZYPISANIE_OBSŁUGI (from) | Person albo OrganizationUnit (ekipa) | dozorca, sezonowy, ekipa |\n| ODPOWIEDZIALNY | w relacji ODPOWIADA_ZA | Person | operator sieci, administrator rynku |\n\n#### Party Core vs Orbiting Data\n\n**Rdzeń atomowy:** PartyId, identyfikatory, role, version.\n\n| Dane | Decyzja | Uzasadnienie |\n|---|---|---|\n| Karty (KARTA_RFID) | osobna jednostka spójności kluczowana PartyId posiadacza | tysiące kart u wydawcy, zmiany nocne z importu; reguła unikalności UID i wydawcy dotyczy karty, nie całej strony |\n| Polityka przejmowania kart powitalnych kempingu | obok rdzenia, przy roli MIEJSCE_ŁADOWANIA | zmienia się niezależnie, ustawia ją operator |\n| Uprawnienia do konsoli | poza Party | uwierzytelnianie |\n\n#### Relationships\n\n**Granica spójności:** PartyRelationship jako autonomiczna jednostka. Reguły dotyczą obu stron, relacji jest dużo, a reorganizacja nie może blokować stron.\n\n| Relacja | From | To | Ważność | Reguły (ilość / jakość / czas) | Naruszenia |\n|---|---|---|---|---|---|\n| UMOWA_AKCEPTACJI | WYDAWCA_KART (partner albo Sieć) | MIEJSCE_ŁADOWANIA (kemping, wymieniony wprost) | od–do (domyślnie otwarta) | brak / from ma rolę WYDAWCA_KART, to jest kempingiem; kemping „tylko własne karty” nie ma umowy z Siecią / brak | zapobiegane |\n| PODLEGA | PODMIOT_ZALEŻNY (wydawca) | ORGANIZACJA_NADRZĘDNA (Company) | od–do | jedna organizacja nadrzędna naraz / obie strony to organizacje / brak; bez cykli | zapobiegane |\n| JEDNOSTKA_WYDAWCY | podgrupa (OrganizationUnit) | WYDAWCA_KART | otwarta | jedna nadrzędna / brak / brak | zapobiegane |\n| WŁASNOŚĆ_KEMPINGU | WŁAŚCICIEL (Person/Company) | kemping | od–do | jeden właściciel naraz / brak / brak | zapobiegane |\n| PRZYPISANIE_OBSŁUGI | OBSŁUGA (Person albo ekipa) | MIEJSCE_ŁADOWANIA (kemping) | od–do (ekipa: miesiąc, CRD-201) | brak / zakres miejsca jako atrybut (słupki 3–7) / brak | zapobiegane |\n| CZŁONEK_EKIPY | Person | EKIPA (OrganizationUnit) | od–do | brak | zapobiegane |\n| ODPOWIADA_ZA | ODPOWIEDZIALNY (Person) | kemping albo rynek | od–do | brak | zapobiegane |\n\nSkutki krzyżowe:\n- Zakończenie PODLEGA odbiera uprawnienia, które szły tą ścieżką. Umowy własne zostają.\n- Zakończenie WŁASNOŚĆ_KEMPINGU nie unieważnia kart już przejętych.\n- Zakończenie CZŁONEK_EKIPY odbiera osobie uprawnienia ekipy.\n- **Przeniesienie kempingu do innego regionu nie dotyka żadnej relacji.**\n\n#### Permissions in the Context of Other Parties\n\n| Uprawnienie | Kto → wobec kogo | Źródło | Ważność | Używa go decyzja (+ inne dane) |\n|---|---|---|---|---|\n| KARTY_DZIAŁAJĄ_TU | wydawca → kemping | **suma**: UMOWA_AKCEPTACJI wydawcy wprost ∪ UMOWA_AKCEPTACJI każdej organizacji wyżej po ścieżce PODLEGA | z relacji (przy ścieżce: część wspólna ważności PODLEGA i umowy) | „czy dać prąd” przy słupku (+ ważność karty, gniazdo, płatność QR); budowa lokalnej listy kart (+ pojemność) |\n| ŁADOWANIE_OBSŁUGI | osoba → kemping (wprost albo przez CZŁONEK_EKIPY → przypisanie ekipy) | PRZYPISANIE_OBSŁUGI z zakresem miejsca | z relacji | „czy dać prąd od razu” (+ pominięcie budżetu mocy: reguła procesu) |\n| WYMIANA_KART | Sieć ↔ partner | eksport: UMOWA_AKCEPTACJI(Sieć → miejsce partnera); import: UMOWA_AKCEPTACJI(partner → miejsce sieci); wyjątki jako nadanie wprost | z relacji / własna dla wyjątku | nocna wymiana plików (+ statusy synchronizacji) |\n| ZMIANA_KARTY | wydawca → identyfikator karty | wydawca karty albo jego jednostki i podmioty zależne | z relacji | import kart od partnera |\n| PRZEJĘCIE_KARTY_POWITALNEJ | kemping afiliowany → karta z puli | polityka przejęcia przy roli + brak UMOWA_AKCEPTACJI z Siecią | własna (ustawienie) | odrzucenie karty na słupku (+ kraj puli: poza Party) |\n\nNadanie wprost (bez relacji) tylko dla wyjątków w wymianie z partnerem. Każde takie nadanie sygnalizuje brakującą relację.\n**Karta uprawnień** strony: wszystkie pozycje ze źródłem (umowa własna albo umowa organizacji X po ścieżce PODLEGA, przypisanie osoby albo ekipy) i z ważnością. Kemping objęty i umową własną, i nadrzędną ma dwie pozycje źródła. Zdjęcie jednej umowy nie odbiera go, dopóki trwa druga.\n\n#### Capabilities\nPoza zakresem. Prawo ładowania obsługi jest uprawnieniem z przypisania, nie kompetencją.\n\n#### Questions the Model Answers\n\n| Pytanie | Odpowiada |\n|---|---|\n| Czy wydawca tej karty ma umowę obejmującą kemping tego słupka? (Pyt. 1) | KARTY_DZIAŁAJĄ_TU (wydawca z identyfikatora karty, kemping słupka) |\n| Karty których wydawców przyjmuje ten kemping? (Pyt. 2) | odwrotne przejście UMOWA_AKCEPTACJI + wszyscy podmioty zależne (PODLEGA w dół) od stron tych umów |\n| Na których kempingach działają karty wydawcy i czy to umowa własna, czy przez organizację nadrzędną? (Pyt. 3) | karta uprawnień wydawcy: suma pozycji, przy każdej źródło (jedno albo oba) |\n| Czy to karta osoby z obsługi z prawem na tym kempingu? (Pyt. 4) | identyfikator → osoba → ŁADOWANIE_OBSŁUGI (wprost albo przez ekipę) |\n| Czy kemping jest otwarty na karty sieci? (Pyt. 6) | istnienie UMOWA_AKCEPTACJI(Sieć → kemping) |\n| Czy wolno wymieniać karty z partnerem? (Pyt. 8) | WYMIANA_KART |\n| Karta sieci czy partnera, i tego, który ją przysyła? (Pyt. 9) | wydawca przy identyfikatorze + ZMIANA_KARTY |\n| Kto z obsługi zyska/straci prawo ładowania po przeniesieniu kempingu? | nikt: przeniesienie w regionach nie zmienia relacji |\n| Jak zorganizowana jest moja część sieci? (Pyt. 10) | częściowo: ODPOWIADA_ZA + WŁASNOŚĆ_KEMPINGU + PODLEGA; regiony i rynki niezmapowane |\n\n#### Implementation Notes\n- Partner pełniący rolę wydawcy i operatora miejsc to jedna Company z jednym PartyId i dwiema rolami. Ruch w obie strony to dwie asymetryczne relacje UMOWA_AKCEPTACJI. Gdy jednej brakuje, karta uprawnień to pokazuje.\n- Dziedziczenie umów: suma po ścieżce PODLEGA, bez zastępowania (odpowiedź użytkownika). Zmiana względem dzisiejszego kodu, w którym własna niepusta lista umów zasłania listy wyżej (GroupApiService.java:277, GroupServiceHelper.java:52). Skutek: wydawca dopisujący własny kemping nie traci kempingów organizacji nadrzędnej. Flaga „odziedziczona” przestaje być jedną wartością na wydawcę; staje się źródłem przy każdej pozycji.\n- Umowa wskazuje kempingi wprost. „Umowa na region” rozwija się przy zawieraniu na listę kempingów i dalej nie śledzi składu regionu (odpowiedź użytkownika).\n- Przypisanie obsługi może mieć osoba albo ekipa. Członkowie ekipy dostają uprawnienie przez CZŁONEK_EKIPY, a zmiana zestawu kempingów ekipy co miesiąc to zmiana jednego przypisania (odpowiedź użytkownika).\n- PODLEGA to realna relacja między firmami, z ważnością (potwierdzony wariant roboczy).\n- Zdarzenia: zawarcie i zakończenie relacji, zmiana posiadacza karty. Konsumenci (lokalne listy kart, wymiana z partnerami) reagują na nie zamiast na „przeniesienie grupy”.\n\nImplementacja referencyjna: .claude/skills/archetype-implementer/references/party-impl.md; moduł https://github.com/Archetypy-Oprogramowania/archetypes/tree/main/party\n\n#### Decyzje\n\n- Wydawca to strona (Company) z rolą, nie gałąź drzewa — (W) „Mają z siecią umowy akceptacji: ich karty działają na wskazanych kempingach sieci” (business-context.md §2 Wydawcy kart)\n- Partner = jedna strona w dwóch rolach (wydawca i operator miejsc) — (W) „Działa to też w drugą stronę: goście sieci ładują u partnera” (business-context.md §2)\n- Umowa akceptacji to relacja wydawca → kemping — (W) „umowa akceptacji | zgoda, że karty wydawcy działają na danych kempingach” (business-context.md §5)\n- Umowy własne i nadrzędne się sumują — (W) odpowiedź użytkownika na pytanie 1: „Zadar, Rovinj i Pula — umowy się sumują”\n- Umowa obejmuje kempingi wprost; przeniesienie w regionach nie zmienia, kto ładuje — (W) odpowiedź użytkownika na pytanie 2; cel B1 „bez zmiany tego, kto na nim ładuje”\n- Przypisanie obsługi ma osoba albo ekipa — (W) odpowiedź użytkownika na pytanie 3; „jednej karty, która działa tam, gdzie są w danym miesiącu przypisane” (business-context.md §2 Pracownicy)\n- PODLEGA to realna relacja między firmami — (W) odpowiedź użytkownika na pytanie 4 (zostaje wariant roboczy)\n- Karta należy do wydawcy; zmiany od innego wydawcy są odrzucane — (W) „Jeśli innego, zmiana jest odrzucona i karta zostaje u dotychczasowego wydawcy.” (problem.md, Pytanie 9)\n- Karta sieci nigdy nie przechodzi do partnera — (W) „Jeśli tak, partner nigdy jej nie przejmie” (problem.md, Pytanie 9)\n- Dozorca ładuje tylko na swoim kempingu, nie w całym regionie — (W) „tylko na jego kempingu, a nie u sąsiada z tego samego regionu” (business-context.md §2 Pracownicy)\n- Tryb dostępu kempingu niezależnego = istnienie umowy akceptacji z Siecią — (Z) wariant roboczy: tak; wejście: „Kim jest właściciel afiliowany i co zmienia tryb dostępu: (nieznane)” (business-context.md §2). Tryb nie zmienia, kto ładuje poza kartami sieci, więc wpływ jest ograniczony.\n- Wymiana kart z partnerem wynika z umów w obu kierunkach, wyjątki nadawane wprost — (Z) wariant roboczy; dziś decyduje filtr „najbliższy w górę drzewa wydawców” (problem.md, Pytanie 8)\n- Ważność uprawnienia po ścieżce PODLEGA = część wspólna ważności PODLEGA i umowy organizacji nadrzędnej — (Z) wariant roboczy, wynika z reguły „uprawnienie trwa tyle, ile relacja”\n\n#### Założenia\n\n- PartyId = losowy UUID; nazwy grup („AFFILIATE …”, „NETWORK CARD”) przestają być identyfikatorem.\n- Gość z kartą wydawcy nie jest stroną w sieci; sieć zna tylko identyfikator karty i jej wydawcę.\n- Karty to osobna jednostka spójności kluczowana PartyId posiadacza.\n- Zawężenie prawa obsługi do części kempingu (słupki 3–7) jest atrybutem przypisania; słupki zostają poza Party.\n- Zakończenie własności kempingu nie unieważnia kart już przejętych.\n- Właściciel afiliowany może być osobą albo firmą.\n- ODPOWIADA_ZA (zakres operatora konsoli) tylko jako źródło „w moim zakresie”, bez modelu uprawnień konsoli.\n- Tryb dostępu i wymiana z partnerem: warianty robocze jak w DECYZJACH (Z).\n\n#### Identyfikatory i rzuty\n\n- kemping, na którym stoi słupek (PartyId kempingu przy słupku) — „czy wydawca tej karty ma z siecią umowę obejmującą kemping, na którym stoi słupek?” (problem.md, Pytanie 1)\n- UID karty z PartyId wydawcy — „czy to nie karta sieci i czy należy do tego partnera” (problem.md, Pytanie 9)\n- rynek (kraj) kempingu, potrzebny do puli kart powitalnych — „czy to karta powitalna z puli kraju tego kempingu” (problem.md, Pytanie 5)\n- partner wymiany (kod partnera w plikach) — „Pliki kart i rekordów idą w obie strony” (business-context.md §4 pkt 9)\n\n### Co i jak\n\n| CO | JAK STARE | JAK W ARCHETYPIE |\n|---|---|---|\n| Gość przykłada kartę do gniazda na słupku: czy wydawca jego karty ma z siecią umowę obejmującą kemping, na którym stoi słupek? Jeśli nie, prąd nie zostaje włączony. (Q1, ValidationService.isCardAcceptedAt) | `ValidationService.java:381`: przelotka do `groupService.isCardAcceptedAt(pedestal.getId(), card)`. Karta bez gościa → false; dalej `extractAllAcceptingSiteGroupIds(guest.group)` (najbliższa w linii rodziców niepusta lista umów, wyższe zasłonięte, całe poddrzewa) i `pedestalDao.isInGroupList`. Zwraca `boolean`: słupek stoi w grupie objętej umową wydawcy. | Pytamy, czy wydawca karty albo któraś organizacja nad nim ma ważną umowę z tym konkretnym kempingiem. Wystarczy jedna z nich; miejsce kempingu w regionach nie gra roli. \u003cdetails>\u003csummary>szczegóły\u003c/summary>Identyfikator KARTA_RFID → wydawca (PartyId); słupek → PartyId kempingu (rzut). Uprawnienie KARTY_DZIAŁAJĄ_TU = suma UMOWA_AKCEPTACJI wydawcy i umów organizacji po ścieżce PODLEGA. Ważność z relacji. Odpowiedź: tak/nie plus źródło (która umowa). Inaczej niż dziś: własna umowa wydawcy nie zasłania umów nadrzędnych. Pozostałe warunki prądu (ważność karty, gniazdo) zostają w procesie.\u003c/details> |\n| Gość przykłada kartę do gniazda na słupku; odpowiedź pośrednia: na których kempingach działają karty wydawcy. (Q1, GroupServiceHelper.extractAllAcceptingGroupIds) | `GroupServiceHelper.java:52`: `getAcceptanceAgreements` (najbliższa w linii rodziców niepusta lista umów danego typu, wyższe zastępowane), dla każdej umowy `collectSubtreeIds`, lista bez powtórzeń; brak umów → pusta. Zwraca `List\u003cLong>`: kempingi i regiony z całym poddrzewem. | Karta uprawnień wydawcy: kempingi z jego własnych umów plus kempingi z umów organizacji nad nim. Przy każdym kempingu widać źródło i ważność. Nic nie rozwija się po poddrzewach regionów. \u003cdetails>\u003csummary>szczegóły\u003c/summary>Przejście po UMOWA_AKCEPTACJI wydawcy ∪ UMOWA_AKCEPTACJI każdej organizacji w górę po PODLEGA; pozycja = (kemping, źródła, ważność). Umowa „na region” została rozwinięta przy zawarciu na kempingi wprost. Odpowiada też na Pytanie 3 (ekran umów): zamiast jednej flagi `inherited` źródło przy każdej pozycji.\u003c/details> |\n| Słupek dostaje listę kart, które ma wpuszczać sam, bez pytania sieci: karty których wydawców przyjmuje kemping tego słupka? (Q2, LocalCardListService.buildLocalCardList) | `LocalCardListService.java:138`: gdy `lla.isIncludeCards()`, `groupService.findIssuerGroupIdsAcceptedAt(pedestal.getGroup())` (rekurencyjny SQL: dla każdego wydawcy najbliższy właściciel listy umów; umowa obejmuje grupę słupka albo przodka) → `findValidCardsForLocalCardList`. Zwraca `List\u003cLong>`: wydawcy, których umowa (własna lub przejęta) obejmuje kemping słupka. | Te same umowy czytane od strony kempingu: wydawcy, którzy mają z nim ważną umowę, plus wszyscy wydawcy zależni od tych, którzy ją mają. Pojemność i kolejność listy to już nie sprawa Party. \u003cdetails>\u003csummary>szczegóły\u003c/summary>Odwrotne przejście UMOWA_AKCEPTACJI (to = kemping) → strony umów → PODLEGA w dół (suma, bez zasłaniania). Wynik: zbiór PartyId wydawców. Zawarcie albo zakończenie relacji emituje zdarzenie, na które reaguje odświeżenie list. Przeniesienie kempingu w regionach żadnego zdarzenia nie wywołuje.\u003c/details> |\n| Słupek dostaje listę kart, które ma wpuszczać sam: które karty personelu (kempingu i organizacji nad nim) mają na niej być? (Q4, LocalCardListService.buildLocalCardList) | `LocalCardListService.java:138`: gdy `lla.isIncludeHouseCards()`, `houseCardService.getHouseCardsForPedestal(kod)` = aktywne karty grupy słupka i wszystkich przodków (`fetchParentLineIds`); karty personelu pierwsze, nadmiar ucinany. Zwraca `List\u003cHouseCard>`: aktywne karty personelu kempingu słupka i organizacji nad nim. | Na listę trafiają karty osób z ważnym przypisaniem do tego kempingu: przypisanych osobiście albo należących do przypisanej ekipy, z ewentualnym zawężeniem do części kempingu. Karta działa, bo jej posiadacz jest przypisany, a nie dlatego, że wisi w regionie nad kempingiem. \u003cdetails>\u003csummary>szczegóły\u003c/summary>PRZYPISANIE_OBSŁUGI (to = kemping, ważne dziś) → posiadacze: Person wprost albo EKIPA → CZŁONEK_EKIPY → Person; dalej ich identyfikatory KARTA_RFID. Uprawnienie ŁADOWANIE_OBSŁUGI z zakresem miejsca (słupki 3–7). Dozorca przypisany do swojego kempingu nie trafia na listę sąsiada z regionu.\u003c/details> |\n| Słupek dostaje od nowa całą listę kart przyjmowanych bez pytania centrali: jakie karty mają na niej być i które wypadają, gdy brakuje miejsca? (Q12, LocalCardListService.buildLocalCardList) | `LocalCardListService.java:138`: najbliższy atrybut LocalList nad grupą słupka decyduje, czy lista jest i co zawiera. Budowa: karty domowe + ważne karty akceptowanych wydawców; ponad pojemność karty gości wypadają, karty domowe są sortowane i ucinane. Zwraca `LocalCardList`: karty obsługi, potem karty gości. | Archetyp na to nie odpowiada: czy słupek trzyma listę, ile mieści i co wypada pierwsze, to reguły sprzętu i dystrybucji. Party daje tylko dwa wejścia: wydawców przyjmowanych na kempingu i karty osób przypisanych. \u003cdetails>\u003csummary>szczegóły\u003c/summary>Z Party: odwrotne UMOWA_AKCEPTACJI z PODLEGA (wydawcy) i PRZYPISANIE_OBSŁUGI (karty obsługi). Atrybut listy, pojemność i kolejność → POJĘCIA NIEZMAPOWANE (lokalna lista kart).\u003c/details> |\n| Przy wymianie z partnerami sieć wysyła każdemu partnerowi zmiany na liście swoich kart: czy kartę tego gościa wolno przekazać właśnie temu partnerowi? (Q15, IssuerExchangeService.exportCards) | `IssuerExchangeService.java:198`: karty sieci do eksportu (`findCardsForPartnerExport`). Dla każdego partnera i karty `whitelistFilterService.isSynchronizableForExport(grupa gościa karty, partner)`: najbliższy filtr eksportowy w linii rodziców celujący w partnera; brak = tak. Karta pominięta tylko dla tego partnera; „wyeksportowana”, gdy wszyscy dostali listę. Odpowiedź `boolean`: kartę wolno wysłać. | Kartę wysyłamy partnerowi, bo sieć ma umowę, że jej karty działają na kempingach tego partnera. Wyjątek to jawne nadanie z powodem, a nie filtr na gałęzi drzewa. Gdy umowy w tę stronę brak, karta uprawnień to pokazuje. \u003cdetails>\u003csummary>szczegóły\u003c/summary>WYMIANA_KART (eksport) wyprowadzone z UMOWA_AKCEPTACJI(Sieć jako WYDAWCA_KART → kempingi partnera w roli MIEJSCE_ŁADOWANIA); ważność z relacji. Wyjątek dla grupy kart to nadanie albo odebranie wprost, z własną ważnością; sygnalizuje brakującą relację. Partner ma dwie role (wydawca i operator miejsc) i jeden PartyId.\u003c/details> |\n| Partner przysyła kartę, którą już znamy: czy to karta sieci? Jeśli tak, nigdy nie przechodzi do wydawcy — zmiana jest odrzucona. (Q16, IssuerCardImportService.isNetworkCard) | `IssuerCardImportService.java:187`: bez grupy gościa → false; inaczej `findNetworkCardGroupIds()` (poddrzewo grupy o nazwie 'NETWORK CARD') zawiera grupę gościa karty. Zwraca `boolean`: posiadacz leży w części sieci kart sieciowych. | Każda karta ma zapisanego wydawcę; karta sieci to po prostu karta, której wydawcą jest Sieć. Reguła przypisania identyfikatora nie pozwala innemu wydawcy jej zmienić. \u003cdetails>\u003csummary>szczegóły\u003c/summary>KARTA_RFID z polem wydawca = PartyId Sieci. Polityka przypisania (b): partner nie przejmuje karty Sieci; (a): zmiany tylko od wydawcy karty, jego jednostek i podmiotów zależnych. Przeniesienie posiadacza w drzewie nie zmienia odpowiedzi.\u003c/details> |\n\nUwaga: `LocalCardListService.buildLocalCardList` występuje w bolączkach pod trzema pytaniami (Q2, Q4, Q12), więc 5 wskazanych miejsc dało 7 wierszy.\n\n### Trzy ficzery z archetypu\n\n1. Umowy akceptacji z datą obowiązywania. Wydawca i sieć zawierają umowę od wskazanego dnia albo na sezon, a karty same zaczynają i przestają działać, bez ręcznego zdejmowania umowy przez operatora.\n   skąd: „Mają z siecią umowy akceptacji: ich karty działają na wskazanych kempingach sieci” (business-context.md §2, Wydawcy kart)\n   w archetypie: ważność (od–do) relacji UMOWA_AKCEPTACJI; uprawnienie KARTY_DZIAŁAJĄ_TU dziedziczy ją wprost, także po ścieżce PODLEGA.\n2. „Kto mógł ładować tu w tamtym dniu”. Przy reklamacji z poprzedniego sezonu wsparcie widzi, czy karta gościa miała wtedy prawo ładować na tym kempingu i na podstawie której umowy albo którego przypisania.\n   skąd: „Gość z reklamacją z poprzedniego sezonu: do sporu trzeba otworzyć dawne rekordy zużycia” (business-context.md §2, Gość kempingu)\n   w archetypie: historia relacji z ważnością; kartę uprawnień liczy się na wskazaną datę zamiast na dziś.\n3. Odejście pracownika zamyka wszystkie jego prawa ładowania. Koniec przypisania albo członkostwa w ekipie od razu wyłącza kartę na wszystkich kempingach. Nie trzeba szukać jego kart po kempingach i regionach.\n   skąd: „Dozorca mieszka na kempingu. Jego karta ma działać zawsze, przy każdym słupku, ponad budżet mocy, ale tylko na jego kempingu” (business-context.md §2, Pracownicy)\n   w archetypie: ŁADOWANIE_OBSŁUGI wynika z PRZYPISANIE_OBSŁUGI / CZŁONEK_EKIPY, więc koniec relacji jest końcem uprawnienia; zdarzenie zakończenia odświeża listy kart na słupkach.\n\n### Pojęcia niezmapowane\n\n| pojęcie | które wystąpienie je odrzuciło |\n|---|---|\n| region i rynek (grupowanie do raportów i rozliczeń) | Party |\n| drzewo grup i reguła „najbliższe ustawienie wyżej” | Party |\n| słupek, gniazdo, stanowisko, sekcja, budżet mocy | Party |\n| lokalna lista kart, jej pojemność i kolejność | Party |\n| pula kart powitalnych kraju | Party |\n| ważność i blokada karty, płatność QR | Party |\n| rozliczenia i raport rozliczeniowy wydawcy | Party |\n| treść i warunki umowy akceptacji poza tym, gdzie działają karty | Party |\n\n### Sprzeciwy wobec werdyktu\n\nBrak.\n\n### Otwarte\n\nPytania mappera (FAZA 5b) i odpowiedzi uczestnika (uczestnik nieobecny; odpowiedzi udzielone za niego na podstawie `analiza/business-context.md`):\n\n1. Adria Cards ma własną umowę na Zadar, organizacja nadrzędna Adria Group — na Rovinj i Pulę. Gdzie działają karty Adria Cards? → **Zadar, Rovinj i Pula — umowy się sumują** (wariant roboczy był: tylko Zadar, jak dziś). Podstawa: wydawca dopisujący kemping chce, żeby goście od razu tam ładowali [ISS-203], a nie tracili innych kempingów. **Zmienia zachowanie względem legacy.**\n2. Umowa „na Dalmację” (Zadar, Split), Zadar przeniesiony do Istrii — czy karty dalej działają w Zadarze? → **tak, umowa wymienia kempingi wprost** (= wariant roboczy). Podstawa: cel B1 „bez zmiany tego, kto na nim ładuje”. **Zmienia zachowanie względem legacy.**\n3. Ekipa remontowa w różnych miesiącach na różnych kempingach — komu prawo ładowania? → **obie formy: osoba albo ekipa** (= wariant roboczy). Podstawa: CRD-201, dozorca CAMP-211.\n4. „ADAC Süd” pod „ADAC” — realna relacja czy porządek w konsoli? → **Zostaw wariant roboczy** (realna relacja PODLEGA); business-context nie rozstrzyga.\n\nZałożenia (Z) zmieniające zachowanie, bez potwierdzenia: tryb dostępu kempingu niezależnego = istnienie umowy akceptacji z Siecią (business-context: „Kim jest właściciel afiliowany i co zmienia tryb dostępu: (nieznane)”); wymiana kart z partnerem wynika z umów w obu kierunkach, wyjątki nadawane wprost (dziś: filtr najbliższy w górę drzewa wydawców); ważność uprawnienia po ścieżce PODLEGA = część wspólna ważności relacji i umowy.\n\n### Bolączki z adresami w kodzie (wejście pogłębienia)\n\n### BOLĄCZKI Z ADRESAMI W KODZIE\n\n#### B1. Przeniesienie kempingu w drzewie\n- co boli: Przeniesienie, scalenie albo zamknięcie kempingu czy regionu w konsoli (technicznie jedno pole rodzica) po cichu zmienia, czyje karty dostają prąd i kto widzi rekordy: gość dostaje odmowę bez powodu, przygarnięta karta przestaje działać, admin rynku traci połowę kempingów i stoi fakturowanie; poprawki są ręczne, bez wyjaśnienia przyczyny.\n- kiedy: przeniesienie kempingu do innego regionu (przeciągnięcie w konsoli), także scalenie dwóch kempingów albo dezaktywacja starego regionu\n- cel obserwowalny: kemping raportowany w regionie, w którym biznes chce go widzieć, bez zmiany tego, kto na nim ładuje i kto widzi jego rekordy\n- zgłoszenia: OPS-202 (#347): po jesiennej reorganizacji admin.it nie widzi przeniesionych kempingów, fakturowanie stoi (otwarte, pilne); CAMP-203 (#3): po przeniesieniu Zadaru pod Dalmację back office nie widzi jego rekordów; „będziemy dalej reorganizować”; CAMP-207 (#76): dezaktywacja starego regionu ukryła rekordy potrzebne do otwartej reklamacji; RPT-212 (#318): dwie osoby z tą samą rolą rynku widzą inne sumy, zależnie od miejsca w drzewie (otwarte); CAMP-212 (#334): karta gościa odrzucana bez powodu kilka razy w tygodniu po przesunięciach; wsparcie nie umie wyjaśnić (otwarte); CAMP-233 (#193): przygarnięta karta powitalna przestaje działać po przeniesieniu kempingu; pomaga ponowne przygarnięcie; OPS-205 (#336): po przeniesieniu raz tak, raz nie wiadomo, kto z obsługi może ładować; operacje chcą reguły albo ostrzeżenia; CAMP-211 (#337): dozorca z uprawnieniem na regionie ładuje też u sąsiada z tego samego regionu; CAMP-219 (#206): po scaleniu dwóch kempingów goście starego B dalej mają odmowę na słupkach A (otwarte); CRD-202 (#198): filtr kart znika po zapisie grupy, częściej na niedawno przeniesionych (wontfix); CAMP-232 (#231): domyślna taryfa regionu raz trafia do nowego kempingu, raz nie, zależnie od głębokości; wiki Konsultacje-2026-03-10 ¶3–4: Zadar: „technicznie to jest jedno pole w bazie […] a potem dzwonią”; widok przywrócony ręcznie; wiki Konsultacje-2026-03-10 ¶13, ¶14, ¶18, ¶22–24: dozorca u sąsiada, przygarnięta karta, scalenie, odmowy „częściej w tygodniach, jak biznes dużo przesuwa”, admin.it; wiki Konsultacje-2026-03-10 ¶26: PO: „żebyśmy mogli poprzesuwać kempingi […] i żeby nic się przy tym nie sypało”\n\n#### B3. Zasięg kart w kilku miejscach\n- co boli: Ustalenie, gdzie działa karta, wymaga dotknięcia kilku miejsc: umowa z wydawcą to listy węzłów po obu stronach i filtry na kilku poziomach, karta obsługi działa na całe poddrzewo. Przy nowym kempingu wydawcy zawsze któryś krok się gubi i karty działają w jedną stronę; nie da się dać karty na pięć słupków ani na zmieniający się co miesiąc zestaw kempingów; odmowa nie mówi, który filtr zadziałał.\n- kiedy: wydawca podpisuje nowy kemping, dwa kempingi chcą wspólnie ładować, obsłudze trzeba dać kartę na część kempingu albo na kilka kempingów\n- zgłoszenia: ISS-205 (#367): dodanie kempingu wydawcy to kilka ręcznych kroków, jeden się gubi i karty działają w jedną stronę (w toku); ISS-203 (#79): karty partnera mają działać od razu na kempingach z umową (wontfix); CAMP-215 (#399): Zadar i sąsiad: goście mają ładować u siebie nawzajem; nikt nie wie, jak to połączyć; CAMP-218 (#72): trzy kempingi Garda: ładowanie wspólne, rozliczenia i raporty osobno; CAMP-210 (#110): pracownik sezonowy tylko na słupkach 3–7, a da się tylko cały kemping; CRD-201 (#345): karta dla ekipy na zestaw kempingów zmieniany co miesiąc (otwarte); ISS-207 (#364): odmowa przez filtr nie mówi, którego poziomu to filtr (otwarte); wiki Konsultacje-2026-03-10 ¶13, ¶15, ¶17–19: sezonowi, ekipy remontowe, filtry, sąsiad na festiwal, Garda, „rytuał na pięć kroków i zawsze któryś się zgubi”; Glossary (acceptance agreement): umowa: karty wydawcy działają na danych kempingach\n\nBolączki B1 i B3 dotykają tej samej paczki pytań. Pod nimi pytania, dla których zrobiliśmy skrzyżowanie; przy każdym wołającym: miejsce w kodzie (`plik:linia`), CO (co jest robione, w języku problemu), JAK (jak kod robi to dziś) i odpowiedź jednym zdaniem (typ i co znaczy).\n\n##### Paczka pytań: Czy ta karta dostanie prąd na tym kempingu\n\n- zgłoszeń: 6 · dlaczego boli: gość i obsługa dostają odmowę (albo prąd u sąsiada) po zmianie, która miała dotyczyć tylko raportowania; wsparcie nie umie powiedzieć czemu\n- co się zmienia: w gnieździe płynie prąd albo nie · kto zauważa: gość przy słupku, personel po odmowie\n\n###### Q1: Czy wydawca karty gościa ma z siecią umowę, że jego karty działają na kempingu, na którym stoi ten słupek?\n\n- **GroupApiService.toAgreementDTO** (`campsite-core/src/main/java/io/pillopl/group/GroupApiService.java:277`) · top-in-island · ścieżka: GroupApiService.toAgreementDTO → GroupServiceHelper.getAcceptanceAgreements · pyta: partly\n  - CO: Operator sieci w konsoli ogląda albo zmienia umowy wydawcy kart: na których kempingach działają karty tego wydawcy i czy to jego własna umowa, czy przejęta od organizacji nadrzędnej?\n  - JAK: `toAgreementDTO(issuer)` liczy cały zasięg wydawcy, a nie odpowiedź dla jednego słupka: `GroupServiceHelper.getAcceptanceAgreements(issuer, SITE)` (najbliższy na linii rodziców wydawca z niepustą listą umów SITE; listy wyżej są zastępowane, nie łączone), flaga `inherited = !own && !agreements.isEmpty()` (own = wydawca sam ma choć jedną grupę SITE w `getGroups()`), oraz `extractAllAcceptingSiteGroupIds(issuer)` = id całych poddrzew kempingów z umów. Wołane po `findAcceptanceAgreements` (podgląd), `addAcceptanceAgreement` i `removeAcceptanceAgreement` (wynik po zmianie). Pętla po `issuer.getGroups()` nie sprawdza null (helper sprawdza).\n  - odpowiedź: `AcceptanceAgreementDTO` — zasięg kart jednego wydawcy: umowy obowiązujące wydawcę (kempingi/regiony wpisane w umowę) i wszystkie kempingi pod nimi\n\n- **GroupService.extractAllAcceptingSiteGroupIds** (`campsite-core/src/main/java/io/pillopl/group/GroupService.java:291`) · top-in-island · ścieżka: GroupService.extractAllAcceptingSiteGroupIds → GroupServiceHelper.extractAllAcceptingSiteGroupIds · pyta: no\n  - CO: Nikt dziś nie pyta tą drogą (poza testami brak wywołań). Odpowiadałaby na pytanie: na których kempingach działają karty tego wydawcy?\n  - JAK: `GroupService.extractAllAcceptingSiteGroupIds(issuerGroup)` to transakcyjna obwoluta `GroupServiceHelper.extractAllAcceptingSiteGroupIds`; grep po kodzie produkcyjnym nie znajduje wołających (jest bliźniacza `findAcceptingSiteGroupIds` liczona rekurencyjnym SQL). Produkcja woła helper statycznie, z pominięciem tej metody.\n  - odpowiedź: `List\u003cLong>` — lista: kempingi (i regiony) pod umowami obowiązującymi wydawcę\n\n- **GroupService.isAcceptedAt** (`campsite-core/src/main/java/io/pillopl/group/GroupService.java:320`) · top-in-island · ścieżka: GroupService.isAcceptedAt → Grou   $('#status').innerHTML = `<span>← ${esc(label(W.kroki[i - 1]))}</span><span class="now"><span class="dot"></span>${esc(label(cur))}${waits}</span><span>${esc(label(W.kroki[i + 1]))} →</span>${D.demo ? `<span class="demo">${esc(D.demo)}</span>` : ''}`;
}

function places() {
  // rows of the first table in miejsca.md
  const rows = (D.miejsca || '').split('\n').filter(l => l.trim().startsWith('|') && !/^\|\s*-/.test(l.trim())).map(l => l.trim().slice(1, -1).split('|').map(c => c.trim()));
  if (rows.length < 2) { $('#miejsca').innerHTML = `<h2>📍 Wybrane miejsca</h2><p class="muted">Jeszcze nie wybrane (krok „miejsca”).</p>`; return; }
  const head = rows[0].map(h => h.toLowerCase());
  const col = re => head.findIndex(h => re.test(h));
  const [iId, iCo, iWo, iSt, iWe] = [col(/^#$/), col(/^co/), col(/wołający/), col(/status/), col(/wejście/)];
  const inline = s => md(s).replace(/^<p>|<\/p>\n?$/g, '');
  $('#miejsca').innerHTML = `<h2>📍 Wybrane miejsca</h2><div class="places">${rows.slice(1).map(r => {
    const st = r[iSt] || '';
    return `<div class="place"><span class="id">${esc(r[iId] || '')} ${st ? `<span class="badge ${st === 'nieudane' ? 'bad' : st === 'wpięte' ? 'ok' : ''}">${esc(st)}</span>` : ''}</span>
      <span class="co">${inline(r[iCo] || '')}</span><span class="wo">${inline(r[iWo] || '')}</span>${iWe >= 0 ? `<span class="k">wejście: ${esc(r[iWe])}</span>` : ''}</div>`;
  }).join('')}</div>`;
}

function lanes() {
  const cols = [];
  for (const p of W.plaszczyzny) {
    if (collapsed.has(p.id)) cols.push({ collapsed: p });
    else for (const k of W.kroki.filter(k => k.plaszczyzna === p.id)) cols.push({ step: k });
  }
  const g = $('#grid');
  g.style.gridTemplateColumns = `92px ${cols.map(c => c.collapsed ? 'minmax(96px, .9fr)' : 'minmax(0, 1fr)').join(' ')}`;
  let h = '';
  [['', 1], ['workflow', 2], ['specyfikacja', 3], ['repo', 4]].forEach(([l, r]) => h += `<div class="label" style="grid-row:${r}">${l}</div>`);
  let x = 2;
  for (const p of W.plaszczyzny) {
    const n = collapsed.has(p.id) ? 1 : W.kroki.filter(k => k.plaszczyzna === p.id).length;
    if (!collapsed.has(p.id)) h += `<button class="plane pl-${p.id}" style="grid-row:1;grid-column:${x} / span ${n}" data-plane="${p.id}" title="${esc(p.podpis)} — kliknij, żeby zwinąć">${esc(p.nazwa)}</button><div class="planebody pl-${p.id}" style="grid-column:${x} / span ${n}"></div>`;
    x += n;
  }
  cols.forEach((c, i) => {
    const col = i + 2;
    if (c.collapsed) {
      const ks = W.kroki.filter(k => k.plaszczyzna === c.collapsed.id), done = ks.filter(k => status(k) === 'done').length;
      h += `<button class="collapsedcol pl-${c.collapsed.id}" style="grid-column:${col}" data-plane="${c.collapsed.id}" title="${esc(c.collapsed.podpis)}">${esc(c.collapsed.nazwa)}<small>${done === ks.length ? '✓ zrobione' : done ? `${done}/${ks.length} ✓` : `${ks.length} ${ks.length === 1 ? 'krok' : 'kroków'}`}</small><small>▸</small></button>`;
      return;
    }
    const k = c.step, st = status(k), cm = commitsOf(k.id), dz = dziennikOf(k.id), ts = testyOf(k.id), lastT = ts[ts.length - 1];
    const auto = k.bramka.testy || k.bramka.zrzuty;
    const icons = `${auto ? `<span class="light ${lastT ? (passed(lastT) ? 'ok' : 'bad') : 'off'}" title="bramka: ${esc([k.bramka.testy, k.bramka.zrzuty].filter(Boolean).join(' · '))}">🚦</span>` : ''}${k.bramka.czlowiek ? `<span class="${dz.length ? '' : 'off'}" title="człowiek: ${esc(k.bramka.czlowiek)}${dz.length ? ` — ${esc(dz[dz.length - 1].decyzja)}${dz[dz.length - 1].kto ? ` (${esc(dz[dz.length - 1].kto)})` : ''}` : ''}">👤</span>` : ''}`;
    h += `<div class="track" style="grid-column:${col}"></div>
      <button class="step ${st}${k.opcja ? ' opt' : ''}" style="grid-column:${col}" data-step="${k.id}" aria-pressed="${selected === k.id}"${st === 'todo' ? ' aria-disabled="true" tabindex="-1"' : ''}><span class="nr">${esc(k.nr || '·')}</span><span>${esc(k.slowo)}</span><span class="ic">${icons}</span><span class="tip" role="tooltip"><b>${esc(k.nazwa)}</b>${k.opcja ? ' · <i>wariant zależny od aplikacji</i>' : ''}<br>${esc(k.po_co)}${st === 'todo' ? '<br><i>jeszcze nie wykonany</i>' : ''}</span></button>
      <div class="cell" style="grid-row:3;grid-column:${col}" title="${esc(k.specyfikacja)}"><span class="sq ${st !== 'todo' ? 'on' : ''}">■</span> ${esc(k.spec_krotko)}</div>`;
    const leg = cm.flatMap(x => x.legacy).length, dod = cm.flatMap(x => x.dodane).length;
    h += `<div class="cell" style="grid-row:4;grid-column:${col}">${k.id === 'mapper' ? '<span class="muted">—</span>' : cm.length
      ? `<button class="commit" data-step="${k.id}">● ${esc(cm[cm.length - 1].hash)}</button>${ghLink(cm[cm.length - 1])}<br>${leg ? `<span class="cl">◆${leg}</span> ` : ''}${dod ? `<span class="cn">+${dod}</span>` : ''}` : '<span class="muted">○</span>'}</div>`;
  });
  g.innerHTML = h;
}

const list = (t, a) => a?.length ? `<div><div class="k">${t}</div><ul>${a.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>` : '';
const files = (sym, cls, a) => a.map(f => `<div><span class="${cls}">${sym}</span> ${esc(f)}</div>`).join('');

const odstepstwa = (() => {
  const m = (D.body || '').match(/\n## Odstępstwa[^\n]*\n([\s\S]*?)(?=\n## |$)/);
  if (!m) return [];
  return m[1].split('\n').filter(l => l.trim().startsWith('|') && !/^\|\s*-/.test(l.trim())).slice(1).map(l => l.trim().slice(1, -1).split('|').map(c => c.trim().replace(/`/g, '')));
})();
const reasonFor = (krok, file) => odstepstwa.filter(r => r[0] === krok && r[1].split(/,\s*/).some(p => p && (file.endsWith(p) || file.split('/').pop() === p.split('/').pop()))).map(r => `${r[3]}: ${r[2]}`);
function stepCard() {
  const k = stepById(selected);
  const cm = commitsOf(k.id), dz = dziennikOf(k.id), ts = testyOf(k.id);
  const ob = D.stan?.obszar;
  const sub = t => ob ? String(t).replace(/<obszar>/g, ob) : String(t);
  // what this step changed: its commits, plus the working tree while it is the current step
  const pend = k.id === current && D.pending ? D.pending : { legacy: [], dodane: [], nasze: [] };
  const zm = [...new Set([...cm.flatMap(c => c.legacy), ...pend.legacy])];
  const nasze = [...new Set([...cm.flatMap(c => c.nasze || []), ...(pend.nasze || [])])];
  const dod = [...new Set([...cm.flatMap(c => c.dodane), ...pend.dodane])];
  const top = (arr, sym, cls) => {
    const row = f => { const dir = f.split("/").slice(0, -1).join("/"); const why = cls === "cl" ? reasonFor(k.id, f) : []; return `<div class="frow"><span class="${cls}">${sym}</span><span><b>${esc(f.split("/").pop())}</b>${dir ? ` <span class="fpath">${esc(dir)}</span>` : ""}${cls === "cl" ? (why.length ? why.map(w => `<div class="why">${esc(w)}</div>`).join("") : '<div class="why brak">brak wpisu w odstępstwach</div>') : ""}</span></div>`; };
    return arr.slice(0, 5).map(row).join("") + (arr.length > 5 ? `<details class="more"><summary>pokaż wszystkie (${arr.length})</summary>${arr.slice(5).map(row).join("")}</details>` : "");
  };
  const box = (title, cls, arr, sym, planned) => `<div class="chg ${cls}"><div class="chgh">${title} <span class="cnt">${arr.length || (planned ? "plan" : 0)}</span></div>${arr.length ? top(arr, sym, cls === "zm" ? "cl" : "cn") : planned ? `<div class="muted">planowane: ${esc(planned)}</div>` : '<div class="muted">nic</div>'}</div>`;
  const io = (t, arr) => {
    if (!arr?.length) return "";
    // one entry per file; sections of the same file grouped under it
    const groups = [];
    for (const x of arr) {
      if (typeof x === "string") { groups.push({ plik: x, items: [] }); continue; }
      const p = sub(x.plik);
      let g = groups.find(g => g.plik === p);
      if (!g) groups.push(g = { plik: p, items: [] });
      g.items.push(x);
    }
    const sek = x => x.sekcja ? `<span class="sek">§ ${esc(x.sekcja.replace(/^#+\s*/, ""))}</span>` : "";
    return `<div><div class="k">${t}</div><ul class="io">${groups.map(g => g.items.length === 1 && !g.items[0].sekcja
      ? `<li><code>${esc(g.plik)}</code><span class="po"> — ${esc(g.items[0].po_co)}</span></li>`
      : `<li><code>${esc(g.plik)}</code><ul class="sub">${g.items.map(x => `<li>${sek(x) || "całość"}<span class="po"> — ${esc(x.po_co)}</span></li>`).join("")}</ul></li>`).join("")}</ul></div>`;
  };
  const gate = [k.bramka.czlowiek && `👤 ${k.bramka.czlowiek}`, k.bramka.testy && `✓ ${k.bramka.testy}`, k.bramka.zrzuty && `📷 ${k.bramka.zrzuty}`].filter(Boolean);
  const hashes = cm.map(c => `● ${D.repoUrl ? `<a href="${esc(D.repoUrl)}/commit/${esc(c.full)}" target="_blank" rel="noopener">${esc(c.hash)}</a>` : esc(c.hash)} · ${esc(c.date)}`).join(" · ") + (pend.legacy.length || pend.dodane.length ? " · niezacommitowane" : "");
  $("#krok").innerHTML = `<h2>${status(k) === "current" ? "▶ " : ""}${esc(k.nr ? `${k.nr}. ${k.nazwa}` : k.nazwa)} <span class="tag pl-${k.plaszczyzna}" style="vertical-align:middle">${esc(plane(k).nazwa)}</span></h2>
    <div class="card stepcard"><p style="margin:0">${esc(k.po_co)}</p>${k.opcja ? `<div class="opt-note">⚙️ zależnie od aplikacji: ${esc(k.opcja)}</div>` : ""}
      <div class="chgs">${box("◆ Zmienione w legacy", "zm", zm, "◆", k.kod.legacy)}${box("+ Dodane w legacy", "dd", dod, "+", k.kod.nowy)}</div>
      ${nasze.length ? `<div class="k">zmienione nasze (z wcześniejszych kroków): ${nasze.map(f => esc(f.split("/").pop())).join(", ")}</div>` : ""}
      ${hashes ? `<div class="k" style="text-transform:none;letter-spacing:0">${hashes}</div>` : ""}
      <div class="cols">${io("wejście", k.wejscie)}${io("wyjście", k.wyjscie)}</div>
      <div class="cols"><div><div class="k">🚦 bramki</div>${gate.length ? gate.map(g => `<div>${esc(g)}</div>`).join("") : '<span class="muted">bez bramki</span>'}${gateEntries(k.id).length ? `<div class="gates" style="margin-top:8px">${gateEntries(k.id).map(e => gateRow(e, false)).join("")}</div>` : ""}</div>
        ${list("może", k.moze)}${list("nie może", k.nie_moze)}${list("stop", k.stop)}</div></div>`;
}

function artifacts() {
  // On top only the start (source, specification, places, state, gate log) and the end (what the last step left for a human:
  // story, reconciliation, logs); everything else folded, one group per step (step = theme).
  const a = D.artefakty || [];
  const ico = f => /\.(webm|mp4)$/.test(f) ? '🎬' : /\.(png|jpe?g)$/.test(f) ? '📷' : /\.html$/.test(f) ? '🖥️' : /\.jsonl?$/.test(f) ? '🧾' : /\.m?js$/.test(f) ? '⚙️' : '📄';
  const stepOf = x => x.krok ? label(stepById(x.krok)) : 'niezacommitowane';
  const card = x => `<a class="art" href="${esc(cel(x.plik))}" data-plik="${esc(x.plik)}"><span class="ico">${ico(x.plik)}</span><span><span class="nm">${esc(x.plik)}</span><small>${esc(stepOf(x))}</small></span></a>`;
  const shotGroup = ([d, xs]) => `<a class="art" href="${esc(cel(xs[0].plik))}" data-plik="${esc(xs[0].plik)}" data-grupa="${esc(d)}"><span class="ico">📷</span><span><span class="nm">${esc(d)}/</span><small>${xs.length} zrzutów · ${esc(stepOf(xs[0]))}</small></span></a>`;
  const tiles = xs => {
    const shots = xs.filter(x => /\.png$/.test(x.plik)), rest = xs.filter(x => !/\.png$/.test(x.plik));
    rest.sort((p, q) => (/story\.html$/.test(q.plik) - /story\.html$/.test(p.plik)) || p.plik.localeCompare(q.plik));
    const groups = Object.entries(shots.reduce((m, x) => { const d = x.plik.split('/').slice(0, -1).join('/'); (m[d] ||= []).push(x); return m; }, {}));
    return `<div class="arts">${rest.map(card).join('')}${groups.map(shotGroup).join('')}</div>`;
  };
  const START = ['zrodlo.md', 'specyfikacja.md', 'miejsca.md', 'stan.json', 'bramki.jsonl'];
  const order = (D.workflow?.kroki || []).map(k => k.id);
  const last = a.filter(x => x.plik.includes('/') && x.krok).map(x => x.krok).sort((p, q) => order.indexOf(q) - order.indexOf(p))[0];
  const isEnd = x => (x.krok === last && (/story\.html$/.test(x.plik) || /\/rekonsyliacja\/[^/]+\.jsonl$/.test(x.plik) || /\/log-[^/]+\.txt$/.test(x.plik)));
  const start = START.map(f => a.find(x => x.plik === f)).filter(Boolean), end = a.filter(isEnd);
  const reszta = a.filter(x => !start.includes(x) && !end.includes(x));
  const byStep = Object.entries(reszta.reduce((m, x) => { (m[x.krok || ''] ||= []).push(x); return m; }, {}))
    .sort(([p], [q]) => (order.indexOf(p) + 1 || 99) - (order.indexOf(q) + 1 || 99));
  const fold = ([k, xs]) => `<details class="fold art-grupa"><summary><h3>${esc(k ? label(stepById(k)) : 'niezacommitowane')}</h3><span class="sum">${xs.length} ${xs.length === 1 ? 'plik' : [2, 3, 4].includes(xs.length % 10) && ![12, 13, 14].includes(xs.length % 100) ? 'pliki' : 'plików'}</span></summary>${tiles(xs)}</details>`;
  $('#artefakty').innerHTML = `<h2>📦 Artefakty</h2>${a.length ? `
    <div class="k">początek</div>${tiles(start)}
    ${end.length ? `<div class="k" style="margin-top:14px">koniec${last ? ` · ${esc(label(stepById(last)))}` : ''}</div>${tiles(end)}` : ''}
    ${byStep.length ? `<div class="k" style="margin-top:14px">po krokach</div>${byStep.map(fold).join('')}` : ''}` : '<p class="muted">Jeszcze nic.</p>'}`;
}

let dirty = false, plik = 'specyfikacja.md';
const tekstowe = () => Object.fromEntries([['specyfikacja.md', D.raw || D.body || ''], ...(D.artefakty || []).filter(a => a.tresc !== undefined && a.plik !== 'specyfikacja.md').map(a => [a.plik, a.tresc])]);
const pliki = tekstowe();
function specBody(text) {
  const cut = ['Odstępstwa', 'Testy', 'Dziennik człowieka'];
  let body = text.replace(/^---\n[\s\S]*?\n---\n/, '');
  for (const c of cut) body = body.replace(new RegExp(`\\n## ${c}[^\\n]*\\n[\\s\\S]*?(?=\\n## |$)`), '\n');
  return body.replace(/<!-- krok: ([\w.-]+) -->\n## (.+)/g, (m, id, t) => { const k = stepById(id); return `## ${t} <span class="tag pl-${k?.plaszczyzna ?? ''}" title="${esc(k ? plane(k).nazwa : '')}">${esc(k ? `krok ${name(k)}` : id)}</span>`; });
}
function preview(name, text) {
  if (name === 'specyfikacja.md') return md(specBody(text)) + (D.zrodlo && !pliki['zrodlo.md'] ? `<details class="extra"><summary>Źródło rozwiązania (zrodlo.md, bez zmian)</summary>${md(D.zrodlo)}</details>` : '');
  if (/\.md$/.test(name)) return md(text);
  return `<pre>${esc(text)}</pre>`;
}
function spec() {
  $('#spec').innerHTML = `<h2 style="display:block">📝 Specyfikacja i pliki</h2><div class="mdwin">
    <div class="mdbar"><span class="nm" id="mdnazwa"></span><span class="stan" id="mdstan"></span>

    <div class="view clamp" id="mdview"></div><button type="button" class="mdmore" id="mdmore" data-more>więcej ▾</button>
    <textarea id="mdtext" spellcheck="false" hidden aria-label="treść pliku"></textarea></div>

function openFile(name, grupa) {

  else if (/\.(png|jpe?g)$/.test(name)) $('#mdview').innerHTML = `<img src="${esc(name)}" alt="${esc(name)}">`;
  else $('#mdview').innerHTML = `<p>Otwórz plik w nowej karcie: <a href="${esc(name)}" target="_blank" rel="noopener">${esc(name)}</a></p>`;
  $('#mdhint').innerHTML = editable ? `Zmiany zapisujesz do <code>specyfikacje/${esc(D.stan?.obszar ?? '<obszar>')}/${esc(name)}</code> (zapisz… → wskaż ten plik). Claude bierze je w następnym kroku; commit idzie razem z krokiem.` : '';
}

function gateEntries(id) {
  const t = testyOf(id).map(x => ({ data: x.data, krok: x.krok, ico: passed(x) ? "✓" : "✗", cls: passed(x) ? "ok" : "bad", tekst: `${({ porownanie: "porównanie ", slownik: "słownik zakazany ", roznice: "różnice " })[x.typ] ?? ""}${x.co}: ${x.wynik}` }));
  const h = gatesOf(id, "czlowiek").map(x => ({ data: x.data, krok: x.krok, ico: "👤", kto: x.kto, cls: "", tekst: `${x.decyzja}${x.uwagi ? " — " + x.uwagi : ""}` }));
  return [...t, ...h].sort((p, q) => p.data < q.data ? -1 : 1);
}
const gateRow = (e, withStep) => `<div class="grow"><span class="gwho"><span class="gico ${e.cls}">${e.ico}</span>${e.kto ? `<span class="nick">${esc(e.kto)}</span>` : ""}</span><span>${withStep ? `<span class="k" style="text-transform:none;letter-spacing:0">${esc(e.data)} · ${esc(label(stepById(e.krok)))}</span><br>` : ""}<span class="${e.cls}">${esc(e.tekst)}</span></span></div>`;
function bottom() {
  const all = gateEntries();
  const nt = all.filter(e => e.ico === "✓").length, nb = all.filter(e => e.ico === "✗").length, nh = all.filter(e => e.ico === "👤").length;
  const last = all[all.length - 1];
  $("#bramki").innerHTML = `<details class="fold"><summary><h2>🚦 Bramki</h2><span class="sum">${all.length ? `<span class="ok">✓ ${nt}</span>${nb ? ` <span class="bad">✗ ${nb}</span>` : ""} · 👤 ${nh}${last ? ` · ostatnia: ${esc(last.data)} ${esc(label(stepById(last.krok)))}` : ""}` : "jeszcze nic"}</span></summary><p class="k" style="text-transform:none;letter-spacing:0">✓ ✗ testy, porównania odpowiedzi i katalog różnic (seed / poza seedem) uruchomione skryptem · 👤 decyzja człowieka · źródło: <code>bramki.jsonl</code></p>${all.length ? `<div class="card gates">${all.map(e => gateRow(e, true)).join("")}</div>` : ""}</details>`;
  $("#dziennik").innerHTML = "";
  $("#odstepstwa").innerHTML = "";
}

function confirmLeave() { return true; } // edits stay in memory per file; reload waits while anything is unsaved
async function mdAction(a) {
  const ta = $('#mdtext');
  const name = plik.split('/').pop();
  if (a === 'podglad' || a === 'edycja') {
    const ed = a === 'edycja';
    ta.hidden = !ed; $('#mdview').hidden = ed; $('#mdmore').hidden = ed;
    document.querySelectorAll('[data-md=podglad],[data-md=edycja]').forEach(b => b.setAttribute('aria-pressed', b.dataset.md === a));
    if (!ed) $('#mdview').innerHTML = preview(plik, ta.value);
    if (ed) ta.focus();
  } else if (a === 'kopiuj') {
    try { await navigator.clipboard.writeText(ta.value); $('#mdstan').textContent = 'skopiowane'; } catch { ta.hidden = false; ta.select(); }
  } else if (a === 'zapisz') {
    try {
      if (window.showSaveFilePicker) {
        const h = await showSaveFilePicker({ suggestedName: name });
        const w = await h.createWritable(); await w.write(ta.value); await w.close();
      } else {
        const a2 = document.createElement('a'); a2.href = URL.createObjectURL(new Blob([ta.value], { type: 'text/markdown' })); a2.download = name; a2.click();
      }
      dirty = false; $('#mdstan').textContent = 'zapisane';
    } catch { $('#mdstan').textContent = 'nie zapisano — skopiuj i wklej do pliku'; }
  }
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-more]')) { const v = $('#mdview'), c = v.classList.toggle('clamp'); $('#mdmore').textContent = c ? 'więcej ▾' : 'mniej ▴'; return; }
  const m = e.target.closest('[data-md]');
  if (m) { mdAction(m.dataset.md); return; }
  const l = e.target.closest('#mdview a[href]');
  if (l && pliki[l.getAttribute('href')] !== undefined) { e.preventDefault(); openFile(l.getAttribute('href')); return; }
  const f = e.target.closest('[data-plik]');
  if (f) { e.preventDefault(); if (dirty && !confirmLeave()) return; openFile(f.dataset.plik, f.dataset.grupa); $('#spec').scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
  const t = e.target.closest('[data-plane],[data-step]');
  if (!t) return;
  if (t.dataset.plane) { collapsed.has(t.dataset.plane) ? collapsed.delete(t.dataset.plane) : collapsed.add(t.dataset.plane); lanes(); return; }
  if (!selectable(t.dataset.step)) return;
  selected = t.dataset.step;
  history.replaceState(null, '', `#${selected}`);
  lanes(); stepCard();
  $('#krok').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
});

// one floating popup above everything (the lanes card scrolls sideways and would clip it)
function showTip(el) {
  const t = $("#tip"), src = el.querySelector(".tip");
  if (!src) return;
  t.innerHTML = src.innerHTML; t.classList.add("on");
  const r = el.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
  let x = r.left + r.width / 2 - w / 2, y = r.bottom + 8;
  x = Math.max(8, Math.min(x, innerWidth - w - 8));
  if (y + h > innerHeight - 8) y = r.top - h - 8;
  t.style.left = x + "px"; t.style.top = y + "px";
}
const hideTip = () => $("#tip").classList.remove("on");
document.addEventListener("mouseover", e => { const s = e.target.closest(".step"); s ? showTip(s) : hideTip(); });
document.addEventListener("focusin", e => { const s = e.target.closest(".step"); s ? showTip(s) : hideTip(); });
addEventListener("scroll", hideTip, true);

hero(); places(); lanes(); stepCard(); artifacts(); spec(); bottom();
// live: each gate rebuilds this file; while the workflow runs, reload every 30 s (selected step stays in the hash)
if (!finished && !D.demo && location.protocol === 'file:') setInterval(() => { if (!dirty) location.reload(); }, 30000);
</script>
