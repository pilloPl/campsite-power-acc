nie” / pusta lista).\n\n**Seed** `AcceptanceSeed.seed(AcceptanceWorld)` (pakiet świata) — te same komendy dla obu modeli: wybrzeże (Dalmatia:\nZadar, Split; Istria: Rovinj; słupki `SEED-ZADAR-P1`, `SEED-SPLIT-P1`, `SEED-ROVINJ-P1`); M1: Caravan Club (umowa z\nZadarem), jego jednostka Junior (własna umowa z Rovinj), Sea Club (umowa na Dalmację), Lonely Club (bez umów), karta bez\ngościa; M2/M3: partnerzy Kvarner Club i Alpine Club, jednostki sieci Network season (nie do Kvarner), Network corporate\n(do żadnego), Network corporate VIP (pod corporate, do Kvarner wolno), karty sieci i jednostek, karta Alpine Club; M4:\ndwie karty personelu Zadaru, nieaktywna Zadaru, karta Splitu, karta regionu Dalmacja. UID-y i nazwy jako stałe\n`AcceptanceSeed` (krok 6 i router biorą przypadki stąd). Nazwa partnera „Kvarner Club”, nie „Adria Club” jak w\nscenariuszach: demo ma już partnera `ADRIA CLUB`.\n\n**Moduł seedera** `campsite-seeder` (`io.pillopl.seeder`, profil `acceptance-seed`, łączony z demo:\n`demo,acceptance-seed`): `AcceptanceSeeder` (`SmartLifecycle`, faza 1 — po seederze demo, przed Quartzem) zasila stary\nmodel raz (znacznik: słupek `SEED-ZADAR-P1`), Party przy każdym starcie, potem `ComparisonInput`. Jak uruchomić —\n`stan.json` (`aplikacja`).\n\n**Wejście do porównania** (`ComparisonInput`, tylko stary model, poza światem, przy każdym starcie — `stan.json`\n`przygotowanie`): lista lokalna z kartami domowymi (bez kart gości) na regionach Dalmatia i Istria (M4); partnerzy seedu\nz wymianą plików V1 w `acceptance.seed.exchange-dir/\u003cpartner>`, eksport listy kart do obu (M2), import kart od Alpine\nClub (M3), kemping partnera = `HR SITES` (wymóg walidacji eksportu); katalogi partnerów czyszczone; karty sieci seedu\nznów czekają na eksport (`PARTNER_SYNC_STATE=ADD`, cel pusty — przebieg wymiany oznacza je jako wysłane); plik\n`cards-in/cards-seed.csv` Alpine Club: karta sieci i karta Network season (odrzucone jako karty sieci), karta Caravan\nClub (odrzucona: innego wydawcy), własna karta Alpine (przyjęta, zmiana idempotentna) — przebieg przenosi plik do\n`done`, więc seeder odtwarza go przy każdym starcie.\n\n**Pułapki uruchomienia:**\n- Reseed demo kasuje wszystkie wyjątki wymiany z id ≥ 1000, także seedu, a stary model zasilamy raz — start z\n  `CAMPSITE_DEMO_RESEED=false`; gdy wyjątków seedu brakuje, seeder zatrzymuje start (`SeedLost`) z tą wskazówką.\n- Job wymiany zjadłby plik importu i oznaczył karty jako wysłane — start z `SPRING_QUARTZ_AUTO_STARTUP=false`.\n- Eksport listy kart obejmuje też karty sieci z demo i partnera demo `ADRIA CLUB` (V2, adres przykładowy): na nowym\n  modelu ich nie ma, więc liczba kart wysłanych partnerowi różni się o karty demo — w kroku 6 porównujesz UID-y kart\n  seedu w pliku eksportu partnera seedu, nie całe liczby.\n\n**Adapter może znaleźć inną encję niż wołający:**\n- M2: wołający ma kartę z `findCardsForPartnerExport`; adapter bierze najnowszą żywą kartę o tym UID — przy UID\n  wydanym dwa razy może odpowiedzieć o innej karcie (bez zmian od kroku 3).\n- M4: odpowiedź to zbiór UID-ów; wołający dociąga encje `HouseCard` po UID (`findActiveByRfidAndNumber`, aktywna,\n  najniższe id na UID). Dwie aktywne karty domowe o tym samym UID (np. na kempingu i na innym kempingu) dają jedną\n  encję, możliwe że spoza linii słupka; dziś lista ma obie.\n- M1, M3: adapter szuka karty tym samym zapytaniem co wołający (`findByCardRfid`), słupka po kodzie — ta sama encja.\n\n**Kolejność odpowiedzi-zbioru (M4):** dziś karty domowe idą w kolejności zapytania bez `ORDER BY`; przez port —\nw kolejności id (decyzja: porządek deterministyczny, ten sam na obu modelach). Ucinanie „ostatnio używane pierwsze”\nbez zmian.\n\nTesty kroku: scenariusze na obu modelach (`Acceptance*ScenariosTest`, 20 + 20) i sanity `AcceptanceSeederSanityTest`\n(campsite-server, profile `demo,acceptance-seed`, `acceptance.model=party`: kontekst startuje, port = Party, oba\nmodele mają seed, plik importu czeka). `testy_krok` w fazie `package`: w fazie `test` reaktor podaje katalog\n`test-classes` campsite-core zamiast test-jara i sanity widzi dwie `@SpringBootConfiguration`.\n\n\u003c!-- krok: swappable-dsl.6 -->\n## Wejście do porównania i wyniki\nWybór: **oba** (front i API) — aplikacja ma konsolę. Każdy model to osobny start (przełącznik `ACCEPTANCE_MODEL`,\nrestart, seeder przygotowuje wejście od nowa), potem w tej kolejności: API (`ekran/api.json`, `front-compare.mjs`),\nnagranie ekranu (`ekran/story.json`, `front-story.mjs`, uruchamia też wymianę), pliki wymiany (`ekran/wymiana.mjs`).\nOdpowiedzi modelu razem: `ekran/legacy.jsonl`, `ekran/party.jsonl`. Joby wyłączone (`SPRING_QUARTZ_AUTO_STARTUP=false`).\n\n| Miejsce | Okienko | Przypadki z seedu | Co porównane |\n|---|---|---|---|\n| M1 | Karty → „Check card at socket” (dialog) + `checkCardAtSocket` | 5 kart gości × 3 słupki seedu (gniazdo 1) | status sprawdzenia z ekranu i `check.validationStatus` z API |\n| M4 | Karty → „Local card list of a pedestal” (wybór słupka) + `getLocalCardList` | 3 słupki seedu | UID-y z tabeli listy i `localCardList.entries` (zbiór) |\n| M3 | Wymiana z wydawcami → „Run exchange now” → wiersz „Alpine Club / Card import” | plik `cards-seed.csv` Alpine Club (4 linie) | „ok / odrzucone” i powody z ekranu; to samo z `findIssuerSyncStatuses` |\n| M2 | ten sam przebieg wymiany; wiersze „Card export” tylko na zrzucie | karty sieci seedu → Kvarner Club, Alpine Club | UID-y kart seedu w pliku eksportu partnera (`cards-out`), stan eksportu z API |\n\nKtóry model odpowiadał: log przy starcie `Acceptance model: LEGACY (acceptance.model=legacy) …` i\n`Acceptance model: PARTY (acceptance.model=party) …` (oba nagrania).\n\n**Wynik: 42/42 to samo** (`front-compare.mjs diff ekran/legacy.jsonl ekran/party.jsonl`); na ekranie 19/19\n(`ekran/story.html`, zrzuty w `ekran/legacy/`, `ekran/party/`, filmy `video.webm` lokalnie, poza gitem).\n- M1: Zadar — Caravan Club i Sea Club przyjęte; Split — tylko Sea Club; Rovinj — tylko Caravan Club Junior; Lonely Club\n  nigdzie. Karta bez gościa (`880000105`) nie dochodzi do pytania: konsola odmawia wcześniej (`NOT_AUTHORIZED`, „no\n  access to card”) — ta sama odmowa na obu modelach, o M1 nic nie mówi; dla niej zostają scenariusze.\n- M4: Zadar 401, 402, 405; Split 404, 405; Rovinj pusta lista (Istria bez kart personelu).\n- M2: do Kvarner Club 201 i 204, do Alpine Club 201 i 202 (corporate 203 do nikogo).\n- M3: 1 przyjęta / 3 odrzucone — dwie „exists as a network card already”, jedna „imported from another issuer already”.\n\nCzego nagranie nie dowodzi: odpowiedzi o danych spoza seedu (karty i słupki demo — na Party „nie” / pusta lista,\ndlatego liczby „Items ok” eksportu nie są porównywane: obejmują karty demo, a przebieg na starym modelu oznacza je jako\nwysłane); zachowania jobów (wyłączone); reszty aplikacji (stary model zawsze); przypadku dwóch kart o tym samym UID\n(M2, M4 — seed go nie ma).\n\n\u003c!-- krok: parallel-model-router.1 -->\n## Flaga\n**Co projekt już ma.** Bibliotek flag brak (`pom.xml`-e, `campsite-console/package.json`: ani Togglz/FF4J/Unleash/\nOpenFeature, ani `@RefreshScope`). Jest tabela `SYSTEM_PROPERTY` (`SystemProperty`, klucz = wartość enumu\n`SystemPropertyKey` zapisana tekstem) z cache w `SystemPropertyService` (mapa w pamięci, ładowana przy pierwszym\nodczycie, przeładowywana przy `setProperty` i `reloadSystemProperties`). Zmiana z konsoli: Administracja → „System\nproperties (SYSTEM_PROPERTY)” → Edit (`/api/console/administration/setSystemProperty`, prawo `CONFIG_EDIT`, audyt\n`CONFIG_CHANGE` „'stara' -> 'nowa'”); przycisk „Reload configuration” przeładowuje cache węzła. Ekran pokazuje każdy\nklucz enumu (`AdministrationMapper.toSystemPropertyDTOs` iteruje `values()`; klucz bez wiersza = „default”), pusta\nwartość z ekranu = domyślna z kodu. Precedens routingu per obiekt: `PowerSection.algorithmBeanName` (bean wybierany\npo nazwie zapisanej w rekordzie) — nie dotyczy pytań portu (nie mają rekordu, który wskazywałby model).\nObecny przełącznik `acceptance.model` (`AcceptanceConfiguration`) jest startowy — zmiana wymaga restartu.\n\n**Opcje:**\n\n| Opcja | Zmiana bez redeployu | Co rusza w legacy | Ocena |\n|---|---|---|---|\n| **A. `SYSTEM_PROPERTY`** — dwa nowe klucze w `SystemPropertyKey` | tak, po jednym deployu z nowymi kluczami; od razu na węźle, który zapisał | `SystemPropertyKey` (+2 wartości enumu); bez migracji (ekran pokazuje klucz bez wiersza), bez nazwanych getterów | **rekomendacja**: istniejący mechanizm, ekran, audyt i prawo za darmo |\n| B. Togglz z `JDBCStateRepository` na bazie projektu + konsola Togglz | tak | nowa zależność w `pom.xml`, nowa tabela (migracja), nowa konsola i jej zabezpieczenie | nowa biblioteka w legacy, choć mechanizm już jest |\n| C. Zostaje `acceptance.model` (start) | nie — restart | nic | odpada: wymaga redeployu/restartu, choć da się bez (stop kroku) |\n\n**Wybór (rekomendacja): A, reguła — sama wajcha.** Pytania portu (`cardWorksAt`, `cardMayGoToPartner`, `isNetworkCard`,\n`staffCardsAt`) nie niosą pojęcia, po którym warto by dzielić ruch na etapie badania hipotezy (wydawca / kemping dałyby\nsię wyznaczyć tylko w M1 i M2, nie w M3 i M4) — jedna wajcha dla wszystkich czterech miejsc.\n\n**Klucze** (`\u003cObszar>` = `Acceptance`, pakiet portu):\n- `AcceptanceAnswer` = `legacy` | `party` — który model odpowiada wołającym. Brak wiersza albo pusta wartość →\n  wartość przełącznika startowego `acceptance.model` (domyślnie `legacy`). Inna wartość → jak brak, z ostrzeżeniem\n  w logu (wajcha nie zatrzymuje pytań).\n- `AcceptanceCompare` = `true` | `false` — czy pytać też drugi model i zapisywać różnice. Brak / pusty / inna wartość\n  → `false`.\n- Klucza reguły brak (sama wajcha). Reakcja na różnicę: `log` (tylko wpis do pliku różnic, `reconciliation.md`).\n\nOdczyt przez istniejące ogólne `getProperty(klucz, null)` i parsowanie w wajchy (`AcceptanceLever`) — nie przez\n`getPropertyBoolean` (na pustym napisie z ekranu logowałby błąd przy każdym pytaniu). Konwencji „każdy klucz ma nazwany\ngetter w `SystemPropertyService`” nie rozszerzamy: flaga jest przejściowa i zniknie razem z jednym z modeli; dwa gettery\nw serwisie legacy byłyby kolejną zmianą do wycofania.\n\n**Jak zmienia człowiek:** konsola, Administracja → System properties → filtr „Acceptance” → Edit → wartość (`party` /\n`legacy`, `true` / `false`) → Save; audyt `CONFIG_CHANGE`. Powrót: wartość `legacy` albo pusta. Bez konsoli: ten sam\nendpoint `setSystemProperty` (curl z sesją konsoli) albo SQL na `SYSTEM_PROPERTY` + „Reload configuration”.\n\n**Ile trwa:** węzeł, który zapisał, widzi zmianę przy następnym pytaniu (`setProperty` przeładowuje cache). Cache jest\nper węzeł: przy kilku węzłach pozostałe widzą zmianę dopiero po „Reload configuration” na każdym z nich (albo\nrestarcie) — konfiguracja w repo opisuje jeden węzeł aplikacji. SQL bez „Reload configuration” nie działa do restartu.\n\n**Ograniczenia:** nowe klucze wymagają jednego deployu (enum); wajcha obejmuje tylko cztery miejsca z `miejsca.md`;\nstan wajchy w bazie przeżywa restart (przy ponownym starcie ustaw jawnie, jeśli trzeba wrócić do startowego).\n\n\u003c!-- krok: parallel-model-router.2 -->\n## Router\n`CardAcceptanceRouter` (`io.pillopl.acceptance`, campsite-core) — trzecia implementacja portu `CardAcceptance`,\n`@Primary` w `AcceptanceConfiguration` zamiast przełącznika startowego. Oba adaptery (`LegacyCardAcceptance`,\n`PartyCardAcceptance`) bez zmian; port, scenariusze i modele bez zmian.\n\n| Wajcha (`AcceptanceAnswer` / `AcceptanceCompare`) | Kto odpowiada wołającemu | Drugi model | Do pliku różnic |\n|---|---|---|---|\n| brak / pusta / nieznana, `false` | model startowy `acceptance.model` (domyślnie legacy) | nie pytany | nic |\n| `legacy`, `false` | stary model | nie pytany | nic |\n| `legacy`, `true` | stary model | Party, pytany w osobnej transakcji | różnica, gdy odpowiedzi różne |\n| `party`, `true` | Party | stary model, w osobnej transakcji tylko do odczytu | różnica, gdy odpowiedzi różne |\n| `party`, `false` | Party | nie pytany | nic |\n\n- **Wajcha** `AcceptanceLever` czyta oba klucze przy każdym pytaniu (`SystemPropertyService.getProperty`, mapa w\n  pamięci). Reguła: sama wajcha, wspólna dla M1–M4. Router loguje każdą zmianę pozycji przy pierwszym pytaniu po niej:\n  `Acceptance lever: PARTY with comparison answers the card acceptance questions (was: LEGACY without comparison)`.\n  Przy starcie: `Acceptance model: LEGACY (acceptance.model=legacy) answers … until the lever AcceptanceAnswer is moved`.\n- **Wyjątki.** Wyjątek modelu, który odpowiada, dochodzi do wołającego bez zmian (np. `InvalidValueException`\n  adaptera legacy w M4 — wołający dalej łapie go i pyta starą drogą). Wyjątek modelu, który nie odpowiada, idzie\n  tylko do pliku różnic (`\"legacy\": {\"error\": \"…\"}`). Router nie udaje odpowiedzi.\n- **Transakcja przy porównaniu.** Model, który nie odpowiada, pytany jest przez `TransactionTemplate`\n  `REQUIRES_NEW` + `readOnly` (adapter legacy ma `@Transactional(readOnly = true)` na klasie — w transakcji wołającego\n  jego wyjątek oznaczyłby ją do wycofania). Skutki: (1) osobne połączenie z puli na każde porównane pytanie (eksport\n  M2 pyta w pętli po kartach); (2) stary model jako drugi nie widzi niezatwierdzonych zmian wołającego — gdy wołający\n  coś zapisał przed pytaniem w tej samej transakcji, różnica może być pozorna; (3) w testach, w których świat żyje\n  w niezatwierdzonej transakcji (scenariusze legacy), router trzeba zbudować z `TransactionOperations.withoutTransaction()`\n  — inaczej stary model jako drugi nie widzi świata (krok 4).\n- **Rekonsyliacja** `AcceptanceReconciliation` (porównanie: odpowiedzi tak/nie wprost, `StaffCards` jako zbiory UID-ów,\n  wyjątek po jednej stronie = różnica, ten sam typ wyjątku po obu = zgodne); zgodne tylko liczone (`summary()`: zgodne /\n  różne, łącznie i per pytanie, od startu węzła, w pamięci), różnice do pliku przez `AcceptanceReconciliationLog`;\n  `recent(n)` — ostatnie różnice z plików, najnowsze pierwsze; `directory()` — katalog. Reakcja na różnicę: tylko wpis\n  (`log`, bramka router.1). Błąd zapisu pliku nie psuje pytania (ostrzeżenie w logu).\n- **Plik różnic:** `acceptance.reconciliation.dir` (środowisko `ACCEPTANCE_RECONCILIATION_DIR`, domyślnie\n  `acceptance-reconciliation` w katalogu roboczym procesu; lokalnie `target/acceptance-reconciliation` — `stan.json`\n  `aplikacja`), plik na dzień UTC `differences-YYYY-MM-DD.jsonl`, wiersz na różnicę (format `reconciliation.md`:\n  `at`, `question` = metoda portu, `answering`, `input` z identyfikatorami — UID karty, kod słupka, nazwa partnera,\n  `legacy`, `new`, `diff`), dopisywany pod blokadą pliku. Test `AcceptanceReconciliationTest` pisze do własnego katalogu\n  w `target/acceptance-reconciliation-test/`.\n- **Tylko pytania.** Komendy (umowy, karty, filtry wymiany, przeniesienia) idą do starego modelu poza portem; świat\n  Party zasila tylko seeder przy starcie, więc po edycji w aplikacji Party się starzeje — różnice po takich zmianach są\n  spodziewane i nie podważają hipotezy (to samo dla danych demo spoza seedu: Party odpowiada „nie” / pusta lista).\n- **Poza routerem:** wołający spoza `miejsca.md` (reszta systemu pyta stary kod wprost); wartości z bazy, których typ\n  portu nie przyjmie (wołający idzie starą drogą, router ich nie widzi — sekcja „Wpięcie”).\n- Test sanity `AcceptanceSeederSanityTest` (nowy kod kroku swappable-dsl.5) sprawdzał `cardAcceptance` = adapter Party;\n  teraz: port = router, wajcha bez wierszy w `SYSTEM_PROPERTY` odpowiada modelem startowym `party`, bez porównania.\n\n\u003c!-- krok: parallel-model-router.3 -->\n## Ekran wajchy\n**Gdzie.** Konsola → zakładka 16 Administration → podsekcja „Acceptance lever” (szósta obok Users, Roles & rights,\nSystem properties, Audit log, Jobs). Nie nowa zakładka: `tabs.test.ts` utrwala 16 zakładek i ich numery, nowa\npozycja zmieniłaby test legacy. Zakładka widoczna z `USER_ADMIN`, odczyt ekranu wymaga `CONFIG_EDIT` (jak edycja flagi).\n\n**Co pokazuje** (`campsite-console/src/pages/AcceptanceLeverSection.tsx`, odświeżane co 5 s):\n- wajcha „Which model answers” — przełącznik `Legacy model` / `Party model`; obok zapisana wartość\n  `AcceptanceAnswer` albo „default (start-up model …)”, przycisk „Back to start-up model” (pusta wartość);\n- checkbox „Compare both models (reconciliation)” z zapisaną wartością `AcceptanceCompare`;\n- zwinięte „Reconciliation results” z licznikami „N agreed / M different” (od startu węzła, w pamięci);\n  rozwinięcie: tabela per pytanie portu, katalog plików różnic, ostatnie 20 różnic z pliku (pytanie, wejście, `diff`,\n  kto odpowiadał, kiedy).\n\n**Zapis wajchy** — istniejącym `/api/console/administration/setSystemProperty` (prawo `CONFIG_EDIT`, audyt\n`CONFIG_CHANGE`), ten sam co w „System properties”; działa od następnego pytania (krok router.1).\n**Odczyt** — nowy endpoint `POST /api/console/acceptanceLever/getAcceptanceLever` `{\"recent\": n}` (n ≤ 50, brak = 0)\n→ `{\"lever\": {answerKey, answerValue, answering, startModel, compareKey, compareValue, comparing, agreed, differed,\nperQuestion, differences, directory}}` (`AcceptanceLeverWebService` w campsite-endpoints, `AcceptanceLeverStatus`\nw pakiecie portu: `CONFIG_EDIT`, potem `AcceptanceLever` i `summary()` / `recent(n)` / `directory()`\nrekonsyliacji). Operacja „get…” — filtr audytu konsoli traktuje ją jak odczyt. Klient API (`schema.d.ts`) nie\nregenerowany: typ odpowiedzi w pliku ekranu. Bez frontu: curl z sesją konsoli (login `/api/console/auth/login`,\nnagłówek `X-XSRF-TOKEN` z ciasteczka `XSRF-TOKEN`) na ten sam endpoint.\n\n**Testy:** `AcceptanceLeverSection.test.tsx` (wajcha i checkbox zapisują klucze przez `setSystemProperty`, powrót =\npusta wartość, liczniki zwinięte, różnice po rozwinięciu) — `testy_front`; `AcceptanceLeverWebServiceIntegrationTest`\n(nieruszona wajcha = model startowy bez porównania, zmiana w system properties widoczna od razu, recepcja 403, bez\nlogowania 401) — dopisany do `testy_krok`.\n\n**Zrzuty:** `ekran/wajcha/` (`wajcha-story.json`, aplikacja na seedzie, wajcha startowo nieruszona): nieruszona →\nporównanie włączone + rozwinięte wyniki (0 / 0 — po starcie nikt nie pytał) → wajcha na party → powrót na model\nstartowy i porównanie wyłączone (`AcceptanceCompare` zostaje zapisane jako `false`). Liczniki niezerowe pokazuje\ndopiero przełączenie w kroku router.5.\n\n\u003c!-- krok: parallel-model-router.4 -->\n## Testy routera i zgodności\nBez mocków: Party w pamięci (`PartyConfiguration.inMemory()` na test), stary model jak w sterowniku legacy\n(`IntegrationTest` + Testcontainers). Wajcha w testach routera i zgodności — `InMemoryAcceptanceLever` (implementacja\ntestowa `CardAcceptanceRouter.Lever`); jedyny fake portu — `FailingModel` (awaria modelu). Kod produkcyjny bez zmian.\n\n| Test | Gdzie | Co sprawdza |\n|---|---|---|\n| `CardAcceptanceRouterTest` (8) | campsite-core | Party zna słupek i kartę, których baza starego modelu nie zna, więc modele odpowiadają różnie i odpowiedź mówi, kto odpowiedział. Dla czterech pozycji wajchy (legacy / party × z porównaniem / bez): kto odpowiedział, czy zaszło porównanie (liczniki `summary()`), co trafiło do pliku (`answering`, `question`, `legacy`, `new`); zgodne odpowiedzi tylko liczone; awaria modelu, który nie odpowiada, tylko w pliku (`error`), awaria modelu, który odpowiada, dochodzi do wołającego bez zmiany typu; wyjątek starego modelu pytanego jako drugi (NPE przy nieznanej karcie w M2) w `REQUIRES_NEW` + `readOnly` nie oznacza transakcji wołającego do wycofania |\n| `AcceptanceLeverTest` (6) | campsite-core | wajcha w prawdziwym `SYSTEM_PROPERTY` (`SystemPropertyService`), model startowy legacy: bez ustawień — legacy bez porównania; zmiana działa od następnego pytania; powrót na `legacy`; pusta wartość = model startowy; nieznane wartości = model startowy bez porównania; wyłączenie porównania. Transakcja na test wycofywana, cache ustawień przeładowany przed i po |\n| `AcceptanceModelsAgreementTest` (20) | campsite-core | sterownik `AcceptanceRouterDriver` pod te same `AcceptanceScenarios` (świat `BothModelsWorld` — każda komenda do światów obu modeli, świat per scenariusz); scenariusze idą przez router z wajchą na legacy i porównaniem. Po każdym scenariuszu (`@AfterEach`) wszystkie kombinacje wartości portu z jego świata (karty × słupki i każda karta dla M1/M3, karty gości × partnerzy dla M2, słupki dla M4) z wajchą na legacy, po przełączeniu na party i po powrocie: odpowiedzi równe, liczba porównań = liczba pytań, zero różnic, plik różnic pusty |\n| `AcceptanceSeedModelsAgreementTest` (1) | campsite-server (widzi seeder; profile `demo,acceptance-seed`) | router aplikacji i wajcha w `SYSTEM_PROPERTY` na seedzie: M1 5 kart gości × 3 słupki, M2 4 karty sieci × 2 partnerzy, M3 10 kart, M4 3 słupki (36 pytań na pozycję) — legacy → party → legacy, z porównaniem: odpowiedzi równe, porównań tyle co pytań (108), żadnej nowej różnicy. Katalog różnic `target/acceptance-reconciliation-seed-agreement` |\n\nTest nie sprawdza, jakie są odpowiedzi — to robią scenariusze; tylko że modele mówią to samo. Router w teście\nzgodności pyta drugi model bez osobnej transakcji (`TransactionOperations.withoutTransaction()`): świat starego modelu\nżyje w niezatwierdzonej transakcji scenariusza (sekcja „Router”, skutek 3); transakcję `REQUIRES_NEW` sprawdza\n`CardAcceptanceRouterTest` i test na seedzie (seed zatwierdzony).\n\n**Dziedzina pytań w teście zgodności.** M2 tylko dla kart gości: wołający eksportuje karty gości, a karta bez gościa\nw starym adapterze daje NPE, w Party „nie” (znana różnica poza scenariuszami, „M2 karta albo partner nieznani”). Karty\npersonelu nie są pytane w M1–M3 (to inna dziedzina — karty domowe, nie karty gości).\n\n**Wynik:** 35/35 nowych testów zielone za pierwszym podejściem, zero różnic. Testy dopisane do `testy_krok`.\n\n\u003c!-- krok: parallel-model-router.5 -->\n## Przełączenie na żywo\n**Przebieg** (jeden start aplikacji, nowa paczka, ta sama baza `run2-pg` z seedem, `ACCEPTANCE_MODEL=legacy`, joby\nwyłączone; wajcha ustawiona jawnie na `legacy` bez porównania — w bazie zostały wartości z kroku router.3). Nagrania\nw `ekran/przelaczenie/` (zrzuty i `answers.jsonl` w gicie, `video.webm` lokalnie), zestawienie `story.html`:\n\n| Faza | Wajcha | Co | Wynik |\n|---|---|---|---|\n| `przed` | `legacy`, bez porównania (ustawiona endpointem na starcie nagrania) | okienka z kroku 6: M1 15 przypadków, M4 3 słupki, wymiana (M3 import Alpine Club, M2 eksport do Kvarner/Alpine); API M1/M4 (`api-przed.jsonl`); pliki wymiany (`wymiana-przed.jsonl`) | = nagraniu legacy z kroku 6 (19/19, 18/18, 5/5) |\n| `wajcha-na-party` | ekran wajchy: „Compare both models” → „Party model” | zrzut przed i po przełączeniu | `AcceptanceAnswer = 'party'`, `AcceptanceCompare = 'true'` |\n| `po` | `party`, z porównaniem | te same okienka i przypadki, to samo API i pliki wymiany | przed vs po: ekran 19/19, API 18/18, wymiana 5/5 takie same |\n| `wyniki-i-powrot` | ekran wajchy: rozwinięte wyniki → „Legacy model”, porównanie wyłączone | liczniki i ostatnie różnice; powrót | API po powrocie (`api-po-powrocie.jsonl`) = przed (18/18) |\n\n**Log routera** (`ekran/przelaczenie/log-wajchy.txt`): start `LEGACY (acceptance.model=legacy)`, przy pierwszym pytaniu\n`LEGACY without comparison`, po przełączeniu `PARTY with comparison (was: LEGACY without comparison)`, po powrocie\n`LEGACY without comparison (was: PARTY with comparison)` — wajcha się przesunęła, bez restartu.\n\n**Rekonsyliacja** (`wajcha-po.jsonl`, ekran): 42 zgodne / 28 różnych. Wszystkie pytania o przypadki seedu zgodne —\nM1 24 (12 na ekranie, 12 w API; karta bez gościa nie dochodzi do pytania), M4 6, M3 4 (linie importu ze znaną kartą),\nM2 8 (4 karty sieci seedu × 2 partnerów). **Plik różnic dla seedu pusty** (`roznice-seed.jsonl`); cały plik\n(`roznice.jsonl`, kopia `target/acceptance-reconciliation/differences-2026-10-24.jsonl`) ma 28 różnic, wszystkie o\ndanych demo spoza seedu:\n- `staffCardsAt` ISTRIABAY-P01 × 18 — ekran Karty przy każdym wejściu ładuje listę kart pierwszego słupka z listy\n  (słupek demo), zanim nagranie wybierze słupek seedu; Party nie zna słupków demo (pusta lista);\n- `cardMayGoToPartner` 5 kart sieci demo × Kvarner/Alpine — eksport listy kart obejmuje karty demo (pułapka z kroku 5);\n  na Party „nie”, więc **z wajchą na party te karty demo nie wyszły do partnerów** — prawdziwa zmiana zachowania\n  poza seedem, na żywym systemie.\n\n**Wejście wymiany jest jednorazowe** (przebieg zjada plik importu i oznacza karty jako wysłane), a przełączenie jest\nbez restartu, więc seeder go nie odtwarza: `wejscie-wymiany.mjs` (snapshot pliku kart po starcie, przed każdym\nprzebiegiem `restore`: katalogi partnerów puste, plik z powrotem, karty sieci seedu `PARTNER_SYNC_STATE=ADD` przez\n`psql` w kontenerze) — krok `exec` w `story.json` przed „Run exchange now”.\n\n**Jak przełączyć:** konsola → Administration → Acceptance lever → „Compare both models” (zalecane przy pierwszym\nprzełączeniu) → „Party model”; działa od następnego pytania na tym węźle. Bez ekranu:\n`POST /api/console/administration/setSystemProperty` `{\"key\":\"AcceptanceAnswer\",\"value\":\"party\"}` i\n`{\"key\":\"AcceptanceCompare\",\"value\":\"true\"}` (sesja konsoli, `X-XSRF-TOKEN`, prawo `CONFIG_EDIT`, audyt\n`CONFIG_CHANGE`). **Jak wrócić:** „Legacy model” (albo „Back to start-up model” — pusta wartość = `acceptance.model`),\nporównanie odznaczone; endpointem `AcceptanceAnswer=legacy`, `AcceptanceCompare=false`. Stan wajchy jest w bazie\ni przeżywa restart. **Plik różnic:** `acceptance.reconciliation.dir` (`ACCEPTANCE_RECONCILIATION_DIR`, lokalnie\n`target/acceptance-reconciliation`), `differences-YYYY-MM-DD.jsonl`; liczniki w pamięci węzła od startu.\n\n**Czego przełączenie nie obejmuje:** reszty systemu (pyta stary kod wprost — także inne odczyty kart, umów i list);\nwołających spoza `miejsca.md` (np. `GroupApiService.toAgreementDTO`, wydawcy przyjmowani na liście słupka); danych\nspoza seedu (Party zna tylko seed: dla danych demo „nie” / pusta lista — patrz różnice wyżej, na żywym systemie to\nzmiana zachowania); komend (umowy, karty, filtry wymiany idą do starego modelu, Party się po nich starzeje);\nwartości, których typ portu nie przyjmie (wołający idzie starą drogą); innych węzłów (cache per węzeł — „Reload\nconfiguration”); jobów (wyłączone w przebiegu).\n\n## Odstępstwa (zmienione pliki legacy)\n| Krok | Plik | Co | Powód (test / wpięcie / wajcha / ekran / build) |\n|---|---|---|---|\n| swappable-dsl.3 | — | brak zmian legacy (bez szwu: logika `isNetworkCard` powtórzona w adapterze) | — |\n| swappable-dsl.4 | `pom.xml` | moduł `campsite-party` w `\u003cmodules>` i w `dependencyManagement` | build |\n| swappable-dsl.4 | `campsite-core/pom.xml` | zależność od `campsite-party` (adapter i świat nowego modelu w pakiecie portu) | build |\n| swappable-dsl.5 | `campsite-core/src/main/java/io/pillopl/card/ValidationService.java` | drugi konstruktor z portem; `isCardAcceptedAt` pyta port (M1) | wpięcie |\n| swappable-dsl.5 | `campsite-core/src/main/java/io/pillopl/issuer/IssuerExchangeService.java` | drugi konstruktor z portem (stary deleguje z `null`); pytanie w pętli eksportu przez `isSynchronizableForExport` (M2) | wpięcie |\n| swappable-dsl.5 | `campsite-core/src/main/java/io/pillopl/issuer/IssuerCardImportService.java` | drugi konstruktor z portem (stary deleguje z `null`); `isNetworkCard(card, cardRfid)` przez port (M3) | wpięcie |\n| swappable-dsl.5 | `campsite-core/src/main/java/io/pillopl/card/LocalCardListService.java` | drugi konstruktor z portem i `HouseCardDao` (stary deleguje z `null`); karty domowe słupka przez port (M4) | wpięcie |\n| swappable-dsl.5 | `pom.xml` | moduł `campsite-seeder` w `\u003cmodules>` i w `dependencyManagement` | build |\n| swappable-dsl.5 | `campsite-server/pom.xml` | zależność od `campsite-seeder` | build |\n| parallel-model-router.2 | `campsite-core/src/main/java/io/pillopl/config/SystemPropertyKey.java` | klucze `AcceptanceAnswer`, `AcceptanceCompare` (bez migracji i bez nazwanych getterów) | wajcha |\n| parallel-model-router.3 | `campsite-console/src/pages/AdministrationPage.tsx` | podsekcja „Acceptance lever” w `SECTIONS` i jej render (import nowego `AcceptanceLeverSection`) | ekran |\n| parallel-model-router.4, .5 | — | brak zmian legacy (testy; nagrania, skrypt wejścia wymiany w `ekran/`) | — |\n","stan":{"obszar":"akceptacja-kart","obszar_kod":"io.pillopl.acceptance (moduł campsite-core) + Acceptance","rozwiazanie":"party","zrodlo":"analiza/archetypy.md — „## Pogłębienie: party”","wyspa":"analiza/drzewo-grup","galaz":"parallel-models/akceptacja-kart-przebieg-2","galaz_startowa":"e2e/archetypy-2","baza":"02f63ceb61ebcb493103a5dc20e2836096f907cf","krok":"parallel-model-router.5","testy_krok":"mvn -B -pl campsite-server -am package -Dtest='Acceptance*ScenariosTest,AcceptanceSeederSanityTest,AcceptanceReconciliationTest,AcceptanceLeverWebServiceIntegrationTest,CardAcceptanceRouterTest,AcceptanceLeverTest,AcceptanceModelsAgreementTest,AcceptanceSeedModelsAgreementTest' -Dsurefire.failIfNoSpecifiedTests=false","testy_pelne":"mvn -B -fae verify","przelacznik":"wajcha w SYSTEM_PROPERTY: AcceptanceAnswer=legacy|party (który model odpowiada), AcceptanceCompare=true|false (pytaj oba, różnice do pliku); konsola Administracja → System properties → Edit (audyt CONFIG_CHANGE), działa od następnego pytania; brak/pusta wartość → przełącznik startowy ACCEPTANCE_MODEL=legacy|party (acceptance.model, domyślnie legacy). Log: „Acceptance lever: LEGACY|PARTY with|without comparison answers …” przy pierwszym pytaniu po zmianie; przy starcie „Acceptance model: … until the lever AcceptanceAnswer is moved”","aplikacja":"mvn -B -pl campsite-server -am clean package -DskipTests && CAMPSITE_DB_PORT=15481 CAMPSITE_HTTP_PORT=18341 CAMPSITE_CONSOLE_ORIGINS=http://localhost:5221 SPRING_PROFILES_ACTIVE=demo,acceptance-seed CAMPSITE_DEMO_RESEED=false SPRING_QUARTZ_AUTO_STARTUP=false ACCEPTANCE_SEED_EXCHANGE_DIR=$PWD/target/acceptance-exchange ACCEPTANCE_RECONCILIATION_DIR=$PWD/target/acceptance-reconciliation ACCEPTANCE_MODEL=legacy java -jar campsite-server/target/campsite-server-1.0.0-SNAPSHOT.jar (baza: docker run -d --name run2-pg -e POSTGRES_DB=campsite_power -e POSTGRES_USER=campsite -e POSTGRES_PASSWORD=campsite -p 15481:5432 postgres:16; drugi model: ten sam start z ACCEPTANCE_MODEL=party)","front":"cd campsite-console && npm ci && CAMPSITE_BACKEND_URL=http://localhost:18341 npx vite --port 5221 --strictPort (konsola: admin / demo-admin; CAMPSITE_CONSOLE_ORIGINS=http://localhost:5221 przy starcie aplikacji)","testy_front":"npm --prefix campsite-console test","przygotowanie":"seeder (moduł campsite-seeder, ComparisonInput, tylko stary model, przy każdym starcie): lista lokalna z kartami domowymi na regionach Dalmatia i Istria (M4); partnerzy Kvarner Club i Alpine Club z wymianą plików V1 w ACCEPTANCE_SEED_EXCHANGE_DIR/\u003cpartner> (eksport listy kart do obu — M2, import kart od Alpine Club — M3), katalogi partnerów czyszczone przy starcie; karty sieci z seedu znów czekają na eksport (stan synchronizacji ADD); plik kart Alpine Club w cards-in/cards-seed.csv (dwie karty sieci, karta innego wydawcy, własna karta partnera) — wejście jednorazowe odtwarzane przy starcie. Wymaga CAMPSITE_DEMO_RESEED=false (reseed demo kasuje wyjątki wymiany seedu — seeder zatrzymuje wtedy start) i SPRING_QUARTZ_AUTO_STARTUP=false (job wymiany zjadłby plik). Konsola: użytkownik admin / demo-admin (zakres HR SITES i HR ISSUERS widzi seed).","skille":"41ef2f2"},"body":"# Specyfikacja: akceptacja-kart — party obok starego modelu\n\nŹródło prawdy dla workflow `parallel-models`. Każdy krok dopisuje swoją sekcję; commit kroku zawiera zmianę kodu\ni tej specyfikacji razem. Źródło leży bez zmian w `zrodlo.md`, wybrane miejsca w `miejsca.md`, stan przebiegu w `stan.json`,\nwyniki bramek w `bramki.jsonl`. Widok: `specyfikacja.html`.\nKrok 1 zakłada plik z całego szablonu: wypełnia swoje sekcje, placeholderów innych kroków nie usuwa.\n\n\u003c!-- krok: swappable-dsl.1 -->\n## Stary model\n**Typowane drzewa grup** (`Group` z typem SITE / ISSUER / STAFF i polem rodzica; ustawienia jako atrybuty grup,\nobowiązuje najbliższe nad węzłem). Wydawca kart to grupa ISSUER; jego umowy akceptacji to lista grup SITE\nprzypięta do grupy wydawcy (`GROUP_ASSOCIATEDGROUP`); obowiązuje najbliższa w linii rodziców **niepusta** lista\n(listy wyżej są zastępowane, nie łączone), a każda pozycja rozwija się na całe poddrzewo kempingów i regionów.\nKarta gościa wskazuje wydawcę przez grupę swojego gościa; karta sieci to gość w poddrzewie grupy o nazwie\n„NETWORK CARD”; karty personelu wiszą na grupie SITE i działają na niej i wszystkich niżej; wymianę kart z partnerem\nrozstrzyga najbliższy filtr (whitelist) w linii rodziców wydawcy. Zmiana miejsca węzła w drzewie (przeniesienie\nkempingu) zmienia wszystkie te odpowiedzi.\nPakiety: `io.pillopl.group` (`Group`, `GroupService`, `GroupServiceHelper`, `GroupApiService`, `AffiliateGroupService`),\n`io.pillopl.group.attribute` (`LocalListAttributeService`, `WhitelistFilterService`, `WelcomeCardAdoptionService`),\n`io.pillopl.card` (`ValidationService`, `LocalCardListService`, `HouseCardService`), `io.pillopl.issuer`\n(`IssuerExchangeService`, `IssuerCardImportService`) — moduł `campsite-core`.\n\n\u003c!-- krok: swappable-dsl.1 -->\n## Nowe rozwiązanie\n**Archetyp Party** (poziom złożoności 3). Elementy: strony (Company — sieć, wydawcy/partnerzy, organizacje\nnadrzędne; OrganizationUnit — kemping, podgrupa wydawcy, ekipa; Person — obsługa) z `PartyId`; identyfikator\n`KARTA_RFID` (UID karty, z wydawcą jako `PartyId`), karta nie jest stroną; role (WYDAWCA_KART, MIEJSCE_ŁADOWANIA,\nOBSŁUGA, …); relacje z ważnością: UMOWA_AKCEPTACJI (wydawca → kemping wprost), PODLEGA (wydawca → organizacja\nnadrzędna), JEDNOSTKA_WYDAWCY, PRZYPISANIE_OBSŁUGI (osoba albo ekipa → kemping), CZŁONEK_EKIPY; uprawnienia\nwyprowadzane z relacji: KARTY_DZIAŁAJĄ_TU, ŁADOWANIE_OBSŁUGI, WYMIANA_KART, ZMIANA_KARTY; polityka przypisania\nidentyfikatora (zmienia tylko wydawca karty; partner nie przejmuje karty sieci).\nPytania, na które odpowiada (z `zrodlo.md`, „Questions the Model Answers”): czy karty wydawcy działają na kempingu\nsłupka (Pyt. 1); karty których wydawców przyjmuje kemping (Pyt. 2); na których kempingach działają karty wydawcy\ni z jakiego źródła (Pyt. 3); czy karta należy do obsługi z prawem na tym kempingu (Pyt. 4); czy kemping otwarty na\nkarty sieci (Pyt. 6); czy wolno wymieniać karty z partnerem (Pyt. 8); karta sieci czy partnera (Pyt. 9).\nImplementacja referencyjna: `.claude/skills/archetype-implementer/references/party-impl.md`; moduł\nhttps://github.com/Archetypy-Oprogramowania/archetypes/tree/main/party (wzór klas, bez budowania repo).\n\n\u003c!-- krok: swappable-dsl.1 -->\n## Słowniki\n- **CO** (pytania w języku problemu): karta (card), UID karty (`CardRfid`), gość (guest), wydawca kart / partner\n  (issuer, partner), organizacja nadrzędna wydawcy (parent organisation), podgrupa wydawcy (issuer unit), sieć\n  (network), karta sieci (network card), kemping (campsite), słupek (pedestal, `PedestalCode`), umowa akceptacji\n  (acceptance agreement), karty działają / przyjmuje (accepted, accepts), karta personelu / obsługi (house card, staff\n  card), osoba z obsługi, ekipa, przypisanie obsługi (staff assignment), wymiana kart z partnerem (card exchange,\n  export), własna / przejęta umowa (own / inherited).\n- **Mapowanie** (pojęcie starego modelu → element nowego rozwiązania): sieć → Company (też wydawca); wydawca kart →\n  Company + rola WYDAWCA_KART; organizacja nadrzędna → Company + relacja PODLEGA; podgrupa wydawcy → OrganizationUnit +\n  JEDNOSTKA_WYDAWCY; kemping → OrganizationUnit z rolą MIEJSCE_ŁADOWANIA; umowa akceptacji → PartyRelationship\n  UMOWA_AKCEPTACJI (wydawca → kemping wprost, z ważnością); umowa przejęta od organizacji nadrzędnej → uprawnienie\n  KARTY_DZIAŁAJĄ_TU po ścieżce PODLEGA; karta (UID) → RegisteredIdentifier KARTA_RFID z wydawcą; karta sieci → KARTA_RFID\n  z wydawcą = Sieć; karta personelu → KARTA_RFID osoby (Person) z PRZYPISANIE_OBSŁUGI do kempingu (wprost albo przez\n  ekipę: CZŁONEK_EKIPY); wymiana kart z partnerem → WYMIANA_KART z UMOWA_AKCEPTACJI(Sieć → kempingi partnera);\n  słupek → rzut na `PartyId` kempingu (słupek nie jest stroną).\n  Kodowe formy mapowania (dozwolone): `Party`, `PartyId`, `Company`, `OrganizationUnit`, `Person`, `PartyRole`,\n  `PartyRelationship`, `RegisteredIdentifier`, `issuer`, `Issuer`, `parentOrganisation`, `subsidiary`, `campsite`,\n  `Campsite`, `acceptanceAgreement`, `staffAssignment`, `crew`, `networkCard`, `NETWORK` (Sieć jako wydawca).\n  Dozwolone złożenia z CO: „parent organisation” / `parentOrganisation` (organizacja nadrzędna — nie rodzic w drzewie),\n  „issuer unit”, „inherited agreement” (umowa przejęta od organizacji nadrzędnej).\n- **Zakazany** (słowa JAK starego modelu, których nie używa port, DSL, scenariusze ani nowe rozwiązanie): grupa\n  (`group`, `Group`, `GROUP`, `groupId`, `GroupId`, `guestGroup`, `issuerGroup`, `siteGroup`, `GroupType`), drzewo\n  (`tree`, `Tree`, `TREE`), rodzic / przodek (`parent`, `Parent`, `parentGroup`, `parentLine`, `ancestor`), poddrzewo\n  (`subtree`, `Subtree`, `collectSubtree`), najbliższy w górę (`nearest`, `Nearest`), typy drzew `SITE`, `ISSUER`,\n  `STAFF` (UPPER_CASE jako typ grupy), nazwa grupy kart sieci `NETWORK CARD`, prefiks nazwy (`prefix`, `PREFIX_AFFILIATE`,\n  `AFFILIATE`), atrybut grupy (`attribute`, `Attribute`), filtr wymiany (`whitelist`, `Whitelist`, `WhitelistFilter`,\n  `filter` w znaczeniu filtra wymiany), lista związanych grup (`associatedGroup`, `ASSOCIATEDGROUP`), `manageable`\n  (zakres jako poddrzewo).\n  Uwaga: `region` / rynek (market) to słowa domeny, nie mechanizmu — nie są zakazane, ale nowe rozwiązanie ich nie\n  wyraża (patrz „Poza nowym rozwiązaniem”), więc port i scenariusze ich nie potrzebują.\n\n\u003c!-- krok: swappable-dsl.1 -->\n## Kandydaci\nWiersze „Co i jak” ze źródła złączone z `analiza/drzewo-grup/crossing.json` (`asks`) i z bolączkami (kształt odpowiedzi\nz linii „odpowiedź:” przy wołającym w `zrodlo.md`; `crossing.json` nie ma pola `answer`). `plik:linia` = linia ze źródła\n(zwykle deklaracja metody); linię pytania ustala krok 2.\n\n| CO | Wołający (plik:linia) | JAK stare | JAK w nowym rozwiązaniu | Odpowiedź | Skąd (bolączka / źródło) |\n|---|---|---|---|---|---|\n| Gość przykłada kartę do gniazda na słupku: czy wydawca jego karty ma umowę obejmującą kemping, na którym stoi słupek? | `ValidationService.isCardAcceptedAt` (`campsite-core/src/main/java/io/pillopl/card/ValidationService.java:381`), woła ją `validateFor` (:261) | przelotka do `GroupService.isCardAcceptedAt(pedestalId, card)`: karta bez gościa → nie; lista kempingów z najbliższej niepustej listy umów wydawcy (poddrzewa); słupek nieskasowany w jednej z nich | KARTA_RFID → wydawca; słupek → kemping; KARTY_DZIAŁAJĄ_TU = umowy wydawcy ∪ umowy organizacji po PODLEGA | `boolean` — tak: słupek stoi na kempingu objętym umową wydawcy karty | B1, B3; Q1; Co i jak w. 1; crossing `asks: yes` |\n| Na których kempingach działają karty wydawcy (odpowiedź pośrednia przy przyłożeniu karty i na ekranie umów) | `GroupServiceHelper.extractAllAcceptingGroupIds` (`campsite-core/src/main/java/io/pillopl/group/GroupServiceHelper.java:52`) — metoda statyczna; wołają ją `GroupService.isCardAcceptedAt` i `GroupApiService.toAgreementDTO` (:277) | najbliższa w linii niepusta lista umów (wyższe zastępowane), każda pozycja → całe poddrzewo, lista bez powtórzeń | karta uprawnień wydawcy: kempingi z umów własnych ∪ umów organizacji wyżej; źródło przy pozycji | `List\u003cLong>` — id kempingów i regionów z całym poddrzewem (id z bazy legacy) | B1, B3; Q1; Co i jak w. 2; crossing `asks: partly` |\n| Słupek dostaje listę kart, które ma wpuszczać sam: karty których wydawców przyjmuje kemping tego słupka? | `LocalCardListService.buildLocalCardList` (`campsite-core/src/main/java/io/pillopl/card/LocalCardListService.java:138`) | gdy lista przyjmuje karty gości: `groupService.findIssuerGroupIdsAcceptedAt(grupa słupka)` (rekurencyjny SQL, najbliższy właściciel listy umów każdego wydawcy, umowa obejmuje grupę słupka albo przodka) → ważne karty tych wydawców | odwrotne UMOWA_AKCEPTACJI (to = kemping) → strony umów → PODLEGA w dół | `List\u003cLong>` — wydawcy (id grup z bazy legacy), których umowa własna albo przejęta obejmuje kemping słupka | B1, B3; Q2; Co i jak w. 3; crossing `asks: yes` |\n| Słupek dostaje listę kart, które ma wpuszczać sam: które karty personelu mają na niej być? | `LocalCardListService.buildLocalCardList` (`campsite-core/src/main/java/io/pillopl/card/LocalCardListService.java:138`) | gdy lista przyjmuje karty personelu: `houseCardService.getHouseCardsForPedestal(kod)` = aktywne karty grupy słupka i wszystkich przodków | PRZYPISANIE_OBSŁUGI (to = kemping, ważne dziś) → osoby wprost albo przez ekipę → ich KARTA_RFID | `List\u003cHouseCard>` — aktywne karty personelu kempingu słupka i organizacji nad nim | B1, B3; Q4; Co i jak w. 4; crossing `asks: yes` |\n| Przy wymianie z partnerami: czy kartę tego gościa wolno przekazać właśnie temu partnerowi? | `IssuerExchangeService.exportCards` (`campsite-core/src/main/java/io/pillopl/issuer/IssuerExchangeService.java:198`) | dla każdego partnera i karty `WhitelistFilterService.isSynchronizableForExport(grupa gościa, partner)`: najbliższy filtr eksportowy w linii rodziców celujący w partnera; brak = tak | WYMIANA_KART z UMOWA_AKCEPTACJI(Sieć → kempingi partnera); wyjątek jako nadanie wprost | `boolean` — tak: kartę wolno wysłać temu partnerowi | B3; Q15; Co i jak w. 6; crossing `asks: yes` |\n| Partner przysyła kartę, którą już znamy: czy to karta sieci? Jeśli tak, zmiana jest odrzucona. | `IssuerCardImportService.isNetworkCard` (`campsite-core/src/main/java/io/pillopl/issuer/IssuerCardImportService.java:187`), woła ją `importCard` (:81) | karta bez grupy gościa → nie; inaczej poddrzewo grupy o nazwie „NETWORK CARD” zawiera grupę gościa | KARTA_RFID z wydawcą = Sieć; polityka przypisania (b) | `boolean` — tak: to karta sieci | B1; Q16; Co i jak w. 7; crossing `asks: yes` |\n\nOdpadły: „Co i jak” w. 5 (Q12, `LocalCardListService.buildLocalCardList` — cała lista, pojemność i kolejność):\n„archetyp na to nie odpowiada”. Wiersze crossingu z `asks: no` (`GroupService.extractAllAcceptingSiteGroupIds`,\n`isAcceptedAt`, `isCardAcceptedAt(kod)`, `PedestalService.findPedestalsForGuest`) nie są w „Co i jak”, a i tak\n„nikt nie woła”.\n\n\u003c!-- krok: swappable-dsl.1 -->\n## Zmiany zachowania według źródła\n**W odpowiedziach** (na pytania kandydatów; i tak budujemy dzisiejsze zachowanie, człowiek potwierdza w kroku 4):\n- **Z1. Umowy się sumują.** Źródło: karty działają na kempingach z umów własnych wydawcy **i** umów organizacji\n  nadrzędnej („Zadar, Rovinj i Pula — umowy się sumują”, Otwarte 1). Dziś: własna niepusta lista umów zasłania umowy\n  wyżej (`GroupServiceHelper.java:52`, `GroupApiService.java:277`). Dotyczy: przyłożenie karty, kempingi wydawcy,\n  wydawcy przyjmowani na kempingu.\n- **Z2. Umowa wymienia kempingi wprost.** Źródło: umowa „na region” rozwija się przy zawarciu na listę kempingów\n  i nie śledzi składu regionu (Otwarte 2). Dziś: umowa z regionem obejmuje całe bieżące poddrzewo (przeniesiony\n  kemping wypada albo dochodzi). Bez przenoszenia odpowiedź ta sama; dotyczy tych samych pytań co Z1.\n- **Z3. Karta personelu tylko z przypisania do kempingu.** Źródło: karta osoby z obsługi działa tam, gdzie osoba\n  (albo jej ekipa) jest przypisana; dozorca nie ładuje u sąsiada z regionu. Dziś: aktywne karty personelu grupy\n  słupka **i wszystkich przodków** (karta wydana na region działa na każdym kempingu regionu, CAMP-211). Dotyczy:\n  karty personelu na liście słupka.\n- **Z4. Wymiana z partnerem z umów.** Źródło (Z — wariant roboczy, bez potwierdzenia): kartę sieci wysyłamy\n  partnerowi, gdy sieć ma umowę z kempingami partnera; wyjątki nadawane wprost. Dziś: najbliższy filtr eksportowy\n  w linii rodziców grupy gościa; brak filtra = tak (bez umowy też wysyłamy). Dotyczy: eksport kart.\n- **Z5. Ważność relacji.** Źródło: umowy i przypisania mają ważność od–do; po ścieżce PODLEGA część wspólna\n  (Z — wariant roboczy). Dziś umowy ani karty personelu z grupy nie mają dat (karta personelu ma tylko „aktywna”).\n  Bez dat w świecie odpowiedź ta sama.\n- **Z6. Źródło przy odpowiedzi.** Źródło: odpowiedź „tak/nie plus która umowa”, przy każdym kempingu źródło (własna /\n  przez organizację). Dziś: samo tak/nie i jedna flaga „przejęta” na wydawcę. Port zostaje przy dzisiejszym kształcie.\n\n**W skutkach komend** (tylko do wiadomości — workflow komend nie robi):\n- przeniesienie kempingu do innego regionu nie zmienia żadnej relacji (dziś zmienia odpowiedzi na wszystkie pytania wyżej);\n- tryb dostępu kempingu niezależnego = istnienie UMOWA_AKCEPTACJI(Sieć → kemping) zamiast przepięcia rodzica\n  (Z — wariant roboczy);\n- przejęcie karty powitalnej zmienia posiadacza identyfikatora zamiast zapisu karty personelu na grupie;\n- zmiana karty przy imporcie: wolno wydawcy karty, jego jednostkom i podmiotom zależnym (dziś: poddrzewo grupy\n  wydawcy partnera; przeniesienie grupy gościa zmienia odpowiedź);\n- zakończenie PODLEGA odbiera uprawnienia z tej ścieżki, umowy własne zostają.\n\n\u003c!-- krok: swappable-dsl.4 -->\n### Potwierdzenia (krok 4)\nPrzebieg bez człowieka (decyzja automatyczna). Nowe rozwiązanie we wszystkich przypadkach odpowiada po staremu.\n\n| Zmiana | Miejsca | Potwierdzenie |\n|---|---|---|\n| Z1 umowy się sumują | M1 | nierozstrzygnięte — zostaje dzisiejsze (reguła „własne umowy zastępują przejęte”, scenariusz `own_agreements_of_issuer_unit_replace_the_inherited_ones`) |\n| Z2 umowa wymienia kempingi wprost | M1 | nierozstrzygnięte — zostaje dzisiejsze (świat rozpisuje umowę „na region” na kempingi regionu, także dodane później); bez przenoszenia kempingów odpowiedź ta sama |\n| Z3 karta obsługi tylko z przypisania do kempingu | M4 | nierozstrzygnięte — zostaje dzisiejsze (świat rozpisuje kartę wydaną na region na przypisania do każdego kempingu regionu; scenariusz `staff_card_issued_for_the_region_…`) |\n| Z4 wymiana z partnerem z umów | M2 | nierozstrzygnięte — zostaje dzisiejsze (bez nadania wprost: tak; umowy sieci z kempingami partnera nie są czytane) |\n| Z5 ważność relacji | M1, M4 | nierozstrzygnięte — zostaje dzisiejsze; relacje w świecie zawsze ważne, ważność ma tylko identyfikator karty obsługi (nieaktywna = ważność zakończona) |\n| Z6 źródło przy odpowiedzi | M1–M4 | nie dotyczy wybranych miejsc — port zostaje przy tak/nie i zbiorze UID |\n\n\u003c!-- krok: swappable-dsl.1 -->\n## Poza nowym rozwiązaniem\n- region i rynek (grupowanie do raportów i rozliczeń) — w tym umowa „na region” jako forma zawarcia;\n- drzewo grup i reguła „najbliższe ustawienie wyżej”;\n- słupek, gniazdo, stanowisko, sekcja, budżet mocy (słupek tylko jako rzut na kemping);\n- lokalna lista kart, jej pojemność i kolejność (czy słupek trzyma listę, co wypada);\n- pula kart powitalnych kraju;\n- ważność i blokada karty, płatność QR (reszta decyzji o prądzie);\n- rozliczenia i raport rozliczeniowy wydawcy;\n- treść i warunki umowy akceptacji poza tym, gdzie działają karty;\n- statusy synchronizacji wymiany i format plików wymiany.\n\n\u003c!-- krok: swappable-dsl.2 -->\n## Miejsca\nKontrakt miejsc: [`miejsca.md`](miejsca.md). Od kroku 3 workflow pracuje tylko na nim.\nWybrane 4 miejsca u 4 różnych wołających: M1 przyłożenie karty (`ValidationService.validateFor`), M2 eksport karty do\npartnera (`IssuerExchangeService.exportCards`), M3 karta sieci przy imporcie (`IssuerCardImportService.importCard`),\nM4 karty personelu na liście słupka (`LocalCardListService.buildLocalCardList`). Odrzuceni: kandydaci w. 2 i 3\n(odpowiedź w id z bazy legacy) — powody w `miejsca.md`.\n\n\u003c!-- krok: swappable-dsl.3 -->\n## Port i świat\nPakiet `io.pillopl.acceptance` w `campsite-core` (moduł wszystkich czterech wołających), przedrostek `Acceptance`.\n\n**Port** `CardAcceptance` (jeden na obszar, metoda na pytanie):\n\n| Miejsce | Metoda | Odpowiedź |\n|---|---|---|\n| M1 | `boolean cardWorksAt(CardRfid card, PedestalCode pedestal)` | tak: karty wydawcy karty działają na kempingu słupka |\n| M2 | `boolean cardMayGoToPartner(CardRfid card, PartnerName partner)` | tak: kartę wolno wysłać temu partnerowi |\n| M3 | `boolean isNetworkCard(CardRfid card)` | tak: to karta sieci; karta nieznana → nie (wołający pyta tylko o znaną) |\n| M4 | `StaffCards staffCardsAt(PedestalCode pedestal)` | rekord `StaffCards(Set\u003cCardRfid> cards)` — UID-y kart personelu na liście słupka |\n\n`PartnerName` — nowy typ wartości w pakiecie portu (projekt nie ma typu na nazwę partnera; adapter legacy tłumaczy ją\nprzez `IssuerPartnerDao.findByName`). `CardRfid`, `PedestalCode` — typy projektu.\n\n**Odpowiedź-lista (M4).** Kolejność bez znaczenia (porównujemy jako zbiory; wołający sam sortuje „ostatnio używane\npierwsze” przy ucinaniu). Elementy, których port nie nazywa: legacy zwraca **wszystkie aktywne karty domowe**, także\nkarty wypożyczane gościom (typ RENTAL) — port mówi „karty personelu”, świat zakłada tylko karty personelu; różnica\npoza scenariuszami. UID karty domowej w legacy to dowolny tekst, a `CardRfid` przyjmuje tylko cyfry — karta domowa\nz UID-em niecyfrowym wywróci adapter (do sprawdzenia w kroku 5 na danych seedu i w bazie). Dwie aktywne karty o tym\nsamym UID dają jeden element (zbiór), a wołający dociąga encje po UID — zapis w kroku 5.\n\n**Adapter legacy** `LegacyCardAcceptance` (`@Component`, odczyt w transakcji tylko do odczytu):\n- M1: słupek po kodzie (`PedestalDao.findByCode`), karta po UID (`CampingCardDao.findByCardRfid`) →\n  `GroupService.isCardAcceptedAt(id słupka, karta)` — to samo wywołanie co `ValidationService.isCardAcceptedAt`.\n- M2: karta po UID, partner po nazwie → `WhitelistFilterService.isSynchronizableForExport(…, partner)`. Wołający ma\n  encję karty z `findCardsForPartnerExport`; adapter bierze najnowszą żywą kartę o tym UID — przy UID wydanym dwa\n  razy może trafić inną kartę (zapis w kroku 5).\n- M3: `card != null && isNetworkCard(card)` — linie `IssuerCardImportService.isNetworkCard` powtórzone w adapterze\n  (te same wywołania `GroupService`), bo adapter nie może zależeć od wołającego, w który zostanie wpięty (cykl\n  zależności w kroku 5). Bez szwu w legacy.\n- M4: `HouseCardService.getHouseCardsForPedestal(kod)` → UID-y.\n\n**Świat** `AcceptanceWorld` (pakiet `io.pillopl.acceptance.world`, zwykła klasa, transakcję daje test albo seeder):\n`region`, `campsiteIn(region, kemping)`, `pedestalAt(kemping, kod)`, `issuer`, `issuerUnit(wydawca, jednostka)`,\n`agreementWithCampsite`, `agreementWithRegion`, `guestCard(uid, wydawca)`, `cardWithoutGuest(uid)`,\n`partner` (partner jest też wydawcą swoich kart), `cardsNotSentTo(wydawca, partner)`, `cardsNotSentToAnyPartner`,\n`cardsSentTo(wydawca, partner)`, `staffCard(uid, kemping)`, `staffCardOfRegion(uid, region)`,\n`inactiveStaffCard(uid, kemping)`. Stała `NETWORK` = sieć jako wydawca (istnieje w każdym świecie).\n\n**`LegacyAcceptanceWorld`** zasila stary model: zachowaniem produkcyjnym tam, gdzie serwis nie wymaga zalogowanego\nużytkownika konsoli — `GroupManager.createChildGroup` / `addAcceptanceAgreement` (region, kemping, wydawca,\njednostka, umowy) i `WhitelistFilterService.saveFilter` (wyjątki i nadania wymiany, typ EXPORT); repozytoriami tam,\ngdzie serwis produkcyjny wymaga użytkownika konsoli albo go nie ma — gość i karta (`GuestDao`, `CampingCardDao`),\npartner (`IssuerPartnerDao`, z `validate()`; `IssuerApiService.saveIssuerPartner` wymaga uprawnienia CONFIG_EDIT),\nkarta personelu (`HouseCardDao`; `HouseCardService.saveHouseCard` wymaga właściciela kempingu), słupek z gniazdem\n(`PedestalDao`, `PedestalTypeDao`, `LocationDao`, jak fixture testów). Wszystko pod korzeniami rynku HR z seedu\nmigracji (`HR SITES`, `HR ISSUERS`, `NETWORK CARD`). Sieć = istniejąca grupa kart sieci.\n\nRegion jest w świecie, choć nowe rozwiązanie go nie wyraża („Poza nowym rozwiązaniem”): dzisiejsze odpowiedzi M1\n(umowa na region) i M4 (karta personelu wydana na region) od niego zależą, więc scenariusze go potrzebują; nowy\nświat musi go odwzorować (np. umowa na region rozwinięta przy zawarciu na kempingi — Z2).\n\n\u003c!-- krok: swappable-dsl.3 -->\n## Scenariusze\n`AcceptanceScenarios` (interfejs z domyślnymi testami), sterownik `AcceptanceLegacyDriver`, test\n`AcceptanceLegacyScenariosTest` (integracyjny, `IntegrationTest` + Testcontainers, transakcja na scenariusz otwierana\ni wycofywana ręcznie). Wybrzeże (`coast`): region Dalmatia z kempingami Zadar i Split, region Istria z kempingiem\nRovinj, po słupku na kempingu. Na legacy: 20/20 zielone.\n\n| Miejsce | Scenariusz | Given | When / then |\n|---|---|---|---|\n| M1 | card_works_at_campsite_its_issuer_has_an_agreement_with | wydawca z umową z Zadarem, karta gościa wydawcy | przy słupku w Zadarze → tak |\n| M1 | card_does_not_work_at_campsite_without_agreement | j.w. | Split, Rovinj → nie |\n| M1 | agreement_for_a_region_covers_every_campsite_in_it | umowa na region Dalmatia | Zadar, Split → tak; Rovinj → nie |\n| M1 | card_of_issuer_unit_works_where_its_issuer_has_an_agreement | jednostka wydawcy, umowa wydawcy z Zadarem, karta jednostki | Zadar → tak |\n| M1 | own_agreements_of_issuer_unit_replace_the_inherited_ones | jak wyżej + umowa jednostki z Rovinj | Rovinj → tak; Zadar → nie (dzisiejsze; źródło: Z1) |\n| M1 | card_of_issuer_without_agreements_works_nowhere | wydawca bez umów | Zadar → nie |\n| M1 | card_handed_to_no_guest_works_nowhere | karta bez gościa | Zadar → nie |\n| M2 | network_card_goes_to_partner_without_exception | partner Adria, karta sieci | do Adrii → tak |\n| M2 | exception_for_a_partner_keeps_network_cards_from_that_partner_only | jednostka sieci z wyjątkiem „nie do Adrii”, karta jednostki | Adria → nie; Alpine → tak |\n| M2 | exception_for_every_partner_keeps_network_cards_from_all | wyjątek „do żadnego partnera” | Adria, Alpine → nie |\n| M2 | exception_of_the_issuer_covers_the_cards_of_its_units | wyjątek na jednostce, karta jej podjednostki | Adria → nie |\n| M2 | permission_granted_to_a_unit_replaces_the_exception_of_its_issuer | jednostka: „do żadnego”; podjednostka: „do Adrii wolno” | karta podjednostki: Adria → tak, Alpine → nie; karta jednostki: Adria → nie |\n| M3 | card_of_the_network_is_a_network_card | karta sieci | → tak |\n| M3 | card_of_a_network_unit_is_a_network_card | karta jednostki sieci | → tak |\n| M3 | card_of_a_partner_is_not_a_network_card | karta partnera | → nie |\n| M3 | card_handed_to_no_guest_is_not_a_network_card | karta bez gościa | → nie |\n| M4 | active_staff_cards_of_the_campsite_are_on_the_list | dwie karty personelu Zadaru | lista słupka w Zadarze = obie |\n| M4 | inactive_staff_card_is_not_on_the_list | aktywna i nieaktywna karta Zadaru | = tylko aktywna |\n| M4 | staff_card_of_another_campsite_is_not_on_the_list | karta personelu Splitu | Zadar = pusta |\n| M4 | staff_card_issued_for_the_region_is_on_the_list_of_every_campsite_in_it | karta personelu regionu Dalmatia | Zadar, Split = ta karta; Rovinj = pusta (dzisiejsze; źródło: Z3) |\n\nGrep słownika zakazanego (`grep -rnw`, formy kodowe z „Słowniki”) po porcie, `PartnerName`, `StaffCards`,\n`AcceptanceWorld`, DSL i scenariuszach: zero trafień.\n\n\u003c!-- krok: swappable-dsl.4 -->\n## Nowe rozwiązanie w kodzie\nModuł `campsite-party` (pakiet `io.pillopl.party`, bez zależności od reszty projektu — także od typów wartości),\n`CLAUDE.md` modułu. Wzór klas: `examples/party-minimal/` + rekordy `Validity` i `RegisteredIdentifier` z referencji\n(`party-impl.md`); bez `Result`, zdarzeń, wersji, polityk ról/relacji, adresów i capabilities.\n\n| Klasa | Element specyfikacji | Uwagi |\n|---|---|---|\n| `PartyId`, `Party` (`PartyKind`: COMPANY / ORGANIZATION_UNIT / PERSON) | strony: Company, OrganizationUnit, Person | jedna klasa z rodzajem zamiast hierarchii sealed (minimalny zestaw) |\n| `Role` | role: NETWORK_OPERATOR (sieć), CARD_ISSUER (WYDAWCA_KART), CHARGING_PLACE (MIEJSCE_ŁADOWANIA), CAMPSITE_SERVICE (OBSŁUGA) | NETWORK_OPERATOR — element techniczny: po nim model rozpoznaje Sieć (M3) |\n| `PartyRelationship` + `RelationshipName`, `Validity` | UMOWA_AKCEPTACJI (ACCEPTANCE_AGREEMENT), JEDNOSTKA_WYDAWCY (ISSUER_UNIT_OF), PODLEGA (SUBSIDIARY_OF), PRZYPISANIE_OBSŁUGI (STAFF_ASSIGNMENT) | SUBSIDIARY_OF w modelu, świat go nie używa (scenariusze nie mają organizacji nadrzędnej poza jednostką) |\n| `RegisteredIdentifier` (CARD_RFID) | KARTA_RFID z wydawcą (karta gościa — na wydawcy) / osoby (karta obsługi — na osobie) | ważność identyfikatora = „aktywna” karta obsługi |\n| `DirectGrant` (CARD_EXCHANGE) | wyjątki wymiany „nadawane wprost” | także nadanie „do każdego partnera” (`towards` puste) — element dodany do starego zachowania |\n| `CardRights` | uprawnienia KARTY_DZIAŁAJĄ_TU, WYMIANA_KART, ŁADOWANIE_OBSŁUGI; „karta sieci” | reguły starego zachowania niżej |\n| `Parties`, `PartyConfiguration.inMemory()` | rejestr w pamięci, composition root | elementy techniczne wymuszone przez port |\n\nPo stronie portu (campsite-core): `PartyProjection` (rzut słupka na kemping i nazwy partnera na stronę — wspólny dla\nświata i adaptera), `PartyCardAcceptance` (adapter, nie bean — wpięcie w kroku 5), `world/PartyAcceptanceWorld`;\ntesty: `AcceptancePartyDriver`, `AcceptancePartyScenariosTest` (bez Springa, model i rzut nowe na scenariusz).\nScenariusze na nowym modelu: 20/20 zielone za pierwszym podejściem; izolacja (grep importów `io.pillopl` spoza\n`io.pillopl.party` w module) — pusto; grep słownika zakazanego — trafienia tylko `filter` jako metoda strumienia Javy\n(`Stream.filter`, nie filtr wymiany) i złożenie dozwolone „parent organisation” w komentarzu.\n\n**Reguły starego zachowania (nazwane w języku modelu):**\n- „własne umowy zastępują przejęte” — umowy pierwszej strony z jakąkolwiek umową, idąc od wydawcy przez ISSUER_UNIT_OF /\n  SUBSIDIARY_OF w górę (Z1); scenariusz `own_agreements_of_issuer_unit_replace_the_inherited_ones`;\n- „własne nadanie wymiany zastępuje przejęte”, bez nadania — wolno (Z4); scenariusze M2;\n- umowa i karta obsługi „na region” rozpisane przez świat na kempingi regionu, także dodane do regionu później (Z2, Z3) —\n  region zostaje poza modelem; dopisywanie kempingu dodanego później: **niesprawdzona scenariuszem**;\n- „nieaktywna karta obsługi” = identyfikator z zakończoną ważnością.\n\n**Nie użyto:** CZŁONEK_EKIPY / ekipa (świat nie ma komendy ekipy), polityka przypisania identyfikatora (zmiana karty —\nkomenda), ważność relacji poza identyfikatorem (Z5), źródło przy odpowiedzi (Z6), umowy Sieci z kempingami partnera\njako źródło WYMIANA_KART (Z4).\n\n\u003c!-- krok: swappable-dsl.4 -->\n### Różnice poza scenariuszami\n- **M1/M4 przeniesienie kempingu**: stary model liczy umowy „na region” i karty obsługi regionu po bieżącym składzie\n  regionu; nowy — po relacjach zapisanych przy zawarciu (świat dopisuje tylko kempingi dodane do regionu).\n- **M1 słupek skasowany / na regionie**: stary model nie przyjmuje karty przy słupku skasowanym, a słupek może wisieć na\n  regionie; świat nowego modelu ma słupki tylko na kempingach i bez kasowania.\n- **M2 jedno nadanie na wydawcę**: w starym modelu wydawca ma jeden filtr wymiany — drugi zapis go nadpisuje (także\n  partnera); nowy model trzyma wszystkie nadania i bierze pierwsze pasujące. Świat nadaje najwyżej jedno na wydawcę.\n- **M2 karta albo partner nieznani**: stary adapter rzuca NPE przy nieznanej karcie, a dla nieznanego partnera stosuje\n  tylko nadanie „do każdego partnera”; nowy odpowiada „nie” (brak). Wołający pyta tylko o znane karty i partnerów.\n- **M4 karty wypożyczane (RENTAL)**: stary model zwraca wszystkie aktywne karty domowe, nowy tylko karty obsługi.\n- **M4 dwie aktywne karty o tym samym UID**: w obu jeden element zbioru (zapis z kroku 3 bez zmian).\n- **Czas**: nowy model liczy ważność zegarem modelu (`Clock` w `PartyConfiguration`); stary „aktywna” bez dat.\n\n\u003c!-- krok: swappable-dsl.4 -->\n## Nieudane miejsca\n| Miejsce | Czego brakuje (w specyfikacji / w implementacji) | Podejścia |\n|---|---|---|\n| brak | | |\n\n\u003c!-- krok: swappable-dsl.5 -->\n## Wpięcie, przełącznik, seeder\nAbstrakcja i przełącznik jedną bramką: adapter legacy jest beanem (`@Component`), ale port ma dwie implementacje, więc\nwybór modelu (`@Primary`) powstał razem z wpięciem. Każdy wołający dostał drugi konstruktor z portem (`@Autowired`,\nwybiera go kontener); stary konstruktor zostaje, przekazuje `null` i pyta stary kod bezpośrednio (istniejące testy\nz `new …` bez zmian).\n\n| Miejsce | Wołający — linia pytania | Przez port | Stara droga (wartość z bazy, której typ portu nie przyjmie) |\n|---|---|---|---|\n| M1 | `ValidationService.isCardAcceptedAt` (wołana z `validateFor`, `card/ValidationService.java:329`) | `cardWorksAt(CardRfid karty, PedestalCode słupka)` | UID karty niecyfrowy albo kod słupka, którego `PedestalCode` nie przyjmie |\n| M2 | `IssuerExchangeService.exportCards` → `isSynchronizableForExport(card, partner)` | `cardMayGoToPartner(CardRfid, PartnerName)` | UID niecyfrowy; nazwa partnera pusta albo ze spacjami na brzegach (`PartnerName` przycina — adapter szukałby innej nazwy) |\n| M3 | `IssuerCardImportService.importCard` → `isNetworkCard(card, cardRfid)` | `isNetworkCard(CardRfid)` (UID dziesiętny po `toDecimalUid`) | UID, którego `CardRfid` nie przyjmie |\n| M4 | `LocalCardListService.buildLocalCardList` → `getHouseCardsForPedestal(pedestal)` | `staffCardsAt(PedestalCode)`, potem encje `HouseCard` dociągane po UID | kod słupka nie do przyjęcia albo karta domowa z UID-em niecyfrowym (adapter legacy rzuca `InvalidValueException` — wołający łapie i pyta starą drogą, z ostrzeżeniem w logu) |\n\n**Przełącznik startowy** `AcceptanceConfiguration` (`io.pillopl.acceptance`, campsite-core): `acceptance.model=legacy|party`\n(środowisko `ACCEPTANCE_MODEL`), domyślnie `legacy`; inna wartość zatrzymuje start. Beany: `PartyConfiguration.inMemory()`,\n`PartyProjection`, `PartyCardAcceptance` (zawsze — seeder zasila oba modele) i `@Primary CardAcceptance` = wybrany model.\nLog przy starcie: `Acceptance model: LEGACY|PARTY (acceptance.model=…) answers the card acceptance questions`.\nPrzełącznik obejmuje tylko cztery miejsca — reszta systemu pyta stary kod; na nowym modelu miejsca odpowiadają tylko\no dane z seedu (dane demo: „nie” / pusta lista).\n\n**Seed** `AcceptanceSeed.seed(AcceptanceWorld)` (pakiet świata) — te same komendy dla obu modeli: wybrzeże (Dalmatia:\nZadar, Split; Istria: Rovinj; słupki `SEED-ZADAR-P1`, `SEED-SPLIT-P1`, `SEED-ROVINJ-P1`); M1: Caravan Club (umowa z\nZadarem), jego jednostka Junior (własna umowa z Rovinj), Sea Club (umowa na Dalmację), Lonely Club (bez umów), karta bez\ngościa; M2/M3: partnerzy Kvarner Club i Alpine Club, jednostki sieci Network season (nie do Kvarner), Network corporate\n(do żadnego), Network corporate VIP (pod corporate, do Kvarner wolno), karty sieci i jednostek, karta Alpine Club; M4:\ndwie karty personelu Zadaru, nieaktywna Zadaru, karta Splitu, karta regionu Dalmacja. UID-y i nazwy jako stałe\n`AcceptanceSeed` (krok 6 i router biorą przypadki stąd). Nazwa partnera „Kvarner Club”, nie „Adria Club” jak w\nscenariuszach: demo ma już partnera `ADRIA CLUB`.\n\n**Moduł seedera** `campsite-seeder` (`io.pillopl.seeder`, profil `acceptance-seed`, łączony z demo:\n`demo,acceptance-seed`): `AcceptanceSeeder` (`SmartLifecycle`, faza 1 — po seederze demo, przed Quartzem) zasila stary\nmodel raz (znacznik: słupek `SEED-ZADAR-P1`), Party przy każdym starcie, potem `ComparisonInput`. Jak uruchomić —\n`stan.json` (`aplikacja`).\n\n**Wejście do porównania** (`ComparisonInput`, tylko stary model, poza światem, przy każdym starcie — `stan.json`\n`przygotowanie`): lista lokalna z kartami domowymi (bez kart gości) na regionach Dalmatia i Istria (M4); partnerzy seedu\nz wymianą plików V1 w `acceptance.seed.exchange-dir/\u003cpartner>`, eksport listy kart do obu (M2), import kart od Alpine\nClub (M3), kemping partnera = `HR SITES` (wymóg walidacji eksportu); katalogi partnerów czyszczone; karty sieci seedu\nznów czekają na eksport (`PARTNER_SYNC_STATE=ADD`, cel pusty — przebieg wymiany oznacza je jako wysłane); plik\n`cards-in/cards-seed.csv` Alpine Club: karta sieci i karta Network season (odrzucone jako karty sieci), karta Caravan\nClub (odrzucona: innego wydawcy), własna karta Alpine (przyjęta, zmiana idempotentna) — przebieg przenosi plik do\n`done`, więc seeder odtwarza go przy każdym starcie.\n\n**Pułapki uruchomienia:**\n- Reseed demo kasuje wszystkie wyjątki wymiany z id ≥ 1000, także seedu, a stary model zasilamy raz — start z\n  `CAMPSITE_DEMO_RESEED=false`; gdy wyjątków seedu brakuje, seeder zatrzymuje start (`SeedLost`) z tą wskazówką.\n- Job wymiany zjadłby plik importu i oznaczył karty jako wysłane — start z `SPRING_QUARTZ_AUTO_STARTUP=false`.\n- Eksport listy kart obejmuje też karty sieci z demo i partnera demo `ADRIA CLUB` (V2, adres przykładowy): na nowym\n  modelu ich nie ma, więc liczba kart wysłanych partnerowi różni się o karty demo — w kroku 6 porównujesz UID-y kart\n  seedu w pliku eksportu partnera seedu, nie całe liczby.\n\n**Adapter może znaleźć inną encję niż wołający:**\n- M2: wołający ma kartę z `findCardsForPartnerExport`; adapter bierze najnowszą żywą kartę o tym UID — przy UID\n  wydanym dwa razy może odpowiedzieć o innej karcie (bez zmian od kroku 3).\n- M4: odpowiedź to zbiór UID-ów; wołający dociąga encje `HouseCard` po UID (`findActiveByRfidAndNumber`, aktywna,\n  najniższe id na UID). Dwie aktywne karty domowe o tym samym UID (np. na kempingu i na innym kempingu) dają jedną\n  encję, możliwe że spoza linii słupka; dziś lista ma obie.\n- M1, M3: adapter szuka karty tym samym zapytaniem co wołający (`findByCardRfid`), słupka po kodzie — ta sama encja.\n\n**Kolejność odpowiedzi-zbioru (M4):** dziś karty domowe idą w kolejności zapytania bez `ORDER BY`; przez port —\nw kolejności id (decyzja: porządek deterministyczny, ten sam na obu modelach). Ucinanie „ostatnio używane pierwsze”\nbez zmian.\n\nTesty kroku: scenariusze na obu modelach (`Acceptance*ScenariosTest`, 20 + 20) i sanity `AcceptanceSeederSanityTest`\n(campsite-server, profile `demo,acceptance-seed`, `acceptance.model=party`: kontekst startuje, port = Party, oba\nmodele mają seed, plik importu czeka). `testy_krok` w fazie `package`: w fazie `test` reaktor podaje katalog\n`test-classes` campsite-core zamiast test-jara i sanity widzi dwie `@SpringBootConfiguration`.\n\n\u003c!-- krok: swappable-dsl.6 -->\n## Wejście do porównania i wyniki\nWybór: **oba** (front i API) — aplikacja ma konsolę. Każdy model to osobny start (przełącznik `ACCEPTANCE_MODEL`,\nrestart, seeder przygotowuje wejście od nowa), potem w tej kolejności: API (`ekran/api.json`, `front-compare.mjs`),\nnagranie ekranu (`ekran/story.json`, `front-story.mjs`, uruchamia też wymianę), pliki wymiany (`ekran/wymiana.mjs`).\nOdpowiedzi modelu razem: `ekran/legacy.jsonl`, `ekran/party.jsonl`. Joby wyłączone (`SPRING_QUARTZ_AUTO_STARTUP=false`).\n\n| Miejsce | Okienko | Przypadki z seedu | Co porównane |\n|---|---|---|---|\n| M1 | Karty → „Check card at socket” (dialog) + `checkCardAtSocket` | 5 kart gości × 3 słupki seedu (gniazdo 1) | status sprawdzenia z ekranu i `check.validationStatus` z API |\n| M4 | Karty → „Local card list of a pedestal” (wybór słupka) + `getLocalCardList` | 3 słupki seedu | UID-y z tabeli listy i `localCardList.entries` (zbiór) |\n| M3 | Wymiana z wydawcami → „Run exchange now” → wiersz „Alpine Club / Card import” | plik `cards-seed.csv` Alpine Club (4 linie) | „ok / odrzucone” i powody z ekranu; to samo z `findIssuerSyncStatuses` |\n| M2 | ten sam przebieg wymiany; wiersze „Card export” tylko na zrzucie | karty sieci seedu → Kvarner Club, Alpine Club | UID-y kart seedu w pliku eksportu partnera (`cards-out`), stan eksportu z API |\n\nKtóry model odpowiadał: log przy starcie `Acceptance model: LEGACY (acceptance.model=legacy) …` i\n`Acceptance model: PARTY (acceptance.model=party) …` (oba nagrania).\n\n**Wynik: 42/42 to samo** (`front-compare.mjs diff ekran/legacy.jsonl ekran/party.jsonl`); na ekranie 19/19\n(`ekran/story.html`, zrzuty w `ekran/legacy/`, `ekran/party/`, filmy `video.webm` lokalnie, poza gitem).\n- M1: Zadar — Caravan Club i Sea Club przyjęte; Split — tylko Sea Club; Rovinj — tylko Caravan Club Junior; Lonely Club\n  nigdzie. Karta bez gościa (`880000105`) nie dochodzi do pytania: konsola odmawia wcześniej (`NOT_AUTHORIZED`, „no\n  access to card”) — ta sama odmowa na obu modelach, o M1 nic nie mówi; dla niej zostają scenariusze.\n- M4: Zadar 401, 402, 405; Split 404, 405; Rovinj pusta lista (Istria bez kart personelu).\n- M2: do Kvarner Club 201 i 204, do Alpine Club 201 i 202 (corporate 203 do nikogo).\n- M3: 1 przyjęta / 3 odrzucone — dwie „exists as a network card already”, jedna „imported from another issuer already”.\n\nCzego nagranie nie dowodzi: odpowiedzi o danych spoza seedu (karty i słupki demo — na Party „nie” / pusta lista,\ndlatego liczby „Items ok” eksportu nie są porównywane: obejmują karty demo, a przebieg na starym modelu oznacza je jako\nwysłane); zachowania jobów (wyłączone); reszty aplikacji (stary model zawsze); przypadku dwóch kart o tym samym UID\n(M2, M4 — seed go nie ma).\n\n\u003c!-- krok: parallel-model-router.1 -->\n## Flaga\n**Co projekt już ma.** Bibliotek flag brak (`pom.xml`-e, `campsite-console/package.json`: ani Togglz/FF4J/Unleash/\nOpenFeature, ani `@RefreshScope`). Jest tabela `SYSTEM_PROPERTY` (`SystemProperty`, klucz = wartość enumu\n`SystemPropertyKey` zapisana tekstem) z cache w `SystemPropertyService` (mapa w pamięci, ładowana przy pierwszym\nodczycie, przeładowywana przy `setProperty` i `reloadSystemProperties`). Zmiana z konsoli: Administracja → „System\nproperties (SYSTEM_PROPERTY)” → Edit (`/api/console/administration/setSystemProperty`, prawo `CONFIG_EDIT`, audyt\n`CONFIG_CHANGE` „'stara' -> 'nowa'”); przycisk „Reload configuration” przeładowuje cache węzła. Ekran pokazuje każdy\nklucz enumu (`AdministrationMapper.toSystemPropertyDTOs` iteruje `values()`; klucz bez wiersza = „default”), pusta\nwartość z ekranu = domyślna z kodu. Precedens routingu per obiekt: `PowerSection.algorithmBeanName` (bean wybierany\npo nazwie zapisanej w rekordzie) — nie dotyczy pytań portu (nie mają rekordu, który wskazywałby model).\nObecny przełącznik `acceptance.model` (`AcceptanceConfiguration`) jest startowy — zmiana wymaga restartu.\n\n**Opcje:**\n\n| Opcja | Zmiana bez redeployu | Co rusza w legacy | Ocena |\n|---|---|---|---|\n| **A. `SYSTEM_PROPERTY`** — dwa nowe klucze w `SystemPropertyKey` | tak, po jednym deployu z nowymi kluczami; od razu na węźle, który zapisał | `SystemPropertyKey` (+2 wartości enumu); bez migracji (ekran pokazuje klucz bez wiersza), bez nazwanych getterów | **rekomendacja**: istniejący mechanizm, ekran, audyt i prawo za darmo |\n| B. Togglz z `JDBCStateRepository` na bazie projektu + konsola Togglz | tak | nowa zależność w `pom.xml`, nowa tabela (migracja), nowa konsola i jej zabezpieczenie | nowa biblioteka w legacy, choć mechanizm już jest |\n| C. Zostaje `acceptance.model` (start) | nie — restart | nic | odpada: wymaga redeployu/restartu, choć da się bez (stop kroku) |\n\n**Wybór (rekomendacja): A, reguła — sama wajcha.** Pytania portu (`cardWorksAt`, `cardMayGoToPartner`, `isNetworkCard`,\n`staffCardsAt`) nie niosą pojęcia, po którym warto by dzielić ruch na etapie badania hipotezy (wydawca / kemping dałyby\nsię wyznaczyć tylko w M1 i M2, nie w M3 i M4) — jedna wajcha dla wszystkich czterech miejsc.\n\n**Klucze** (`\u003cObszar>` = `Acceptance`, pakiet portu):\n- `AcceptanceAnswer` = `legacy` | `party` — który model odpowiada wołającym. Brak wiersza albo pusta wartość →\n  wartość przełącznika startowego `acceptance.model` (domyślnie `legacy`). Inna wartość → jak brak, z ostrzeżeniem\n  w logu (wajcha nie zatrzymuje pytań).\n- `AcceptanceCompare` = `true` | `false` — czy pytać też drugi model i zapisywać różnice. Brak / pusty / inna wartość\n  → `false`.\n- Klucza reguły brak (sama wajcha). Reakcja na różnicę: `log` (tylko wpis do pliku różnic, `reconciliation.md`).\n\nOdczyt przez istniejące ogólne `getProperty(klucz, null)` i parsowanie w wajchy (`AcceptanceLever`) — nie przez\n`getPropertyBoolean` (na pustym napisie z ekranu logowałby błąd przy każdym pytaniu). Konwencji „każdy klucz ma nazwany\ngetter w `SystemPropertyService`” nie rozszerzamy: flaga jest przejściowa i zniknie razem z jednym z modeli; dwa gettery\nw serwisie legacy byłyby kolejną zmianą do wycofania.\n\n**Jak zmienia człowiek:** konsola, Administracja → System properties → filtr „Acceptance” → Edit → wartość (`party` /\n`legacy`, `true` / `false`) → Save; audyt `CONFIG_CHANGE`. Powrót: wartość `legacy` albo pusta. Bez konsoli: ten sam\nendpoint `setSystemProperty` (curl z sesją konsoli) albo SQL na `SYSTEM_PROPERTY` + „Reload configuration”.\n\n**Ile trwa:** węzeł, który zapisał, widzi zmianę przy następnym pytaniu (`setProperty` przeładowuje cache). Cache jest\nper węzeł: przy kilku węzłach pozostałe widzą zmianę dopiero po „Reload configuration” na każdym z nich (albo\nrestarcie) — konfiguracja w repo opisuje jeden węzeł aplikacji. SQL bez „Reload configuration” nie działa do restartu.\n\n**Ograniczenia:** nowe klucze wymagają jednego deployu (enum); wajcha obejmuje tylko cztery miejsca z `miejsca.md`;\nstan wajchy w bazie przeżywa restart (przy ponownym starcie ustaw jawnie, jeśli trzeba wrócić do startowego).\n\n\u003c!-- krok: parallel-model-router.2 -->\n## Router\n`CardAcceptanceRouter` (`io.pillopl.acceptance`, campsite-core) — trzecia implementacja portu `CardAcceptance`,\n`@Primary` w `AcceptanceConfiguration` zamiast przełącznika startowego. Oba adaptery (`LegacyCardAcceptance`,\n`PartyCardAcceptance`) bez zmian; port, scenariusze i modele bez zmian.\n\n| Wajcha (`AcceptanceAnswer` / `AcceptanceCompare`) | Kto odpowiada wołającemu | Drugi model | Do pliku różnic |\n|---|---|---|---|\n| brak / pusta / nieznana, `false` | model startowy `acceptance.model` (domyślnie legacy) | nie pytany | nic |\n| `legacy`, `false` | stary model | nie pytany | nic |\n| `legacy`, `true` | stary model | Party, pytany w osobnej transakcji | różnica, gdy odpowiedzi różne |\n| `party`, `true` | Party | stary model, w osobnej transakcji tylko do odczytu | różnica, gdy odpowiedzi różne |\n| `party`, `false` | Party | nie pytany | nic |\n\n- **Wajcha** `AcceptanceLever` czyta oba klucze przy każdym pytaniu (`SystemPropertyService.getProperty`, mapa w\n  pamięci). Reguła: sama wajcha, wspólna dla M1–M4. Router loguje każdą zmianę pozycji przy pierwszym pytaniu po niej:\n  `Acceptance lever: PARTY with comparison answers the card acceptance questions (was: LEGACY without comparison)`.\n  Przy starcie: `Acceptance model: LEGACY (acceptance.model=legacy) answers … until the lever AcceptanceAnswer is moved`.\n- **Wyjątki.** Wyjątek modelu, który odpowiada, dochodzi do wołającego bez zmian (np. `InvalidValueException`\n  adaptera legacy w M4 — wołający dalej łapie go i pyta starą drogą). Wyjątek modelu, który nie odpowiada, idzie\n  tylko do pliku różnic (`\"legacy\": {\"error\": \"…\"}`). Router nie udaje odpowiedzi.\n- **Transakcja przy porównaniu.** Model, który nie odpowiada, pytany jest przez `TransactionTemplate`\n  `REQUIRES_NEW` + `readOnly` (adapter legacy ma `@Transactional(readOnly = true)` na klasie — w transakcji wołającego\n  jego wyjątek oznaczyłby ją do wycofania). Skutki: (1) osobne połączenie z puli na każde porównane pytanie (eksport\n  M2 pyta w pętli po kartach); (2) stary model jako drugi nie widzi niezatwierdzonych zmian wołającego — gdy wołający\n  coś zapisał przed pytaniem w tej samej transakcji, różnica może być pozorna; (3) w testach, w których świat żyje\n  w niezatwierdzonej transakcji (scenariusze legacy), router trzeba zbudować z `TransactionOperations.withoutTransaction()`\n  — inaczej stary model jako drugi nie widzi świata (krok 4).\n- **Rekonsyliacja** `AcceptanceReconciliation` (porównanie: odpowiedzi tak/nie wprost, `StaffCards` jako zbiory UID-ów,\n  wyjątek po jednej stronie = różnica, ten sam typ wyjątku po obu = zgodne); zgodne tylko liczone (`summary()`: zgodne /\n  różne, łącznie i per pytanie, od startu węzła, w pamięci), różnice do pliku przez `AcceptanceReconciliationLog`;\n  `recent(n)` — ostatnie różnice z plików, najnowsze pierwsze; `directory()` — katalog. Reakcja na różnicę: tylko wpis\n  (`log`, bramka router.1). Błąd zapisu pliku nie psuje pytania (ostrzeżenie w logu).\n- **Plik różnic:** `acceptance.reconciliation.dir` (środowisko `ACCEPTANCE_RECONCILIATION_DIR`, domyślnie\n  `acceptance-reconciliation` w katalogu roboczym procesu; lokalnie `target/acceptance-reconciliation` — `stan.json`\n  `aplikacja`), plik na dzień UTC `differences-YYYY-MM-DD.jsonl`, wiersz na różnicę (format `reconciliation.md`:\n  `at`, `question` = metoda portu, `answering`, `input` z identyfikatorami — UID karty, kod słupka, nazwa partnera,\n  `legacy`, `new`, `diff`), dopisywany pod blokadą pliku. Test `AcceptanceReconciliationTest` pisze do własnego katalogu\n  w `target/acceptance-reconciliation-test/`.\n- **Tylko pytania.** Komendy (umowy, karty, filtry wymiany, przeniesienia) idą do starego modelu poza portem; świat\n  Party zasila tylko seeder przy starcie, więc po edycji w aplikacji Party się starzeje — różnice po takich zmianach są\n  spodziewane i nie podważają hipotezy (to samo dla danych demo spoza seedu: Party odpowiada „nie” / pusta lista).\n- **Poza routerem:** wołający spoza `miejsca.md` (reszta systemu pyta stary kod wprost); wartości z bazy, których typ\n  portu nie przyjmie (wołający idzie starą drogą, router ich nie widzi — sekcja „Wpięcie”).\n- Test sanity `AcceptanceSeederSanityTest` (nowy kod kroku swappable-dsl.5) sprawdzał `cardAcceptance` = adapter Party;\n  teraz: port = router, wajcha bez wierszy w `SYSTEM_PROPERTY` odpowiada modelem startowym `party`, bez porównania.\n\n\u003c!-- krok: parallel-model-router.3 -->\n## Ekran wajchy\n**Gdzie.** Konsola → zakładka 16 Administration → podsekcja „Acceptance lever” (szósta obok Users, Roles & rights,\nSystem properties, Audit log, Jobs). Nie nowa zakładka: `tabs.test.ts` utrwala 16 zakładek i ich numery, nowa\npozycja zmieniłaby test legacy. Zakładka widoczna z `USER_ADMIN`, odczyt ekranu wymaga `CONFIG_EDIT` (jak edycja flagi).\n\n**Co pokazuje** (`campsite-console/src/pages/AcceptanceLeverSection.tsx`, odświeżane co 5 s):\n- wajcha „Which model answers” — przełącznik `Legacy model` / `Party model`; obok zapisana wartość\n  `AcceptanceAnswer` albo „default (start-up model …)”, przycisk „Back to start-up model” (pusta wartość);\n- checkbox „Compare both models (reconciliation)” z zapisaną wartością `AcceptanceCompare`;\n- zwinięte „Reconciliation results” z licznikami „N agreed / M different” (od startu węzła, w pamięci);\n  rozwinięcie: tabela per pytanie portu, katalog plików różnic, ostatnie 20 różnic z pliku (pytanie, wejście, `diff`,\n  kto odpowiadał, kiedy).\n\n**Zapis wajchy** — istniejącym `/api/console/administration/setSystemProperty` (prawo `CONFIG_EDIT`, audyt\n`CONFIG_CHANGE`), ten sam co w „System properties”; działa od następnego pytania (krok router.1).\n**Odczyt** — nowy endpoint `POST /api/console/acceptanceLever/getAcceptanceLever` `{\"recent\": n}` (n ≤ 50, brak = 0)\n→ `{\"lever\": {answerKey, answerValue, answering, startModel, compareKey, compareValue, comparing, agreed, differed,\nperQuestion, differences, directory}}` (`AcceptanceLeverWebService` w campsite-endpoints, `AcceptanceLeverStatus`\nw pakiecie portu: `CONFIG_EDIT`, potem `AcceptanceLever` i `summary()` / `recent(n)` / `directory()`\nrekonsyliacji)
