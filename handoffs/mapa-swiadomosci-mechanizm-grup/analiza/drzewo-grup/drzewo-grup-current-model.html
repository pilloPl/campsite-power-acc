  .empty h2{color:var(--ink)} body.drag .empty{border-color:var(--accent);background:var(--accent-soft)}

<div class="wrap">
  <header class="hero">

      <p class="eyebrow">Concept explorer · mapa świadomości</p>
      <span class="spacer"></span>
      <select id="islandSel" class="btn" hidden></select>
      <button class="btn" id="szBtn" hidden>🔎 Szczegóły</button>

      <button class="btn" id="loadBtn">Wczytaj JSON…</button>

    </div>
    <h1 id="seed"></h1>
    <p class="intro" id="intro"></p>

  <div id="overview"></div>
  <div id="detailed" hidden></div>
  <section id="sz" hidden>
    <div class="krok-h"><span class="nr">🔎</span><div><h2>Szczegóły</h2><p class="note">Pełny zapis: wejście, wszystkie pytania z oceną krytyka i dowodami, diagram klas i tabel.</p></div></div>
    <div id="sz-ov"></div>
  </section>

  <div class="empty" id="empty">
    <h2>Drop a <code>*-current-model.json</code> here</h2>
    <p>…or use <b>Load JSON…</b>. Two tabs: a high-level <b>Przegląd</b> and the full <b>Szczegółowy</b> record.</p>
  </div>
</div>

<script>
(function(){
  "use strict";

  var GENESIS={"domain-genuine":"b-green","structure-induced":"b-amber","concept-circular":"b-red","management-of-mechanism":"b-purple"};
