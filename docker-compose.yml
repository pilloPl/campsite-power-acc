# PostgreSQL for running the backend locally (credentials match the defaults of application.yml).
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: campsite_power
      POSTGRES_USER: campsite
      POSTGRES_PASSWORD: campsite
    ports:
      - "${CAMPSITE_DB_PORT:-5432}:5432"
    volumes:
      - campsite-power-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campsite -d campsite_power"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  campsite-power-data:
