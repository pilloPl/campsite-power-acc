spring:
  application:
    name: campsite-power
  datasource:
    url: jdbc:postgresql://${CAMPSITE_DB_HOST:localhost}:${CAMPSITE_DB_PORT:5432}/${CAMPSITE_DB_NAME:campsite_power}
    username: ${CAMPSITE_DB_USER:campsite}
    password: ${CAMPSITE_DB_PASSWORD:campsite}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${CAMPSITE_HTTP_PORT:8080}
  servlet:
    session:
      timeout: ${CAMPSITE_SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: lax

# Console (campsite-console): the Vite dev server calls the backend from another origin with the session cookie.
campsite:
  console:
    cors:
      allowed-origins: ${CAMPSITE_CONSOLE_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# OpenAPI description for the typed client of the console: /v3/api-docs, Swagger UI at /swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**
