<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mapa szkolenia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--tlo:#f4efe6;--tlo-2:#ece4d6;--tekst:#201a16;--mocny:#2b2420;--przygaszony:#6b5f54;--akcent:#b5632b;--akcent-jasny:#d07a3e;
  --cyjan:#1f7a73;--ramka:#d8cdbb;--panel:#fbf8f2;--kod:#efe7da;--link:#b5632b;
  --font-display:"Fraunces",Georgia,serif;--font-body:"IBM Plex Sans","Segoe UI",sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --cien:0 1px 2px rgba(60,40,20,.05),0 10px 30px -12px rgba(60,40,20,.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--tlo:#15110e;--tlo-2:#1d1712;--tekst:#f1e9dd;--mocny:#fbf5ea;--przygaszony:#ab9d8c;
  --akcent:#e08a4c;--akcent-jasny:#f0a568;--cyjan:#5bc3b9;--ramka:#352b22;--panel:#1f1812;--kod:#241c15;--link:#f0a568;
  --cien:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme=dark]{--tlo:#15110e;--tlo-2:#1d1712;--tekst:#f1e9dd;--mocny:#fbf5ea;--przygaszony:#ab9d8c;
  --akcent:#e08a4c;--akcent-jasny:#f0a568;--cyjan:#5bc3b9;--ramka:#352b22;--panel:#1f1812;--kod:#241c15;--link:#f0a568;
  --cien:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);color-scheme:dark}
:root{--kropka:color-mix(in oklab,var(--tekst) 13%,transparent);--linia:color-mix(in oklab,var(--tekst) 30%,transparent)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--tlo);color:var(--tekst);font:15px/1.55 var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-underline-offset:2px;text-decoration-thickness:1.5px}
a:hover{color:var(--akcent-jasny)}

#widok{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(circle,var(--kropka) 1.1px,transparent 1.5px)}
#widok.ciagnie{cursor:grabbing}
#widok.bez-siatki{background-image:none!important}
.poswiata{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(70% 60% at 90% -10%,color-mix(in oklab,var(--akcent) 16%,transparent),transparent 60%),
    radial-gradient(60% 60% at -10% 110%,color-mix(in oklab,var(--cyjan) 15%,transparent),transparent 60%)}
#swiat{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#krawedzie{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}

/* krawędzie */
.kraw{fill:none;stroke:var(--linia);stroke-width:2.2;stroke-linecap:round}
.kraw.glowna{stroke:color-mix(in oklab,var(--akcent) 70%,var(--linia));stroke-width:2.6}
.kraw.boczna{stroke:color-mix(in oklab,var(--cyjan) 70%,var(--linia))}
.kraw.ducha{stroke:var(--linia);stroke-dasharray:5 8;opacity:.7}
.kraw.rysuj{stroke-dasharray:1;stroke-dashoffset:1;animation:rysuj .8s cubic-bezier(.6,0,.2,1) forwards}
@keyframes rysuj{to{stroke-dashoffset:0}}
.iskra{fill:var(--akcent-jasny);opacity:.85}
.koniec{fill:var(--panel);stroke-width:2.2}
.koniec.glowna{stroke:var(--akcent)}.koniec.boczna{stroke:var(--cyjan)}.koniec.ducha{stroke:var(--linia)}

.etykieta{position:absolute;left:0;top:0;width:max-content;max-width:196px;padding:7px 11px 8px;border-radius:12px;font-size:12.5px;line-height:1.4;
  color:var(--przygaszony);background:color-mix(in oklab,var(--tlo) 88%,transparent);border:1px solid var(--ramka);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.etykieta b{display:block;font:500 9.5px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--akcent);margin-bottom:5px}
.etykieta.boczna b{color:var(--cyjan)}
.etykieta{cursor:pointer;transition:border-color .15s}
.etykieta:hover{border-color:var(--akcent)}
.etykieta b::after{content:" −";letter-spacing:0}
.etykieta.zwinieta{padding:6px 10px}
.etykieta.zwinieta b{margin:0}
.etykieta.zwinieta b::after{content:" +"}
.etykieta.zwinieta .txt{display:none}
.pasek button.wylaczony{color:var(--przygaszony);text-decoration:line-through}

/* węzły */
.wezel{position:absolute;left:0;top:0;width:290px}
.wezel.rozwiniety{width:500px}
.wezel.dziecko{width:262px}
.wezel.dziecko.rozwiniety{width:440px}
.karta{position:relative;background:var(--panel);border:1px solid var(--ramka);border-radius:20px;box-shadow:var(--cien);
  padding:18px 20px 16px;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s;overflow:hidden}
.karta::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--akcent),var(--akcent-jasny))}
.dziecko .karta::before{background:linear-gradient(90deg,var(--cyjan),color-mix(in oklab,var(--cyjan) 50%,var(--akcent-jasny)))}
.karta:hover{border-color:var(--akcent);box-shadow:var(--cien),0 0 0 4px color-mix(in oklab,var(--akcent) 12%,transparent)}
.dziecko .karta:hover{border-color:var(--cyjan);box-shadow:var(--cien),0 0 0 4px color-mix(in oklab,var(--cyjan) 12%,transparent)}
.rozwiniety .karta{border-color:color-mix(in oklab,var(--akcent) 55%,var(--ramka));cursor:zoom-out}
.dziecko.rozwiniety .karta{border-color:color-mix(in oklab,var(--cyjan) 55%,var(--ramka))}
/* podbloki bez ćwiczenia: narzędzie (skill: co robi, ograniczenia) i notatki (na przyszłość) */
.narzedzie .karta::before{background:repeating-linear-gradient(135deg,#8a6fd1 0 6px,#b49cf0 6px 12px)}
.narzedzie .nr{color:#8a6fd1}
.notatka-znak.cwiczenie-znak{color:var(--cyjan);border:1px solid color-mix(in oklab,var(--cyjan) 55%,var(--ramka))}
.narzedzie .karta{border-color:color-mix(in oklab,#8a6fd1 35%,var(--ramka))}
.narzedzie .karta:hover,.narzedzie.rozwiniety .karta{border-color:#8a6fd1;box-shadow:var(--cien),0 0 0 4px color-mix(in oklab,#8a6fd1 14%,transparent)}
.narzedzie .notatka-znak{color:#8a6fd1;border:1px solid color-mix(in oklab,#8a6fd1 50%,var(--ramka))}
.notatka .karta{border-style:dashed;background:color-mix(in oklab,var(--panel) 70%,var(--tlo))}
.notatka .karta::before{background:repeating-linear-gradient(90deg,var(--przygaszony) 0 8px,transparent 8px 14px)}
.notatka .nr{color:var(--przygaszony)}
.notatka .karta:hover,.notatka.rozwiniety .karta{border-color:var(--przygaszony);box-shadow:var(--cien)}
.wniosek-wezel .karta{border-color:color-mix(in oklab,var(--cyjan) 45%,var(--ramka));background:color-mix(in oklab,var(--panel) 82%,var(--tlo))}
.wniosek-wezel .karta::before{background:linear-gradient(90deg,color-mix(in oklab,var(--cyjan) 60%,transparent),transparent)}
.wniosek-wezel .karta:hover,.wniosek-wezel.rozwiniety .karta{border-color:var(--cyjan)}
.notatka-znak.wniosek-znak{color:var(--cyjan);border:1px solid color-mix(in oklab,var(--cyjan) 55%,var(--ramka))}
.notatka-znak{display:inline-block;font:500 9.5px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--przygaszony);
  border:1px dashed var(--przygaszony);border-radius:999px;padding:3px 7px;margin-bottom:6px}
.glowa{display:flex;gap:14px;align-items:flex-start}
.nr{font:600 2.1rem/1 var(--font-display);color:var(--akcent);min-width:1.1em;font-variant-numeric:tabular-nums}
.dziecko .nr{font-size:1.25rem;color:var(--cyjan);padding-top:4px}
.tytuly{flex:1;min-width:0}
.tytul{font:600 1.32rem/1.2 var(--font-display);color:var(--mocny);margin:2px 0 0;letter-spacing:-.005em}
.dziecko .tytul{font-size:1.1rem}
.podtytul{color:var(--przygaszony);font-size:.9rem;margin-top:4px}
.strzalka{width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--ramka);display:grid;place-items:center;
  color:var(--przygaszony);transition:transform .25s,background .2s;margin-top:2px}
.rozwiniety .strzalka{transform:rotate(180deg);background:var(--kod)}
.tresc{display:none;margin-top:14px;cursor:auto}
.rozwiniety .tresc{display:block;animation:pojaw .35s ease}
@keyframes pojaw{from{opacity:0;transform:translateY(-4px)}}
.sekcja{border-top:1px solid var(--ramka);padding-top:12px;margin-top:12px}
.sekcja h3{font:500 10.5px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--akcent);margin:0 0 9px}
.dziecko .sekcja h3{color:var(--cyjan)}
.dlaczego{margin:0;font-style:italic;color:var(--tekst)}
ul.wnioski{list-style:none;margin:0;padding:0;display:grid;gap:7px}
ul.wnioski li{position:relative;padding-left:18px}
ul.wnioski li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;transform:rotate(45deg);
  background:var(--akcent)}
.dziecko ul.wnioski li::before{background:var(--cyjan)}
.pelne{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:600;text-decoration:none}
.pelne:hover{text-decoration:underline}
.sekcja .pelne{display:flex;width:fit-content}
.sekcja .pelne+.pelne{margin-top:4px}
.zadania{display:grid;gap:8px}
.zadanie{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0;padding:10px 12px;border:1px solid var(--ramka);border-radius:12px;background:var(--tlo);
  color:var(--tekst);text-decoration:none;font-weight:500;transition:border-color .15s,transform .15s}
a.zadanie:hover{border-color:var(--akcent);color:var(--akcent);transform:translateX(2px)}
.zadanie .rodzaj{font:500 9.5px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--przygaszony);
  border:1px solid var(--ramka);border-radius:999px;padding:4px 7px;margin-left:auto;max-width:100%;
  white-space:normal;overflow-wrap:anywhere;line-height:1.3}
.zadanie .ikona{font-size:1rem}

.wezel.duch{width:150px}
.wezel.duch .karta{padding:14px 16px;background:color-mix(in oklab,var(--panel) 40%,transparent);border-color:var(--linia);border-style:dashed;box-shadow:none;cursor:default}
.wezel.duch .karta::before{display:none}
.wezel.duch .karta:hover{border-color:var(--linia);box-shadow:none}
.wezel.duch .nr{color:var(--przygaszony);opacity:.6}
.wezel.duch .tytul{color:var(--przygaszony);font-style:italic;font-weight:400;font-size:1rem;padding-top:6px}
.wezel.duch .nr{font-size:1.5rem}
.wezel.pusty{width:64px}
.wezel.pusty .karta{height:64px;border-radius:50%;border-style:dashed;background:transparent;box-shadow:none;padding:0;cursor:default}
.wezel.pusty .karta::before{display:none}
.wezel.start{width:max-content}
.wezel.start .karta{border-radius:999px;padding:10px 18px;cursor:default;background:var(--akcent);border-color:var(--akcent);color:#fff;
  font:500 11px/1 var(--font-mono);letter-spacing:.2em;text-transform:uppercase}
.wezel.start .karta::before{display:none}
.wezel.start .karta:hover{box-shadow:var(--cien)}

ul.wnioski li[data-k]{cursor:pointer;border-radius:6px;transition:background .15s}
ul.wnioski li[data-k]:hover{background:color-mix(in oklab,var(--kod) 70%,transparent)}
ul.wnioski li.ukryty .t{display:none}
ul.wnioski li.ukryty::after{content:"· · ·";font:500 12px/1.4 var(--font-mono);letter-spacing:.2em;color:var(--przygaszony)}
ul.wnioski li.ukryty::before{opacity:.45}
ul.drzewo{list-style:none;margin:0;padding:0;display:grid;gap:12px}
ul.drzewo>li.galaz{position:relative;padding-left:16px;border-left:2px solid color-mix(in oklab,var(--cyjan) 45%,var(--ramka))}
.galaz-tyt{font:600 .98rem/1.3 var(--font-display);color:var(--mocny);margin:0 0 6px;position:relative}
.galaz-tyt::before{content:"";position:absolute;left:-18px;top:.65em;width:12px;height:2px;background:color-mix(in oklab,var(--cyjan) 45%,var(--ramka))}
.galaz-tyt[data-kotwica]{color:var(--cyjan)}
.galaz-tyt[data-kotwica]::after{content:" →";color:var(--cyjan)}
ul.drzewo ul.wnioski{gap:4px;font-size:13px}
.kraw.cel{stroke:var(--cyjan);stroke-width:2.2}
.koniec.cel{stroke:var(--cyjan)}
.wn-karta{position:absolute;left:0;top:0;width:360px;padding:14px 16px 14px;border-radius:16px;font-size:13.5px;line-height:1.5;
  background:color-mix(in oklab,var(--panel) 82%,transparent);border:1px solid color-mix(in oklab,var(--cyjan) 35%,var(--ramka));box-shadow:var(--cien);cursor:auto}
.wn-karta h3{font:500 10.5px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--cyjan);margin:0 0 10px}
.wn-karta ul.wnioski li::before{background:var(--cyjan)}
.wn-karta .pelne{font-size:13px}
.wn-karta h3{cursor:pointer;display:flex;align-items:center;gap:8px}
.wn-karta h3::after{content:"−";margin-left:auto;font-size:14px;letter-spacing:0;color:var(--przygaszony)}
.wn-karta h3 .ile{font-size:10px;letter-spacing:0;padding:3px 6px;border-radius:999px;background:var(--kod);color:var(--przygaszony)}
.wn-karta.zwinieta h3{margin:0}
.wn-karta.zwinieta h3::after{content:"+"}
.wn-karta.zwinieta ul,.wn-karta.zwinieta .pelne,.wn-karta.zwinieta .wiecej{display:none}
.wn-karta li.nadmiar{display:none}
.wn-karta.pelna li.nadmiar{display:list-item}
.wn-karta .wiecej{display:block;margin:8px 0 0;padding:0;border:0;background:none;font:500 12px/1.4 var(--font-mono);color:var(--cyjan);cursor:pointer}
.wn-karta .pelne{display:block;margin-top:8px}
.kraw.wn{stroke:color-mix(in oklab,var(--cyjan) 55%,var(--linia));stroke-width:1.6;stroke-dasharray:2 6}
.popup{position:fixed;inset:0;display:none;place-items:center;padding:24px 16px;background:color-mix(in oklab,var(--tlo) 55%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:10}
.popup.otwarty{display:grid;animation:pojaw .25s ease}
.popup-karta{position:relative;width:min(640px,100%);max-height:80vh;overflow:auto;padding:26px 28px;border-radius:20px;background:var(--panel);
  border:1px solid color-mix(in oklab,var(--cyjan) 40%,var(--ramka));box-shadow:var(--cien)}
.popup-karta h3{font:500 11px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--cyjan);margin:0 0 16px}
.popup-karta ul.wnioski{gap:10px}.popup-karta ul.wnioski li::before{background:var(--cyjan)}
.popup-karta .pelne{display:inline-block;margin-top:16px}
.popup .zamknij{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--ramka);background:var(--tlo);
  color:var(--tekst);font-size:18px;cursor:pointer}
.popup .zamknij:hover{border-color:var(--akcent);color:var(--akcent)}
.wejscie{animation:wejscie .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes wejscie{from{opacity:0;filter:blur(6px);translate:0 14px}}

/* nakładki */
.naglowek{position:fixed;left:24px;top:20px;max-width:min(560px,calc(100vw - 48px));pointer-events:none}
.naglowek .eyebrow{font:500 .7rem/1 var(--font-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--akcent);margin:0 0 10px}
.naglowek h1{font:600 clamp(1.4rem,3vw,2rem)/1.1 var(--font-display);margin:0;color:var(--mocny);letter-spacing:-.01em}
.pasek{position:fixed;display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;background:color-mix(in oklab,var(--panel) 90%,transparent);
  border:1px solid var(--ramka);box-shadow:var(--cien);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pasek.zoom{left:24px;bottom:22px}
.pasek.ster{right:24px;bottom:22px}
.pasek button{font:500 14px/1 var(--font-body);min-width:36px;height:36px;padding:0 12px;border-radius:999px;border:0;background:transparent;
  color:var(--tekst);cursor:pointer}
.pasek button:hover{background:var(--kod);color:var(--akcent)}
.pasek .proc{font:500 12px/1 var(--font-mono);color:var(--przygaszony);min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.panel{position:fixed;right:24px;bottom:84px;width:min(340px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;padding:18px 18px 16px;
  border-radius:18px;background:var(--panel);border:1px solid var(--ramka);box-shadow:var(--cien);display:none}
.panel.otwarty{display:block;animation:pojaw .25s ease}
.panel h2{font:600 1.1rem/1.2 var(--font-display);margin:0 0 4px}
.panel .opis{color:var(--przygaszony);font-size:.82rem;margin:0 0 12px}
.panel label{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:.92rem}
.panel label:hover{background:var(--kod)}
.panel label.pod{padding-left:30px;font-size:.86rem;color:var(--przygaszony)}
.panel input{accent-color:var(--akcent);width:16px;height:16px}
.panel .przyciski{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--ramka)}
.panel .przyciski button{font:500 13px/1 var(--font-body);padding:10px 14px;border-radius:999px;border:1px solid var(--ramka);background:var(--tlo);
  color:var(--tekst);cursor:pointer}
.panel .przyciski button:hover{border-color:var(--akcent);color:var(--akcent)}
.panel .przyciski button.glowny{background:var(--akcent);border-color:var(--akcent);color:#fff}
.panel .przyciski button.glowny:hover{filter:brightness(1.08);color:#fff}
.podpowiedz{position:fixed;left:50%;bottom:28px;translate:-50% 0;font:500 11px/1 var(--font-mono);letter-spacing:.06em;color:var(--przygaszony);
  pointer-events:none;transition:opacity .6s;white-space:nowrap}
@media (max-width:760px){
  .naglowek{left:16px;top:14px}
  .pasek.zoom{left:16px;bottom:16px}.pasek.ster{right:16px;bottom:16px}.panel{right:16px;bottom:72px}
  .podpowiedz{display:none}
}

/* legenda */
.legenda{position:fixed;right:24px;top:20px;display:grid;gap:8px;padding:12px 14px;border-radius:14px;
  background:color-mix(in oklab,var(--panel) 90%,transparent);border:1px solid var(--ramka);box-shadow:var(--cien);
  font:500 10.5px/1.2 var(--font-mono);letter-spacing:.06em;color:var(--przygaszony);z-index:5}
.legenda div{display:flex;align-items:center;gap:10px}
.legenda i{display:inline-block;flex:none;width:26px;height:16px;border-radius:5px;background:var(--panel)}
.legenda .l-blok{border:2px solid var(--akcent)}
.legenda .l-cw{border:2px solid var(--cyjan)}
.legenda .l-nr{border:2px solid #8a6fd1;background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in oklab,#8a6fd1 30%,transparent) 5px 8px)}
.legenda .l-nt{border:2px dashed var(--przygaszony)}
.legenda .l-wn{height:10px;border-radius:999px;border:1px solid color-mix(in oklab,var(--cyjan) 45%,var(--ramka))}
.legenda .l-duch{border:1.5px dashed var(--linia);background:transparent}
@media (max-width:760px){.legenda{display:none}}

/* motywy */
:root[data-motyw=cb]{--tlo:#ffffff;--tlo-2:#f2f2f2;--tekst:#111111;--mocny:#000000;--przygaszony:#666666;--akcent:#111111;--akcent-jasny:#444444;
  --cyjan:#555555;--ramka:#cfcfcf;--panel:#ffffff;--kod:#f0f0f0;--link:#111111;--cien:0 1px 2px rgba(0,0,0,.06);color-scheme:light}
:root[data-motyw=cb] .poswiata,:root[data-motyw=cb] .iskra{display:none}
:root[data-motyw=fancy]{--tlo:#0b0820;--tlo-2:#120d2e;--tekst:#ece8ff;--mocny:#ffffff;--przygaszony:#a79fd0;--akcent:#ff4fd8;--akcent-jasny:#ff9af0;
  --cyjan:#3ef0ff;--ramka:#2e2758;--panel:#15112e;--kod:#1c1640;--link:#ff9af0;
  --cien:0 0 0 1px rgba(255,79,216,.08),0 12px 40px -12px rgba(62,240,255,.35);color-scheme:dark}
:root[data-motyw=fancy] .poswiata{background:radial-gradient(70% 60% at 90% -10%,rgba(255,79,216,.28),transparent 60%),
  radial-gradient(60% 60% at -10% 110%,rgba(62,240,255,.25),transparent 60%)}
:root[data-motyw=slodki]{--tlo:#fff0f6;--tlo-2:#ffe4f0;--tekst:#4a2b3d;--mocny:#3a1d2f;--przygaszony:#9b6f86;--akcent:#ff5fa2;--akcent-jasny:#ff8fc0;
  --cyjan:#8a7bff;--ramka:#ffcfe3;--panel:#ffffff;--kod:#fff3f8;--link:#ff5fa2;
  --cien:0 2px 0 #ffd6e8,0 14px 30px -14px rgba(255,95,162,.45);color-scheme:light}
:root[data-motyw=terminal]{--tlo:#050805;--tlo-2:#0a110a;--tekst:#b8f5b0;--mocny:#d9ffd4;--przygaszony:#5f9a58;--akcent:#39ff6a;--akcent-jasny:#8dff9f;
  --cyjan:#ffd23f;--ramka:#1d3a1d;--panel:#0a120a;--kod:#0f1a0f;--link:#39ff6a;--cien:none;color-scheme:dark;
  --font-display:var(--font-mono);--font-body:var(--font-mono)}
:root[data-motyw=terminal] .poswiata{display:none}
.pasek select{font:500 13px/1 var(--font-body);height:36px;padding:0 10px;border-radius:999px;border:0;background:transparent;color:var(--tekst);cursor:pointer}
.pasek select:hover{background:var(--kod);color:var(--akcent)}

/* mini-mapa celów: drzewo z góry na dół w karcie */
.wn-karta.minimapa{width:780px;padding:16px 18px 18px;background-image:radial-gradient(var(--kropka) 1px,transparent 1.2px);background-size:18px 18px}
.mm-korzen{display:flex;justify-content:center}
.mm-korzen span{font:600 13px/1 var(--font-display);padding:9px 16px;border-radius:999px;background:var(--akcent);color:#fff;box-shadow:var(--cien)}
.mm-cele{display:flex;gap:12px;justify-content:center;position:relative;margin-top:22px;padding-top:18px}
.mm-cele::before{content:"";position:absolute;top:0;left:calc(50% - 1px);width:2px;height:18px;margin-top:-22px;background:var(--linia)}
.mm-galaz{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative}
.mm-galaz::before{content:"";position:absolute;top:-18px;left:0;right:0;height:18px;border-top:2px solid var(--linia)}
.mm-galaz:first-child::before{left:50%}.mm-galaz:last-child::before{right:50%}
.mm-galaz:only-child::before{display:none}
.mm-galaz::after{content:"";position:absolute;top:-18px;left:calc(50% - 1px);width:2px;height:18px;background:var(--linia)}
.mm-cel{font:600 12.5px/1.25 var(--font-body);text-align:center;padding:9px 12px;border-radius:14px;cursor:pointer;width:100%;
  border:2px solid var(--cyjan);background:var(--panel);color:var(--mocny);box-shadow:var(--cien)}
.mm-cel::after{content:" ▾";color:var(--przygaszony)}
.mm-galaz.zwiniety .mm-cel::after{content:" ▸"}
.mm-galaz.zwiniety .mm-liscie{display:none}
.mm-cel[data-kotwica]{border-color:var(--akcent)}
.mm-liscie{display:grid;gap:8px;width:100%;margin-top:14px;position:relative}
.mm-liscie::before{content:"";position:absolute;top:-14px;left:calc(50% - 1px);width:2px;height:14px;background:var(--linia)}
.mm-karta{border:1px solid var(--ramka);border-radius:12px;background:var(--panel);padding:9px 11px}
.mm-karta h4{margin:0 0 6px;font:500 9.5px/1.2 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cyjan)}
.mm-karta ul.wnioski{gap:4px;font-size:12.5px;line-height:1.45}

/* przejście: klik w początek krawędzi pokazuje albo chowa następny blok */
.przejscie{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;padding:0;cursor:pointer;z-index:2;
  border:2px solid color-mix(in oklab,var(--akcent) 55%,transparent);background:var(--tlo);opacity:.35;transition:opacity .15s,transform .15s}
.przejscie::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--akcent)}
.przejscie.ukryty{border-style:dashed;border-color:var(--linia)}
.przejscie.ukryty::after{background:transparent}
.przejscie:hover{opacity:1}

.popup.szerokie .popup-karta{width:min(980px,calc(100vw - 32px));max-height:calc(100vh - 64px);overflow:auto}
.popup-karta h4{font:600 1rem/1.3 var(--font-display);color:var(--mocny);margin:20px 0 4px}
.popup-karta p.meta{font:500 11px/1.4 var(--font-mono);color:var(--przygaszony);margin:0 0 8px}
.popup-karta p.wstep{margin:0 0 6px;color:var(--przygaszony)}
@media (prefers-reduced-motion:reduce){.wejscie,.kraw.rysuj,.rozwiniety .tresc{animation:none}.kraw.rysuj{stroke-dasharray:none}.iskra{display:none}}
</style>

    bloki.forEach(b => {
      const l = el("label", b.rodzic ? "pod" : "");
      const c = el("input"); c.type = "checkbox"; c.checked = wlasnaWidocznosc(b); c.disabled = !!b.rodzic && !widoczny(b.rodzic);
      c.addEventListener("change", () => {
        if (c.checked === domyslnie(b)) delete nadpisania[b.id]; else nadpisania[b.id] = c.checked;
        if (!c.checked) rozwiniete.delete(b.id);
        zapisz(); odswiez(false); panelBuduj();
      });
      l.append(c, el("span", "", (b.nr ? b.nr + ". " : "") + (b.tytul || "(pusty)")));
      panel.append(l);
    });
    const p = el("div", "przyciski");
    const b1 = el("button", "", "Pokaż wszystko"); b1.type = "button";
    b1.onclick = () => { bloki.forEach(b => { if (domyslnie(b)) delete nadpisania[b.id]; else nadpisania[b.id] = true; }); zapisz(); odswiez(false); panelBuduj(); };
    const b2 = el("button", "glowny", "Przebuduj mapę"); b2.type = "button"; b2.title = "Wróć do punktu startowego i odtwórz mapę od początku";
    b2.onclick = () => { if (!ADMIN && !PODGLAD) try { localStorage.removeItem(KLUCZ); } catch (e) {} wczytajStan(); ustawWarstwy(); zapisz(); rozwiniete.clear(); panel.classList.remove("otwarty"); odswiez(true); panelBuduj(); };
    p.append(b1, b2); panel.append(p);
  }

  const pop = document.getElementById("popup");
  function popup(g) {
    const t = document.getElementById("popup-tresc");
    const ul = el("ul", "wnioski"); (g.punkty || []).forEach(x => ul.append(el("li", "", x)));
    t.replaceChildren(el("h3", "", g.tytul || "Wnioski"));
    if (g.wstep) t.append(el("p", "wstep", g.wstep));
    if ((g.punkty || []).length) t.append(ul);
    (g.sekcje || []).forEach(sk => { t.append(el("h4", "", sk.tytul)); if (sk.meta) t.append(el("p", "meta", sk.meta));
      const u = el("ul", "wnioski"); (sk.punkty || []).forEach(x => u.append(el("li", "", x))); t.append(u); });
    pop.classList.toggle("szerokie", !!g.sekcje);
    if (g.link) { const a = el("a", "pelne", (g.link_tytul || "Pełne wnioski") + " →"); a.href = adres(g.link); a.target = "_blank"; a.rel = "noopener"; t.append(a); }
    pop.classList.add("otwarty");
  }
  pop.addEventListener("click", e => { if (e.target === pop || e.target.closest(".zamknij")) pop.classList.remove("otwarty"); });
  function ustawDlaczego(wl) {
    wszystkieDlaczego = wl; ukryteDlaczego = {}; zapisz();
    document.querySelector('[data-akcja="dlaczego"]').classList.toggle("wylaczony", !wl);
    document.querySelectorAll(".etykieta").forEach(e => e.classList.toggle("zwinieta", !wl));
    przesun();
  }
  function odswiez(odNowa) {
    zbuduj(odNowa);
    if (odNowa) { poz = new Map(); przesun(true); leć(calosc(), 700); }
    else { przesun(); leć(calosc(), 600); }
  }

  // ---- start ----
  const uruchom = () => {
    zbuduj(true); przesun(true); V = calosc(); ustawWidok(); panelBuduj(); ustawWarstwy();
  };
  // API dla edytora (/admin/): dane bez pól wyliczanych, przeładowanie po zmianie, lot do węzła
  const WYLICZANE = new Set(["rodzic", "poziom", "nr", "poprzedni", "zrodlo"]);
  window.__mapa = {
    DANE, ADMIN,
    bloki: () => bloki, wezly: () => wezly, widoczny: b => widoczny(b), widok: () => V,
    przelacz: id => { const w = wezly.get(id); if (w && widoczny(w.b) && maTresc(w.b)) przelacz(w.b); },
    czyste: () => JSON.parse(JSON.stringify(DANE, (k, v) => (WYLICZANE.has(k) ? undefined : v))),
    przeladuj(stanTez) { przygotuj(); naglowek(); if (stanTez) { wczytajStan(); ustawWarstwy(); } zbuduj(false); przesun(); panelBuduj(); },
    pokaz(id) { const w = wezly.get(id); if (!w) return; leć(widokNa(ramka([id, ...(karty.get(id) || []).map(x => x.id)]), 1.05, innerWidth < 760 ? 80 : 120), 600); },
    calosc: () => leć(calosc()),
  };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(uruchom);
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => leć(calosc(), 300), 150); });
})();
