<script id="dane" type="application/json">{"obszar":"drzewo-grup","md":"# Grupy w nowym modelu: akceptacja kart na kempingu\n\nSQL: `docker exec -i mig-pg psql -U campsite campsite_power -A -F \"|\" -P footer=off`\nFiltr: rynek HR — cała struktura grup i umów, instancje (słupki, karty gości, karty obsługi) tylko z HR\nStart: migracja/drzewo-grup @ 765024a\n\n## Zakres\n\nFakty nowego modelu × przepięte miejsca (`zrodlo/specyfikacje__drzewo-grup__miejsca.md`):\n\n| Miejsce | Pytanie (CO) | Fakty, które nowy model musi znać | API nowego modelu |\n|---|---|---|---|\n| M1 | czy karta gościa działa na słupku | kemping słupka, regiony kempingu, wydawca karty (CARD_ISSUANCE), organizacja wydawcy, umowy | `pedestals().standsAt`, `REGION_MEMBERSHIP`, `registerPerson` + `CARD_ISSUANCE`, `ISSUER_MEMBERSHIP`, `ACCEPTANCE_AGREEMENT` |\n| M2 | których wydawców przyjmuje kemping słupka | jak M1, bez kart; nazwa wydawcy = odpowiedź | jak M1 |\n| M3 | które karty obsługi są na liście słupka | aktywne karty obsługi kempingu i grup nad nim, numer = id karty w starym modelu | `registerPerson` (HOUSE_CARD_NUMBER) + `STAFF_ASSIGNMENT` |\n| M4 | czy karta jest kartą sieci | wydawca karty należy do sieci | `CARD_ISSUANCE` od jednostki z `ISSUER_MEMBERSHIP` do sieci |\n\nJednostki (kandydaci):\n- **kemping**: grupa SITE, na której wiszą słupki (stary model nie ma typu „kemping”); alternatywa: grupa SITE bez dzieci\n  (liść) — różni się tam, gdzie słupki wiszą na sekcji kempingu;\n- **region**: grupa SITE nad kempingiem; nowy model patrzy jeden poziom w górę, stare drzewo ma ich kilka;\n- **wydawca**: grupa ISSUER; podgrupy wydawcy to jednostki (ISSUER_MEMBERSHIP);\n- **karta gościa**: CAMPING_CARD → GUEST → grupa gościa (wydawca); **karta obsługi**: HOUSECARD.\n\nCel trwały: translator przy starcie aplikacji (nowy model żyje w pamięci, nie ma tabel), w miejsce seedera świata (D03).\n\nFiltr — kandydaci (słupki aktywne / karty gości / umowy):\n\n| Filtr | Słupki | Karty gości | Uwagi |\n|---|---|---|---|\n| **rynek HR (rekomendacja)** | 560 (HR SITES 547 + HR-NORTH 13) | 60 194 wydawców HR + 237 pod grupą kempingu | umowy z HR mają też wydawcy FR (1) i IT (2), więc struktura wydawców całości; drugi korzeń HR-NORTH |\n| rynek ES | 8 | 0 | za mało układów |\n| całość | 1 694 | 173 269 | za wolno na szkolenie (nowy model przegląda wszystkie relacje przy pytaniu) |\n\nWybrany: rynek HR (decyzja D04; bez człowieka — rekomendacja).\n## Słownik dwóch języków\n\n| Stara tabela / kolumna | Znaczenie | Fakt nowego modelu albo „poza” | plik:linia |\n|---|---|---|---|\n| `TBL_GROUP` SITE ze słupkami | kemping | `ACCEPTOR` + `pedestals().standsAt` (D01) | `LegacyCardAcceptance.java:58` |\n| `TBL_GROUP` SITE nad kempingiem | region (wielopoziomowy) | `REGION` + `REGION_MEMBERSHIP` do każdego przodka (D06) | `sqls.xml:83` |\n| `TBL_GROUP` ISSUER, `PARENT_ID` | wydawca i jego jednostki | `ISSUER` (firma = korzeń rynku → jego dzieci), `ISSUER_MEMBERSHIP` dziecko → rodzic (D05) | `GroupServiceHelper.java:89` |\n| `GROUP_ASSOCIATEDGROUP` (cel SITE) | umowa akceptacji, najbliższy przodek z umowami zastępuje wyższe | `ACCEPTANCE_AGREEMENT` + polityka `ownReplaceInherited` (D05) | `GroupServiceHelper.java:89`, `sqls.xml:36` |\n| `GROUP_ASSOCIATEDGROUP` (cel nie SITE) | nie umowa tego rodzaju | poza (ignorowane przez oba modele) | `sqls.xml:47` |\n| `CAMPING_CARD.CARD_RFID` → `GUEST.GROUP_ID` | karta gościa, wydawca = grupa gościa | osoba `CARDHOLDER` z `CARD_UID` + `CARD_ISSUANCE` od wydawcy (D07) | `LegacyCardAcceptance.java:60` |\n| grupa `NETWORK CARD` i poddrzewo | wydawca sieci | `ISSUER_MEMBERSHIP` do podmiotu Sieć (D10) | `LegacyCardAcceptance.java:85`, `GroupService.java:217` |\n| `HOUSECARD` aktywne, grupa w linii słupka | karta obsługi kempingu i grup nad nim | `STAFF_MEMBER` z `HOUSE_CARD_NUMBER` = `HOUSECARD.ID` + `STAFF_ASSIGNMENT` (D09) | `HouseCardService.java:83` |\n| `PEDESTAL.GROUP_ID`, `DELETED` | słupek na grupie | rzut na kemping; skasowany i bez grupy  68 z rundy aplikacji (M1, M2, M3 osobno) + 17 niedostępnych w aplikacji (M4, HR-NORTH). Nowy model:\n`kontrola/nowy.jsonl` z portu (`AcceptancePermissions`) po przeniesieniu. Wynik: 83/85 takie same, 2 wyjaśnione D14.\n\nKontrola znaczenia — zgodne liczbowo, a może źle sklasyfikowane:\n- D01: sekcja ze słupkami pod kempingiem (11 w HR) jest w nowym modelu osobnym kempingiem i członkiem „regionu”, którym\n  jest kemping nad nią. Odpowiedzi się zgadzają, ale nowy model ma kempingi, których biznes może nie znać. Sprawdzić\n  z właścicielem listy kempingów (np. wykaz z umów najmu), nie liczbami.\n- D06: spłaszczenie robi z rynku i regionów jednakowe „regiony”; pytanie „w jakim regionie jest kemping” ma teraz\n  kilka odpowiedzi. Przepięte miejsca o to nie pytają.\n## Notatki\n\n- Translator przenosi tylko rynek HR, a struktura (regiony, wydawcy, umowy) jest cała: kempingi FR i IT zostają\n  w nowym modelu „regionami”, bo ich słupki nie przeszły. Przy przenoszeniu kolejnego rynku liczba kempingów się zmieni.\n- Nowy model po przeniesieniu odpowiada ~13 razy wolniej (P10).\n","decyzje":[{"id":"D01","data":"2026-10-25 09:16","etap":"zakres","obszar":"jednostka: kemping","stary":"grupa `SITE` (brak typu kemping); słupek `PEDESTAL.GROUP_ID`","nowy":"podmiot `ORGANIZATION_UNIT` z rolą `ACCEPTOR`, słupek jako rzut `pedestals().standsAt`","decyzja":"Kemping = grupa SITE, na której wisi co najmniej jeden aktywny słupek.","dlaczego":"Miejsca pytają o kemping słupka; słupek to jedyna poszlaka w danych, że grupa jest kempingiem.","zrodlo":"campsite-core/src/main/java/io/pillopl/acceptance/LegacyCardAcceptance.java:58","podstawa":"kod","pewnosc":90,"status":"przyjęta","zapytania":[{"data":"2026-10-25 09:17","sql":"with recursive r(id, root, lvl) as (select id, name, 0 from tbl_group where parent_id is null union all select g.id, r.root, r.lvl+1 from tbl_group g join r on g.parent_id=r.id), k as (select distinct group_id id from pedestal where not coalesce(deleted,false) and group_i si znać | API nowego modelu |\n|---|---|---|---|\n| M1 | czy karta gościa działa na słupku | kemping słupka, regiony kempingu, wydawca karty (CARD_ISSUANCE), organizacja wydawcy, umowy | `pedestals().standsAt`, `REGION_MEMBERSHIP`, `registerPerson` + `CARD_ISSUANCE`, `ISSUER_MEMBERSHIP`, `ACCEPTANCE_AGREEMENT` |\n| M2 | których wydawców przyjmuje kemping słupka | jak M1, bez kart; nazwa wydawcy = odpowiedź | jak M1 |\n| M3 | które karty obsługi są na liście słupka | aktywne karty obsługi kempingu i grup nad nim, numer = id karty w starym modelu | `registerPerson` (HOUSE_CARD_NUMBER) + `STAFF_ASSIGNMENT` |\n| M4 | czy karta jest kartą sieci | wydawca karty należy do sieci | `CARD_ISSUANCE` od jednostki z `ISSUER_MEMBERSHIP` do sieci |\n\nJednostki (kandydaci):\n- **kemping**: grupa SITE, na której wiszą słupki (stary model nie ma typu „kemping”); alternatywa: grupa SITE bez dzieci\n  (liść) — różni się tam, gdzie słupki wiszą na sekcji kempingu;\n- **region**: grupa SITE nad kempingiem; nowy model patrzy jeden poziom w górę, stare drzewo ma ich kilka;\n- **wydawca**: grupa ISSUER; podgrupy wydawcy to jednostki (ISSUER_MEMBERSHIP);\n- **karta gościa**: CAMPING_CARD → GUEST → grupa gościa (wydawca); **karta obsługi**: HOUSECARD.\n\nCel trwały: translator przy starcie aplikacji (nowy model żyje w pamięci, nie ma tabel), w miejsce seedera świata (D03).\n\nFiltr — kandydaci (słupki aktywne / karty gości / umowy):\n\n| Filtr | Słupki | Karty gości | Uwagi |\n|---|---|---|---|\n| **rynek HR (rekomendacja)** | 560 (HR SITES 547 + HR-NORTH 13) | 60 194 wydawców HR + 237 pod grupą kempingu | umowy z HR mają też wydawcy FR (1) i IT (2), więc struktura wydawców całości; drugi korzeń HR-NORTH |\n| rynek ES | 8 | 0 | za mało układów |\n| całość | 1 694 | 173 269 | za wolno na szkolenie (nowy model przegląda wszystkie relacje przy pytaniu) |\n\nWybrany: rynek HR (decyzja D04; bez człowieka — rekomendacja).\n## Słownik dwóch języków\n\n| Stara tabela / kolumna | Znaczenie | Fakt nowego modelu albo „poza” | plik:linia |\n|---|---|---|---|\n| `TBL_GROUP` SITE ze słupkami | kemping | `ACCEPTOR` + `pedestals().standsAt` (D01) | `LegacyCardAcceptance.java:58` |\n| `TBL_GROUP` SITE nad kempingiem | region (wielopoziomowy) | `REGION` + `REGION_MEMBERSHIP` do każdego przodka (D06) | `sqls.xml:83` |\n| `TBL_GROUP` ISSUER, `PARENT_ID` | wydawca i jego jednostki | `ISSUER` (firma = korzeń rynku → jego dzieci), `ISSUER_MEMBERSHIP` dziecko → rodzic (D05) | `GroupServiceHelper.java:89` |\n| `GROUP_ASSOCIATEDGROUP` (cel SITE) | umowa akceptacji, najbliższy przodek z umowami zastępuje wyższe | `ACCEPTANCE_AGREEMENT` + polityka `ownReplaceInherited` (D05) | `GroupServiceHelper.java:89`, `sqls.xml:36` |\n| `GROUP_ASSOCIATEDGROUP` (cel nie SITE) | nie umowa tego rodzaju | poza (ignorowane przez oba modele) | `sqls.xml:47` |\n| `CAMPING_CARD.CARD_RFID` → `GUEST.GROUP_ID` | karta gościa, wydawca = grupa gościa | osoba `CARDHOLDER` z `CARD_UID` + `CARD_ISSUANCE` od wydawcy (D07) | `LegacyCardAcceptance.java:60` |\n| grupa `NETWORK CARD` i poddrzewo | wydawca sieci | `ISSUER_MEMBERSHIP` do podmiotu Sieć (D10) | `LegacyCardAcceptance.java:85`, `GroupService.java:217` |\n| `HOUSECARD` aktywne, grupa w linii słupka | karta obsługi kempingu i grup nad nim | `STAFF_MEMBER` z `HOUSE_CARD_NUMBER` = `HOUSECARD.ID` + `STAFF_ASSIGNMENT` (D09) | `HouseCardService.java:83` |\n| `PEDESTAL.GROUP_ID`, `DELETED` | słupek na grupie | rzut na kemping; skasowany i bez grupy poza (D01) | `LegacyCardAcceptance.java:58` |\n| reszta (`LOCATION`, gniazda, ważność karty, atrybuty) | — | poza: nie pyta o to żadne przepięte miejsce | `miejsca.md` |\n## Translator\n\n`campsite-seeder/src/main/java/io/pillopl/migration/`: `OldAcceptanceData` (wiersze starych tabel), `AcceptanceTranslator`\n(czysta funkcja: polecenia modelu Party, licznik przeniesionych i pominiętych z decyzją), `AcceptanceMigration`\n(profil `migracja-hr` zamiast `acceptance-seed`, odczyt pięcioma SELECT-ami w transakcji tylko do odczytu, raport,\nopcjonalnie odpowiedzi kontrolne z portu nowego modelu). Test `AcceptanceTranslatorTest` (mały stary stan → odpowiedzi\nM1–M4), zielony. Nowy i stary model bez zmian.\n\nUruchomienie:\n```bash\nmvn -q -B -DskipTests package\nCAMPSITE_DB_PORT=15461 CAMPSITE_HTTP_PORT=18491 ACCEPTANCE_MODEL=legacy java -jar campsite-server/target/campsite-server-1.0.0-SNAPSHOT.jar \\\n  --spring.profiles.active=demo,migracja-hr --acceptance.reconciliation.directory=$PWD/migracje/drzewo-grup/roznice/aplikacja \\\n  --acceptance.migration.report=$PWD/migracje/drzewo-grup/raport-przeniesienia.json \\\n  --acceptance.migration.control=$PWD/migracje/drzewo-grup/kontrola/pytania.jsonl\nmvn -q -B -pl campsite-seeder -am test -Dtest='AcceptanceTranslatorTest' -Dsurefire.failIfNoSpecifiedTests=false\n```\nDwa obroty: po pierwszej kontroli doszła D14 (duplikat UID na granicy filtru).\n\n## Różnice\n\n58 pytań przez aplikację (`roznice/requests.json`, zapytanie `roznice/requests.sql`): 48 × M1 (15 z pasującą umową,\n15 losowych, przypadki P01–P04), 10 list (M2 + M3). Login `admin` (zakres HR); 4 pytania 403 (P07).\n\n| Runda | zgodne | różne | nie znam | czas na pytanie |\n|---|---|---|---|---|\n| przed (sam seed) | 0 | 0 | 64 | 0,11 s |\n| po (translator) | 64 | 0 | 0 | 1,50 s |\n| po-2 (poprawka D14) | 64 | 0 | 0 | 1,48 s |\n\n## Kontrola\n\nOczekiwane odpowiedzi prosto ze starych tabel (`kontrola/oczekiwane.sql`: reguła z `sqls.xml`, bez translatora),\n85 pytań: 68 z rundy aplikacji (M1, M2, M3 osobno) + 17 niedostępnych w aplikacji (M4, HR-NORTH). Nowy model:\n`kontrola/nowy.jsonl` z portu (`AcceptancePermissions`) po przeniesieniu. Wynik: 83/85 takie same, 2 wyjaśnione D14.\n\nKontrola znaczenia — zgodne liczbowo, a może źle sklasyfikowane:\n- D01: sekcja ze słupkami pod kempingiem (11 w HR) jest w nowym modelu osobnym kempingiem i członkiem „regionu”, którym\n  jest kemping nad nią. Odpowiedzi się zgadzają, ale nowy model ma kempingi, których biznes może nie znać. Sprawdzić\n  z właścicielem listy kempingów (np. wykaz z umów najmu), nie liczbami.\n- D06: spłaszczenie robi z rynku i regionów jednakowe „regiony”; pytanie „w jakim regionie jest kemping” ma teraz\n  kilka odpowiedzi. Przepięte miejsca o to nie pytają.\n## Notatki\n\n- Translator przenosi tylko rynek HR, a struktura (regiony, wydawcy, umowy) jest cała: kempingi FR i IT zostają\n  w nowym modelu „regionami”, bo ich słupki nie przeszły. Przy przenoszeniu kolejnego rynku liczba kempingów się zmieni.\n- Nowy model po przeniesieniu odpowiada ~13 razy wolniej (P10).\n"},{"plik":"problemy.json","rozmiar":6096,"tresc":"{\n  \"problemy\": [\n    {\n      \"id\": \"P01\",\n      \"data\": \"2026-10-25 09:19\",\n      \"etap\": \"dane\",\n      \"rodzaj\": \"układ\",\n      \"opis\": \"Kemping w kempingu: sekcja ze słupkami pod grupą, która też ma słupki\",\n      \"ile\": 11,\n      \"przyklady\": [],\n      \"zrodlo\": \"D01\",\n      \"wyjasnienie\": {\n        \"jak\": \"decyzja\",\n        \"decyzja\": \"D01\",\n        \"data\": \"2026-10-25 09:19\"\n      },\n      \"historia\": [\n        {\n          \"data\": \"2026-10-25 09:19\",\n          \"ile\": 11\n        }\n      ]\n    },\n    {\n      \"id\": \"P02\",\n      \"data\": \"2026-10-25 09:19\",\n      \"etap\": \"dane\",\n      \"rodzaj\": \"układ\",\n      \"opis\": \"Drzewo kempingów głębsze niż jeden region (poziomy 3–4 pod rynkiem)\",\n      \"ile\": 124,\n      \"przyklady\": [],\n      \"zrodlo\": \"D06\",\n      \"wyjasnienie\": {\n        \"jak\": \"decyzja\",\n        \"decyzja\": \"D06\",\n        \"data\": \"2026-10-25 09:19\"\n      },\n      \"historia\": [\n        {\n          \"data\": \"2026-10-25 09:19\",\n          \"ile\": 124\n        }\n      ]\n    },\n    {\n      \"id\": \"P03\",\n      \"data\": \"2026-10-25 09:19\",\n      \"etap\": \"dane\",\n      \"rodzaj\": \"układ\",\n      \"opis\": \"Wydawca pod kempingiem (grupa ISSUER z rodzicem SITE), 237 kart\",\n      \"ile\": 1,\n      \"prz <script>
const D = JSON.parse(document.getElementById('dane').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const md = t => window.marked ? marked.parse(String(t ?? '')) : `<pre>${esc(t)}</pre>`;
const inline = t => md(t).replace(/^<p>|<\/p>\n?$/g, '');
const stCls = s => ({ 'hipoteza': 'st-hipoteza', 'przyjęta': 'st-przyjeta', 'odrzucona': 'st-odrzucona', 'zastąpiona': 'st-zastapiona' })[s] || '';
const sekcja = h => { const m = (D.md || '').match(new RegExp(`^## ${h}\\s*\\n([\\s\\S]*?)(?=^## |$(?![\\s\\S]))`, 'm')); return m ? m[1].trim() : ''; };
const rundy = (D.liczby || []).filter(l => l.typ === 'roznice');
const przed = rundy.find(l => l.runda === 'przed'), po = rundy.filter(l => l.runda !== 'przed').at(-1);
const kontrola = (D.liczby || []).filter(l => l.typ === 'kontrola').at(-1);
const dec = D.decyzje || [], pr = D.problemy || [];

function hero() {
  const h1 = (D.md || '').match(/^# (.+)$/m);
  if (h1) $('#title').textContent = h1[1];
  $('#eyebrow').textContent = `migracja danych · ${D.obszar}`;
  const filtr = (D.md || '').match(/^Filtr:\s*(.+)$/m);
  $('#status').textContent = `${filtr ? `filtr: ${filtr[1]} · ` : ''}widok z ${D.built} UTC`;
}

const runda = l => {
  if (!l) return null;
  const z = l.liczby?.zgodne, r = l.liczby?.rozne ?? l.roznice, n = l.liczby?.nieznam ?? l.nie_znam;
  return { z, r, n };
};
function liczby() {
  const by = s => dec.filter(d => d.status === s).length;
  const r = D.raport, a = runda(przed), b = runda(po);
  const pom = r ? (r.pominiete || []).reduce((s, p) => s + (p.ile || 0), 0) : 0;
  const tileRunda = (t, x, cel) => `<div class="tile"><div class="k">${t}</div><div class="big ${x ? (cel(x) ? 'ok' : 'warn') : 'muted'}">${x ? `${x.z ?? '—'} / ${x.r} / ${x.n}` : '—'}</div><div class="sub">zgodne / różne / nie znam</div></div>`;
  $('#liczby').innerHTML = `<div class="tiles">
    ${tileRunda('przed przeniesieniem', a, () => true)}
    ${tileRunda('po przeniesieniu', b, x => !x.r && !x.n)}
    <div class="tile"><div class="k">kontrola niezależna</div><div class="big ${kontrola ? (kontrola.ok ? 'ok' : 'bad') : 'muted'}">${kontrola ? `${kontrola.takie_same}/${kontrola.razem}` : '—'}</div><div class="sub">${kontrola ? `prosto ze starych tabel${Object.keys(kontrola.wyjasnione || {}).length ? ` · wyjaśnione: ${Object.entries(kontrola.wyjasnione).map(([d, n]) => `${n} ${d}`).join(', ')}` : ''}` : 'jeszcze nie'}</div></div>
    <div class="tile"><div class="k">decyzje</div><div class="big">${dec.length}</div><div class="sub">przyjęte ${by('przyjęta')} · odrzucone ${by('odrzucona')} · zastąpione ${by('zastąpiona')}${by('hipoteza') ? ` · <span class="warn">hipotezy ${by('hipoteza')}</span>` : ''}</div></div>
    <div class="tile"><div class="k">problemy</div><div class="big">${pr.length}</div><div class="sub"><span class="${pr.some(p => !p.wyjasnienie) ? 'bad' : 'ok'}">niewyjaśnione ${pr.filter(p => !p.wyjasnienie).length}</span> · otwarte ${pr.filter(p => p.wyjasnienie?.jak === 'otwarty').length}</div></div>
    <div class="tile"><div class="k">przeniesienie</div><div class="big">${r ? Object.values(r.przeniesione || {}).reduce((x, y) => x + y, 0) : '—'}</div><div class="sub">${r ? `${esc(Object.entries(r.przeniesione || {}).map(([k, v]) => `${k} ${v}`).join(' · '))}<br>pominięte ${pom}` : 'jeszcze nie'}</div></div>
  </div>`;
}

function lejek() {
  const zap = dec.reduce((s, d) => s + (d.zapytania?.length || 0), 0);
  const zrodlo = (D.zrodlo.match(/^\| \d+ \|/gm) || []).length;
  const E = [
    ['źródło', zrodlo, `${zrodlo} pozycji`],
    ['zakres 👤', sekcja('Zakres'), `filtr i jednostki`],
    ['kod', sekcja('Słownik dwóch języków'), `${dec.filter(d => d.podstawa === 'kod').length} hipotez z kodu`],
    ['dane', zap, `${zap} zapytań`],
    ['mapowanie', pr.some(p => p.rodzaj === 'układ'), `${pr.filter(p => p.rodzaj === 'układ').length} układów`],
    ['translator', D.raport, D.raport ? 'raport przeniesienia' : ''],
    ['różnice', przed || po, `${rundy.length} rund`],
    ['kontrola', kontrola, kontrola ? `${kontrola.takie_same}/${kontrola.razem}` : ''],
  ];
  $('#lejek').innerHTML = E.map(([n, ok, co], i) => `${i ? '<span class="arr">→</span>' : ''}<span class="etap ${ok ? 'done' : ''}"><span class="nr">${i}</span>${n}<span class="co">${ok ? esc(co) : '—'}</span></span>`).join('')
    + `<p class="muted" style="flex-basis:100%;margin:8px 0 0;font-size:.86rem">👤 tylko na starcie: człowiek wybiera filtr (porcję danych). Mapowanie ustala narzędzie z dowodem w danych; tu je czytasz.</p>`;
}

let filtr = 'wszystkie';
function decyzje() {
  const F = { 'wszystkie': () => true, 'przyjęte': d => d.status === 'przyjęta', 'odrzucone': d => d.status === 'odrzucona', 'zastąpione': d => d.status === 'zastąpiona', 'hipotezy': d => d.status === 'hipoteza', 'wczytane': d => !!d.z_pliku, 'pewność < 90': d => d.pewnosc < 90 };
  const pokaz = dec.filter(F[filtr]);
  $('#decyzje').innerHTML = `<h2>⚖️ Decyzje</h2>
    <p class="muted" style="margin-top:0">Każda decyzja: jak w starym modelu → jak w nowym, dlaczego, skąd (kod, dane), pewność i zapytania z wynikiem. Odrzucone i zastąpione zostają z historią.</p>
    <div class="filters">${Object.keys(F).filter(f => f === 'wszystkie' || dec.some(F[f])).map(f => `<button class="chip" data-filtr="${f}" aria-pressed="${f === filtr}">${f} (${dec.filter(F[f]).length})</button>`).join('')}</div>
    <div class="decs">${pokaz.length ? pokaz.map(dCard).join('') : '<p class="muted">Brak decyzji w tym widoku.</p>'}</div>`;
}
function dCard(d) {
  const qs = (d.zapytania || []).map(q => `<div class="q"><div class="k" style="text-transform:none;letter-spacing:0">${esc(q.data || '')} · ${esc(q.cel)}${q.z ? ` · z ${esc(q.z)}` : ''}</div><pre>${esc(q.sql)}</pre><div class="k">wynik</div><pre>${esc(q.wynik)}</pre></div>`).join('');
  const hist = (d.historia || []).map(h => `${esc(h.data)} ${esc(h.status)} ${h.pewnosc ?? ''}%${h.uwagi ? ' — ' + esc(h.uwagi) : ''}`).join('<br>');
  const war = (d.warianty || []).map(w => `<li>${inline(typeof w === 'string' ? w : `${w.wariant}${w.skutek ? ` — ${w.skutek}` : ''}`)}</li>`).join('');
  return `<article class="dec s-${esc((d.status || '').replace('ę', 'e').replace('ą', 'a'))}" id="${esc(d.id)}">
    <div class="dhead"><span class="did">${esc(d.id)}</span><span class="dob">${esc(d.obszar)}</span><span class="badge ${stCls(d.status)}">${esc(d.status)}</span>
      <span class="conf" title="pewność"><i><b style="width:${Math.max(0, Math.min(100, d.pewnosc))}%"></b></i>${esc(d.pewnosc)}%</span>
      ${d.z_pliku ? `<span class="badge" title="wczytana z wcześniejszego mapowania">z ${esc(d.z_pliku.plik)}${d.z_pliku.id ? ' ' + esc(d.z_pliku.id) : ''}</span>` : ''}
      ${d.zastapiona_przez ? `<span class="k" style="text-transform:none;letter-spacing:0">→ <a href="#${esc(d.zastapiona_przez)}">${esc(d.zastapiona_przez)}</a></span>` : ''}
      <span class="k" style="margin-left:auto">${esc(d.podstawa)}</span></div>
    <div class="map"><div><div class="k">stary model</div>${inline(d.stary)}</div><span class="arr">→</span><div><div class="k">nowy model</div>${inline(d.nowy)}</div></div>
    <div class="ddec">${inline(d.decyzja)}</div><div class="why">${inline(d.dlaczego)}</div>
    ${war ? `<details><summary>rozważone warianty (${d.warianty.length})</summary><ul>${war}</ul></details>` : ''}
    <div class="src">źródło: ${esc(d.zrodlo)}</div>
    ${qs ? `<details><summary>🔎 zapytania (${d.zapytania.length})</summary>${qs}</details>` : `<div class="k warn" style="text-transform:none;letter-spacing:0">bez zapytania do danych${d.bez_zapytania ? ': ' + esc(d.bez_zapytania) : ''}</div>`}
    ${hist ? `<details><summary>historia</summary><div class="src">${hist}</div></details>` : ''}
  </article>`;
}

function problemy() {
  const decLink = id => `<a href="#${esc(id)}">${esc(id)}</a>`;
  const grupy = ['układ', 'różnica', 'nie znam', 'niedostępne', 'pominięte', 'kontrola'].map(r => [r, pr.filter(p => p.rodzaj === r)]).filter(([, xs]) => xs.length);
  $('#problemy').innerHTML = `<h2>🧩 Problemy</h2>${pr.length ? grupy.map(([r, xs]) => `<div class="k" style="margin:10px 0 6px">${esc(r)} (${xs.length})</div><div class="probs">${xs.map(p => `
    <div class="prob ${p.wyjasnienie && p.wyjasnienie.jak !== 'otwarty' ? 'done' : 'open'}"><div><b>${esc(p.id)}</b> ${inline(p.opis)}${p.ile != null ? ` <span class="badge">${esc(p.ile)}</span>` : ''}</div>
    ${p.przyklady?.length ? `<details><summary>przykłady (${p.przyklady.length})</summary><pre>${esc(p.przyklady.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join('\n'))}</pre></details>` : ''}
    <div class="src">${p.wyjasnienie ? (p.wyjasnienie.jak === 'decyzja' ? `wyjaśnione decyzją ${decLink(p.wyjasnienie.decyzja)}` : p.wyjasnienie.jak === 'poprawka' ? `poprawka translatora: ${esc(p.wyjasnienie.opis)}` : p.wyjasnienie.jak === 'do kontroli' ? `do kontroli: ${esc(p.wyjasnienie.opis)}` : p.wyjasnienie.jak === 'sprawdzone' ? `sprawdzone w kontroli: ${esc(p.wyjasnienie.opis)}` : `<span class="bad">otwarte: ${esc(p.wyjasnienie.opis)}</span>`) : '<span class="bad">niewyjaśnione</span>'}${p.historia?.length > 1 ? ` · liczność: ${p.historia.map(h => h.ile).join(' → ')}` : ''}</div></div>`).join('')}</div>`).join('') : '<p class="muted">Jeszcze nic.</p>'}`;
}

function raport() {
  const r = D.raport;
  if (!r) { $('#raport').innerHTML = ''; return; }
  $('#raport').innerHTML = `<h2>🚚 Przeniesienie</h2><div class="scroll"><table><thead><tr><th>przeniesione</th><th>ile</th></tr></thead><tbody>${Object.entries(r.przeniesione || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div>
    <div class="scroll" style="margin-top:10px"><table><thead><tr><th>pominięte — powód</th><th>ile</th><th>decyzja</th><th>przykłady</th></tr></thead><tbody>${(r.pominiete || []).map(p => `<tr><td>${esc(p.powod)}</td><td>${esc(p.ile)}</td><td>${p.decyzja ? `<a href="#${esc(p.decyzja)}">${esc(p.decyzja)}</a>` : '<span class="bad">brak</span>'}</td><td class="src">${esc((p.przyklady || []).join(', '))}</td></tr>`).join('')}</tbody></table></div>
    ${r.uwagi ? `<p class="muted">${esc(r.uwagi)}</p>` : ''}`;
}

function rundyWidok() {
  const l = D.liczby || [];
  if (!l.length) { $('#rundy').innerHTML = ''; return; }
  $('#rundy').innerHTML = `<details><summary><h2 style="display:inline">📏 Rundy</h2> <span class="k">${l.length} · liczby.jsonl</span></summary><div class="scroll" style="margin-top:10px"><table><thead><tr><th>kiedy</th><th>runda</th><th>wynik</th></tr></thead><tbody>${l.map(x => `<tr><td class="src">${esc(x.data)}</td><td>${esc(x.runda)}</td><td>${x.typ === 'kontrola' ? `${x.ok ? '✓' : '✗'} ${x.takie_same}/${x.razem} takie same${x.rozne ? `, bez wyjaśnienia ${x.rozne}` : ''}` : `${Object.entries(x.liczby || {}).map(([k, v]) => `${k} ${v}`).join(', ') || '—'} · plik różnic: różnice ${x.roznice}, nie znam ${x.nie_znam}, grup ${x.grupy}`}</td></tr>`).join('')}</tbody></table></div></details>`;
}

function pliki() {
  const teksty = [['migracja.md', D.md], ['zrodlo/README.md', D.zrodlo], ...(D.artefakty || []).filter(a => a.tresc !== undefined && !['decyzje.json', 'problemy.json', 'liczby.jsonl'].includes(a.plik)).map(a => [a.plik, a.tresc])].filter(([, t]) => t);
  $('#pliki').innerHTML = `<h2>📝 Pliki</h2><div class="files">${teksty.map(([n]) => `<button data-plik="${esc(n)}">${esc(n)}</button>`).join('')}</div><div class="card viewer md" id="viewer"></div>`;
  const pokaz = n => { const t = teksty.find(x => x[0] === n)?.[1] ?? ''; $('#viewer').innerHTML = /\.md$/.test(n) ? md(t) : `<pre>${esc(t)}</pre>`; };
  if (teksty.length) pokaz(teksty[0][0]); else $('#viewer').innerHTML = '<span class="muted">Jeszcze nic.</span>';
  $('#pliki').addEventListener('click', e => { const b = e.target.closest('[data-plik]'); if (b) pokaz(b.dataset.plik); });
}

document.addEventListener('click', e => {
  const f = e.target.closest('[data-filtr]');
  if (f) { filtr = f.dataset.filtr; decyzje(); }
});
hero(); liczby(); lejek(); decyzje(); problemy(); raport(); rundyWidok(); pliki();
</script>
